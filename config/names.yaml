stages:               # "<chain>:<stage key>" for every stage of chains.yaml
  "batteries:li_ore":
    ko: 리튬 광석(스포듀민 정광)
    caveat_ko: "'달리 분류되지 않은 광물성 물질'을 담는 잔여 코드입니다. 리튬 정광이 이 코드의 대부분을 차지한 것은 2021~23년 가격 급등 이후부터입니다. 염호 리튬(칠레, 아르헨티나)은 광석 형태로 교역되지 않습니다."
  "batteries:nickel_ore":
    ko: 니켈 광석
    caveat_ko: "인도네시아는 2020년 광석 수출을 금지했습니다. 따라서 인도네시아의 광석은 이제 중간재와 니켈 선철 형태로만 나타납니다."
  "batteries:cobalt_ore":
    ko: 코발트 광석
    caveat_ko: 콩고민주공화국 코발트는 대부분 광석이 아니라 수산화물(S2 단계)로 나갑니다.
  "batteries:graphite_nat": {ko: 천연흑연}
  "batteries:li_carbonate": {ko: 탄산리튬}
  "batteries:li_hydroxide":
    ko: 수산화리튬
    caveat_ko: 산화리튬도 들어 있습니다.
  "batteries:nickel_int":
    ko: 니켈 매트·중간재(혼합수산화침전물 MHP 포함)
    caveat_ko: 황산니켈(2833.24)이 매트와 함께 이 단계에 들어 있습니다. 매트는 대부분 배터리가 아니라 스테인리스강으로 갑니다.
  "batteries:cobalt_int": {ko: 코발트 중간재·산화물·수산화물}
  "batteries:cathode":
    ko: 양극재(양극 활물질)
    caveat_ko: "고유 코드가 없습니다. NCM과 NCA는 대부분 2841.90에, LFP는 2842.90에 들어가며, 일부 세관은 3824.99로 분류합니다. 두 코드 모두 무관한 염류도 포함합니다."
  "batteries:anode":
    ko: 음극재(인조흑연)
    caveat_ko: 제강로용 전극의 원료이기도 합니다. 구상 천연흑연은 2504.90에 남습니다.
  "batteries:cell_parts":
    ko: 배터리 부품(분리막·캔 등)
    caveat_ko: "납축전지를 포함한 모든 축전지의 부품입니다. 분리막, 캔, 배터리 관리 부품은 이 코드로 분류됩니다. 전해액은 잔여 화학 코드에 들어가 따로 나타나지 않습니다."
  "batteries:cells":
    ko: 리튬이온 배터리 셀·팩
    caveat_ko: 휴대전화와 노트북 배터리가 자동차용 팩과 같은 코드에 들어 있습니다.
  "batteries:bev":
    ko: 순수전기차·플러그인 하이브리드차
    caveat_ko: HS2017 이전에는 전기차가 다른 차량과 함께 8703.90에 들어 있었습니다.

  "semiconductors:quartz": {ko: 석영(규석)}
  "semiconductors:si_metal":
    ko: "금속 실리콘(순도 99.99% 미만)"
    caveat_ko: 금속급 실리콘은 대부분 반도체가 아니라 알루미늄 합금과 실리콘(유기규소) 제품으로 갑니다.
  "semiconductors:polysilicon":
    ko: "폴리실리콘(순도 99.99% 이상)"
    caveat_ko: 태양광용과 반도체용이 같은 코드를 씁니다. 물량은 태양광용이 대부분입니다.
  "semiconductors:minor_metals":
    ko: 갈륨·게르마늄·인듐(미가공)
    caveat_ko: "니오븀·바나듐과 같은 코드를 씁니다. 갈륨은 화합물 웨이퍼로, 인듐은 디스플레이 전극(ITO)으로 갑니다."
  "semiconductors:wafers":
    ko: 도핑 웨이퍼
    caveat_ko: "반도체 웨이퍼(일본, 대만, 한국)와 태양광 웨이퍼(중국)가 한 코드에 들어 있습니다."
  "semiconductors:chip_tools":
    ko: 반도체 제조장비(부수 투입재)
    caveat_ko: "칩 안에 들어가는 재료가 아니라 자본재이므로, 부수 투입재로 그립니다."
  "semiconductors:photoresist":
    ko: 포토레지스트 등 사진용 화학제품(보조 투입)
    caveat_ko: "현상액, 정착액 등 다른 사진용 화학제품도 들어 있습니다. 일본·한국·대만 사이의 교역에서는 반도체·디스플레이용 포토레지스트가 대부분입니다. 2019년 일본의 대한국 수출규제는 이 코드를 대상으로 삼았습니다."
  "semiconductors:ics":
    ko: 집적회로
    caveat_ko: "칩 하나가 같은 코드로 여러 번 국경을 넘습니다(팹 → 조립·테스트 → 기판 제조사). 따라서 이 단계는 자기 자신으로 되돌아오는 고리를 이룹니다."
  "semiconductors:discretes":
    ko: 개별 소자(다이오드·트랜지스터·사이리스터)
    caveat_ko: "칩 옆에 실장되는 전력·신호 소자입니다. LED와 태양전지(8541.4)는 넣지 않았습니다."
  "semiconductors:pcb":
    ko: 인쇄회로기판(미실장)
    caveat_ko: "부품을 실장하지 않은 기판만입니다. 실장된 기판은 그것이 들어가는 기기의 부품(8517.79, 8473.30)으로 분류됩니다."
  "semiconductors:displays":
    ko: 평판 디스플레이 모듈
    caveat_ko: "HS2022에서 새로 생긴 호입니다. 그 전에는 디스플레이 모듈이 9013.80과 8529.90에 다른 광학기기·부품과 함께 들어 있었습니다. 따라서 시계열은 2022년부터입니다."
  "semiconductors:parts":
    ko: 휴대전화·컴퓨터 부품(실장 기판 등)
    caveat_ko: "실장 기판과 카메라 모듈부터 케이스까지 온갖 부품이 들어 있다. 8517.79에는 네트워크 장비 부품도 들어 있다. HS2022 이전의 8517.70은 모든 전화·전송 장치의 부품을 담았다."
  "semiconductors:phones":
    ko: 스마트폰
    caveat_ko: HS2022 이전에는 스마트폰이든 아니든 모든 휴대전화가 8517.12에 포함되었습니다.
  "semiconductors:computers": {ko: 노트북·컴퓨터 본체}

  "solar:quartz": {ko: 석영(규석)}
  "solar:si_metal": {ko: 금속 실리콘}
  "solar:polysilicon":
    ko: 폴리실리콘
    caveat_ko: "중국은 세계 폴리실리콘의 대부분을 생산해 자국에서 씁니다. 따라서 교역에는 다른 생산국의 잉여 물량만 나타납니다."
  "solar:wafers": {ko: 웨이퍼}
  "solar:pv_cells":
    ko: 태양전지
    caveat_ko: "HS2022에서 따로 분리되었습니다. 그 전에는 태양전지, 모듈, LED가 8541.40을 함께 썼습니다."
  "solar:pv_modules":
    ko: 태양광 모듈
    caveat_ko: "HS2022 이전에는 8541.40이며, 이 코드에는 태양전지와 LED도 포함됩니다."
  "solar:inverters":
    ko: 정지형 변환기(태양광 인버터 포함)
    caveat_ko: "충전기, 전원공급장치, 인버터를 아우르는 넓은 코드입니다. 이 사슬의 부수 제품입니다."

  "steel:iron_ore": {ko: 철광석(분광·괴광·펠릿)}
  "steel:coal":
    ko: 유연탄(원료탄 포함)
    caveat_ko: HS에는 원료탄 코드가 없습니다. 발전용 연료탄도 같은 소호에 들어 있습니다.
  "steel:scrap": {ko: 철 스크랩}
  "steel:coke": {ko: 코크스}
  "steel:pig_iron": {ko: 선철}
  "steel:dri": {ko: 직접환원철}
  "steel:ferroalloys": {ko: 페로알로이}
  "steel:semis": {ko: 반제품(슬래브·빌릿)}
  "steel:flat": {ko: 열연·냉연·도금 강판}
  "steel:elec_steel":
    ko: 전기강판
    caveat_ko: "변압기와 모터에 들어가며, 구리 사슬과 자석 사슬로 이어지는 연결 고리입니다."
  "steel:car_parts": {ko: 자동차 부품·엔진}
  "steel:cars": {ko: 승용차}

  "aluminium:bauxite": {ko: 보크사이트}
  "aluminium:alumina":
    ko: 알루미나
