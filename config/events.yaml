  - id: us-chip-controls-2022
    num: "7"
    start: 2022-10-07
    end: null
    ongoing: true
    kind: export-control
    title: {en: "US curbs exports of advanced chips and chip tools to China", ko: "미국, 대중 첨단 반도체·장비 수출통제"}
    dek:
      en: "On 7 October 2022 the US Commerce Department restricted China's access to advanced chips and to the equipment that makes them, and tightened the rules in October 2023 and December 2024. Japan's controls on 23 types of chip-making equipment took effect on 23 July 2023 and the Netherlands' on 1 September 2023."
      ko: "미국 상무부는 2022년 10월 7일 중국의 첨단 반도체와 그 제조장비 확보를 제한했습니다. 2023년 10월과 2024년 12월에는 규정을 강화했습니다. 일본의 반도체 제조장비 23개 품목 통제는 2023년 7월 23일, 네덜란드의 통제는 2023년 9월 1일 시행됐습니다."
    timeline:
      - {date: 2022-10-07, en: "US restricts advanced chips and chip tools for China", ko: "미국, 대중 첨단 반도체·장비 수출통제", source: 1}
      - {date: 2023-07-23, en: "Japan's controls on 23 types of chip tools take effect", ko: "일본, 반도체 장비 23개 품목 수출통제 시행", source: 3}
      - {date: 2023-09-01, en: "Dutch licence requirement for advanced chip tools starts", ko: "네덜란드, 첨단 반도체 장비 수출 허가제 시행", source: 4}
      - {date: 2023-10-17, en: "US tightens and widens the 2022 rules", ko: "미국, 2022년 규정 강화·확대", source: 2}
      - {date: 2024-09-07, en: "Netherlands extends licences to more DUV lithography tools", ko: "네덜란드, 허가 대상 DUV 노광장비 확대", source: 4}
      - {date: 2024-12-02, en: "US adds controls on more chip tools and on HBM memory", ko: "미국, 장비 통제 확대·고대역폭메모리(HBM) 통제", source: 5}
      - {date: 2026-01-15, en: "US moves Nvidia H200 sales to China to case-by-case review", ko: "미국, 엔비디아 H200 대중 수출 개별 심사로 전환", source: 6}
    products: ["B:chip_equipment", "C:semiconductors:ics"]
    economies: [USA, CHN, JPN, NLD]
    view: {f: M, p: "B:chip_equipment", base: 202209, t: 202309, lens: M}
    watch:
      en: "China's imports of chip-making machines before and after each round of controls, and the shares of Japan, the Netherlands and the US among its suppliers; China's chip trade alongside."
      ko: "통제가 강화될 때마다 중국의 반도체 제조장비 수입이 어떻게 변하는지 살펴봅니다. 공급국 가운데 일본·네덜란드·미국의 비중 변화도 중국의 반도체 교역과 함께 확인합니다."
    reading:
      window:
        en: "Jul–Sep 2023 ends on the day the Dutch rule took effect (1 September 2023) and precedes the US tightening of 17 October 2023. In the series on this page the Dutch share going to China held at 42–48% through March 2024, and China's imports were still +69% on a year earlier."
        ko: "2023년 7~9월은 네덜란드 규제가 시행된 날(2023년 9월 1일)에 끝나며, 미국이 규제를 강화한 2023년 10월 17일보다 앞섭니다. 이 페이지의 계열에서 네덜란드 수출 가운데 중국 비중은 2024년 3월까지 42~48%를 유지했습니다. 중국의 수입도 여전히 전년보다 69% 많았습니다."
      items:
        - kind: scope
          number:
            en: "Netherlands → China: 11.0% → 47.5% of Dutch chip-making equipment exports, $513m → $2.7bn (Jul–Sep 2022 → Jul–Sep 2023)."
            ko: "네덜란드의 반도체 제조장비 수출 가운데 중국 비중은 11.0%에서 47.5%로 높아졌고, 금액은 513m달러에서 2.7bn달러로 늘었습니다(2022년 7~9월 → 2023년 7~9월)."
          en: "The Dutch licence rule in force from 1 September 2023 covers only ASML's most advanced immersion DUV systems (NXT:2000i and later). ASML says Chinese customers had received far fewer systems than ordered in 2021–22, and other customers' 2023 delays let it backfill those orders for mature and mid-critical nodes; its net sales to China rose from €2.9bn (2022) to €7.3bn (2023)."
          ko: "2023년 9월 1일 시행된 네덜란드 허가제의 대상은 ASML의 최첨단 액침 DUV 장비뿐입니다(NXT:2000i 이후 기종). ASML에 따르면 중국 고객은 2021~22년에 주문한 것보다 훨씬 적은 장비를 받았습니다. 2023년 다른 고객의 납품 연기로 ASML은 그 주문을 성숙·중간 공정용으로 채울 수 있었습니다. ASML의 중국 매출은 29억 유로(2022년)에서 73억 유로(2023년)로 늘었습니다."
          sources: [7, 8]
          checked: 2026-10-25
        - kind: cycle
          number:
            en: "China's chip-making equipment imports +30.7% ($9.2bn → $12.0bn) while world trade fell 8.6%."
            ko: "중국의 반도체 제조장비 수입은 30.7% 늘었습니다($9.2bn → $12.0bn). 같은 기간 세계 교역은 8.6% 줄었습니다."
          en: "SEMI's industry figures for 2023 show the same split: equipment billings in China rose 29% to $36.6bn, the largest market, while worldwide billings fell 1.3% to $106.3bn; Korea fell 7% on softer demand and the memory inventory correction, and Taiwan 27%."
          ko: "SEMI의 2023년 업계 집계에서도 같은 차이가 나타납니다. 중국의 장비 매출은 29% 늘어 366억 달러로 가장 큰 시장이었습니다. 세계 전체는 1.3% 줄어 1,063억 달러였습니다. 한국은 수요 둔화와 메모리 재고 조정으로 7%, 대만은 27% 줄었습니다."
          sources: [9]
          checked: 2026-10-25
        - kind: denominator
          number:
            en: "Japan → China: 35.6% → 51.8% of Japan's chip-making equipment exports, but only +$205m (+7%)."
            ko: "일본의 반도체 제조장비 수출 가운데 중국 비중은 35.6%에서 51.8%로 높아졌습니다. 금액은 $205m(+7%) 늘어나는 데 그쳤습니다."
          en: "Japan's exports fell 26.5% overall ($8.4bn → $6.2bn): Japan → Asia, not elsewhere specified (most importers' records of Taiwan) lost $1.1bn (−63.1%) and Japan → United States $437m, in the year SEMI records a 27% fall in Taiwan's equipment purchases. Most of the share gain is the denominator shrinking, not more tools going to China."
          ko: "일본의 수출은 전체로 26.5% 줄었습니다($8.4bn → $6.2bn). 기타 아시아(대부분 수입국이 대만을 이렇게 기록합니다)로 가는 수출이 $1.1bn(−63.1%), 미국으로 가는 수출이 $437m 줄었습니다. 이 해는 SEMI 집계로 대만의 장비 구매가 27% 줄어든 해입니다. 중국 비중이 높아진 것은 대부분 분모가 줄었기 때문이며, 중국으로 간 장비가 늘어서가 아닙니다."
          sources: [9]
          checked: 2026-10-25
        - kind: scope
          number:
            en: "United States chip-making equipment exports −33.8% ($7.0bn → $4.6bn)."
            ko: "미국의 반도체 제조장비 수출은 33.8% 줄었습니다($7.0bn → $4.6bn)."
          en: "US → China fell only $184m (−12%); the fall is in Asia, not elsewhere specified (most importers' records of Taiwan, −$879m), Korea (−$592m) and Singapore (−$527m), which the controls do not touch. The October 2022 rule's equipment licence requirement applies to fabs making logic at 16/14 nm or below, DRAM at 18 nm half-pitch or below and NAND with 128 layers or more."
          ko: "미국의 중국 수출은 $184m(−12%) 줄어드는 데 그쳤습니다. 감소는 규제 대상이 아닌 기타 아시아(대부분 수입국이 대만을 이렇게 기록합니다, −$879m), 한국(−$592m), 싱가포르(−$527m)에서 나왔습니다. 2022년 10월 규제의 장비 수출 허가 요건은 16/14nm 이하 로직, 하프피치 18nm 이하 DRAM, 128단 이상 NAND를 생산하는 공장에 적용됩니다."
          sources: [1, 10]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "Commerce Implements New Export Controls on Advanced Computing and Semiconductor Manufacturing Items to the People's Republic of China (PRC)", publisher: "US Department of Commerce, Bureau of Industry and Security", date: 2022-10-07, url: "https://www.bis.gov/press-release/commerce-implements-new-export-controls-advanced-computing-semiconductor-manufacturing-items-peoples"}
      - {n: 2, title: "Commerce Strengthens Restrictions on Advanced Computing Semiconductors, Semiconductor Manufacturing Equipment, and Supercomputing Items to Countries of Concern", publisher: "US Department of Commerce, Bureau of Industry and Security", date: 2023-10-17, url: "https://www.bis.gov/press-release/commerce-strengthens-restrictions-advanced-computing-semiconductors-semiconductor-manufacturing-equipment"}
      - {n: 3, title: "Japan announces amendment of export control regulations on additional semiconductor-related items", publisher: "Baker McKenzie (Tokyo), client alert", date: 2023-05-30, url: "https://www.bakermckenzie.co.jp/wp/wp-content/uploads/20230530_ClientAlert_ITC.Japan_.pdf"}
      - {n: 4, title: "The Netherlands expands export control measure for advanced semiconductor manufacturing equipment", publisher: "Government of the Netherlands", date: 2024-09-06, url: "https://www.government.nl/latest/news/2024/09/06/the-netherlands-expands-export-control-measure-advanced-semiconductor-manufacturing-equipment"}
      - {n: 5, title: "Foreign-Produced Direct Product Rule Additions, and Refinements to Controls for Advanced Computing and Semiconductor Manufacturing Items (89 FR 96790)", publisher: "Federal Register (Bureau of Industry and Security)", date: 2024-12-05, url: "https://www.federalregister.gov/documents/2024/12/05/2024-28270/foreign-produced-direct-product-rule-additions-and-refinements-to-controls-for-advanced-computing"}
      - {n: 6, title: "Revision to License Review Policy for Advanced Computing Commodities", publisher: "Federal Register (Bureau of Industry and Security)", date: 2026-01-15, url: "https://www.federalregister.gov/documents/2026/01/15/2026-00789/revision-to-license-review-policy-for-advanced-computing-commodities"}
      - {n: 7, title: "Kabinet publiceert aanvullende exportmaatregelen geavanceerde productieapparatuur voor halfgeleiders", publisher: "Rijksoverheid (Ministerie van Buitenlandse Zaken)", date: 2023-06-30, url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/06/30/aanvullende-exportmaatregelen-kabinet-voor-geavanceerde-productieapparatuur-halfgeleiders"}
      - {n: 8, title: "2023 Annual Report based on US GAAP (Form 6-K)", publisher: "ASML Holding N.V., via SEC EDGAR", date: 2024-02-14, url: "https://www.sec.gov/Archives/edgar/data/937966/000093796624000010/a2023annualreportbasedon.htm"}
      - {n: 9, title: "Global Semiconductor Equipment Billings Slip to $106.3 Billion in 2023, SEMI Reports", publisher: "SEMI", date: 2024-04-10, url: "https://www.semi.org/en/news-media-press-releases/semi-press-releases/global-semiconductor-equipment-billings-slip-to-$106.3-billion-in-2023-semi-reports"}
      - {n: 10, title: "Implementation of Additional Export Controls: Certain Advanced Computing and Semiconductor Manufacturing Items; Supercomputer and Semiconductor End Use; Entity List Modification (87 FR 62186)", publisher: "Federal Register (Bureau of Industry and Security)", date: 2022-10-13, url: "https://www.federalregister.gov/documents/2022/10/13/2022-21658/implementation-of-additional-export-controls-certain-advanced-computing-and-semiconductor-manufacturing-items"}

  - id: china-gallium-germanium-2023
    num: "8"
    start: 2023-08-01
    end: null
    ongoing: true
    kind: export-control
    title: {en: "China licenses exports of gallium, germanium and graphite", ko: "중국, 갈륨·게르마늄·흑연 수출 허가제"}
    dek:
      en: "China made exports of gallium and germanium subject to licences from 1 August 2023, and exports of some graphite from 1 December 2023. On 3 December 2024 it barred exports of gallium, germanium and antimony to the US in principle, and on 9 November 2025 it suspended that ban until 27 November 2026."
      ko: "중국은 2023년 8월 1일부터 갈륨·게르마늄, 2023년 12월 1일부터 일부 흑연 수출에 허가를 받게 했습니다. 2024년 12월 3일에는 갈륨·게르마늄·안티모니의 대미 수출을 원칙적으로 불허했습니다. 2025년 11월 9일에는 이 금지를 2026년 11월 27일까지 유예했습니다."
    timeline:
      - {date: 2023-07-03, en: "China announces licensing of gallium and germanium exports", ko: "중국, 갈륨·게르마늄 수출 허가제 발표", source: 1}
      - {date: 2023-08-01, en: "Gallium and germanium licensing takes effect", ko: "갈륨·게르마늄 수출 허가제 시행", source: 1}
      - {date: 2023-10-20, en: "China announces licensing of some graphite exports", ko: "중국, 일부 흑연 수출 허가제 발표", source: 2}
      - {date: 2023-12-01, en: "Graphite licensing takes effect", ko: "흑연 수출 허가제 시행", source: 2}
      - {date: 2024-12-03, en: "China bars gallium, germanium and antimony exports to the US", ko: "중국, 갈륨·게르마늄·안티모니 대미 수출 불허", source: 3}
      - {date: 2025-11-09, en: "Ban on exports to the US suspended until 27 Nov 2026", ko: "대미 수출금지, 2026년 11월 27일까지 유예", source: 4}
    products: ["C:semiconductors:minor_metals", "C:batteries:graphite_nat", "C:batteries:anode"]
    economies: [CHN, USA]
    view: {f: M, p: "C:semiconductors:minor_metals", base: 202307, t: 202407, lens: L}
    watch:
      en: "China's exports of gallium and germanium metal before and after August 2023, and of graphite after December 2023, by destination; whether importers turn to other suppliers."
      ko: "2023년 8월 전후 중국의 갈륨·게르마늄 수출과 12월 이후 흑연 수출이 행선지별로 어떻게 바뀌는지 살펴봅니다. 수입국이 다른 수입선으로 옮겨 가는지도 확인합니다."
    reading:
      window:
        en: "Aug 2022–Jul 2023 ends with the July 2023 rush (8.78 tons of germanium and 7.58 of gallium shipped; none in August). Aug 2023–Jul 2024 holds the two empty months, October's trickle (0.65 and 0.25 tons), the recovery as licences were granted and eight months of the graphite licence; the US ban of 3 December 2024 lies outside both."
        ko: "2022년 8월~2023년 7월은 2023년 7월의 선적 몰림으로 끝납니다. 그달 게르마늄 8.78톤, 갈륨 7.58톤이 수출됐고 8월은 0이었습니다. 2023년 8월~2024년 7월에는 수출이 끊긴 두 달과 10월의 소량 재개(0.65톤과 0.25톤)가 들어 있습니다. 허가가 나오며 회복한 기간과 흑연 허가제 8개월도 포함됩니다. 2024년 12월 3일의 대미 수출금지는 두 기간 모두의 밖에 있습니다."
      items:
        - kind: definition
          number:
            en: "China · exports of Gallium, germanium, indium (unwrought) +10.9% ($144m → $160m), Aug 2022–Jul 2023 → Aug 2023–Jul 2024."
            ko: "중국의 갈륨·게르마늄·인듐(비가공) 수출은 10.9% 늘었습니다($144m → $160m, 2022년 8월~2023년 7월 → 2023년 8월~2024년 7월)."
          en: "HS 8112.92, the code behind this page, holds unwrought gallium and germanium alongside indium and niobium, which no licence covers; the announcement's gallium compounds, germanium dioxide and tetrachloride fall under other headings. China shipped 347 tons of indium in January–September 2024, 74% to Korea, against 94 tons of gallium and 44 tons of germanium in all of 2022."
          ko: "이 페이지의 코드 HS 8112.92에는 미가공 갈륨·게르마늄과 함께 허가 대상이 아닌 인듐·니오븀이 들어 있습니다. 공고가 열거한 갈륨 화합물과 이산화게르마늄·사염화게르마늄은 다른 호에 속합니다. 중국은 2024년 1~9월 인듐 347톤을 수출했고, 그중 74%가 한국으로 향했습니다. 2022년 한 해 중국의 갈륨 수출은 94톤, 게르마늄은 44톤이었습니다."
          sources: [1, 7, 8, 9]
          checked: 2026-10-25
        - kind: price
          number:
            en: "World trade in Gallium, germanium, indium (unwrought) +6.8% ($433m → $463m, 12-month sums)."
            ko: "갈륨·게르마늄·인듐(비가공)의 세계 교역은 6.8% 늘었습니다($433m → $463m, 12개월 합계)."
          en: "Values here are dollars, and all three metals got dearer: USGS puts primary gallium in China at $380 a kilogram in June 2024, 58% above June 2023; germanium metal in Europe at $1,550 → $2,950 over January–September 2024; US indium at $340 in 2024, 42% above 2023. By weight, China's germanium metal exports in January–August 2024 were 55% below a year earlier."
          ko: "이 페이지의 값은 달러 금액이며 세 금속 모두 가격이 올랐습니다. USGS에 따르면 중국의 1차 갈륨은 2024년 6월 kg당 380달러로 2023년 6월보다 58% 높았습니다. 유럽의 게르마늄 금속은 2024년 1~9월에 1,550달러에서 2,950달러로 올랐습니다. 미국 인듐은 2024년 340달러로 2023년보다 42% 높았습니다. 물량 기준으로는 중국의 2024년 1~8월 게르마늄 금속 수출이 전년동기대비 55% 감소했습니다."
          sources: [5, 6, 7]
          checked: 2026-10-25
        - kind: scope
          number:
            en: "China → United States: $30.1m → $38.7m (+28.5%); 19.5% → 19.5% of US imports."
            ko: "중국 → 미국 수출은 $30.1m에서 $38.7m로 늘었습니다(+28.5%). 미국 수입에서 중국이 차지하는 비중은 19.5%에서 19.5%로 같습니다."
          en: "The 2023 measure requires a licence; the ban on exports to the United States came on 3 December 2024, after this window. USGS puts China at 19% of US gallium metal imports and 51% of germanium metal imports in 2020–23, and at 25% of US indium imports as of September 2024, against an 8% average over the previous four years."
          ko: "2023년 조치는 허가제이고, 대미 수출금지는 이 기간 뒤인 2024년 12월 3일에 나왔습니다. USGS 집계로 2020~23년 미국의 갈륨 금속 수입의 19%, 게르마늄 금속 수입의 51%가 중국산이었습니다. 2024년 9월 기준 미국 인듐 수입의 25%가 중국산으로, 지난 4년 평균 8%보다 높았습니다."
          sources: [1, 3, 5, 6, 7]
          checked: 2026-10-25
        - kind: front-loading
          number:
            en: "China's share of world Natural graphite exports 61.4% → 63.2%, world −35.0% (Jul 2023 → Jul 2024, 12-month sums)."
            ko: "세계 천연흑연 수출에서 중국이 차지하는 비중은 61.4%에서 63.2%로 높아졌습니다. 세계 수출 증감률은 −35.0%입니다(2023년 7월 → 2024년 7월, 12개월 합계)."
          en: "Licences from 1 December 2023 cover natural flake graphite and its products, spherical included, and high-purity artificial graphite. Flake exports fell from 23,502 tonnes in November 2023 to 1,427 in December, a drop Fastmarkets' sources put down to a November rush to buy and long licence reviews; USGS has China's flake exports 78% below a year earlier in January–February 2024 and 4% below in March–October."
          ko: "2023년 12월 1일부터의 허가제는 천연 인상흑연과 그 제품(구상흑연 포함), 고순도 인조흑연을 대상으로 합니다. 인상흑연 수출은 2023년 11월 23,502톤에서 12월 1,427톤으로 줄었습니다. Fastmarkets의 취재원들은 11월의 선매수와 긴 허가 심사 기간을 그 이유로 들었습니다. USGS에 따르면 중국의 인상흑연 수출은 2024년 1~2월에 전년동기대비 78% 적었고, 3~10월에는 4% 적었습니다."
          sources: [2, 11, 12]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "MOFCOM and GAC Announcement No. 23 of 2023 on export controls on gallium- and germanium-related items (text reproduced by Hong Kong's Trade and Industry Department)", publisher: "Ministry of Commerce and General Administration of Customs of China", date: 2023-07-03, url: "https://www.tid.gov.hk/en/tradecircular/files/2023/ci2023453a.pdf"}
      - {n: 2, title: "MOFCOM and GAC announcement on optimising the temporary export controls on graphite items (text reproduced by Hong Kong's Trade and Industry Department)", publisher: "Ministry of Commerce and General Administration of Customs of China", date: 2023-10-20, url: "https://www.tid.gov.hk/en/tradecircular/files/2023/ci2023773a.pdf"}
      - {n: 3, title: "MOFCOM Announcement No. 46 of 2024 on strengthening export controls on related dual-use items to the United States", publisher: "Ministry of Commerce of China", date: 2024-12-03, url: "https://www.mofcom.gov.cn/zwgk/zcfb/art/2024/art_3d5e990b43424e60828030f58a547b60.html"}
      - {n: 4, title: "MOFCOM Announcement No. 72 of 2025 on adjusting the implementation of Announcement No. 46 of 2024", publisher: "Ministry of Commerce of China", date: 2025-11-09, url: "https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_5c68985a6b1a46778e2e8dbff1bb1601.html"}
      - {n: 5, title: "Mineral Commodity Summaries 2025: Gallium", publisher: "U.S. Geological Survey", date: 2025-01-31, url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf"}
      - {n: 6, title: "Mineral Commodity Summaries 2025: Germanium", publisher: "U.S. Geological Survey", date: 2025-01-31, url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-germanium.pdf"}
      - {n: 7, title: "Mineral Commodity Summaries 2025: Indium", publisher: "U.S. Geological Survey", date: 2025-01-31, url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-indium.pdf"}
      - {n: 8, title: "Mineral Commodity Summaries 2025: Niobium (Columbium)", publisher: "U.S. Geological Survey", date: 2025-01-31, url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-niobium.pdf"}
      - {n: 9, title: "China allows a trickle of critical minerals exports ahead of graphite curbs", publisher: "Bloomberg (via AJOT)", date: 2023-11-22, url: "https://www.ajot.com/news/china-allows-a-trickle-of-critical-minerals-exports-ahead-of-graphite-curbs"}
      - {n: 10, title: "China exports zero germanium, gallium in August amid national security curbs", publisher: "Reuters (via CNBC)", date: 2023-09-20, url: "https://www.cnbc.com/2023/09/20/china-exports-zero-germanium-gallium-in-august-amid-national-security-curbs.html"}
      - {n: 11, title: "China's graphite exports plunge in December after introduction of export controls", publisher: "Fastmarkets", date: 2024-01-24, url: "https://www.fastmarkets.com/insights/chinas-graphite-exports-plunge-in-december-after-introduction-of-export-controls/"}
      - {n: 12, title: "Mineral Commodity Summaries 2025: Graphite (Natural)", publisher: "U.S. Geological Survey", date: 2025-01-31, url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-graphite.pdf"}

  - id: red-sea-2023
    num: "9"
    start: 2023-11-19
    end: null
    ongoing: true
    kind: logistics
    title: {en: "Houthi attacks in the Red Sea send ships around the Cape", ko: "후티 홍해 공격, 선박들 희망봉 우회"}
    dek:
      en: "Yemen's Houthis seized the Galaxy Leader on 19 November 2023 and went on to attack merchant ships; from December 2023 container lines diverted around the Cape of Good Hope. Attacks paused in November 2025, a first return to Suez in February 2026 was reversed as the Iran war began, and returns gathered pace from July 2026: in early October 2026 container transits passed half their 2023 level for the first time."
      ko: "예멘 후티 반군은 2023년 11월 19일 갤럭시 리더호를 나포한 뒤 상선을 잇따라 공격했습니다. 컨테이너 선사들은 2023년 12월부터 희망봉으로 우회했습니다. 공격은 2025년 11월 멈췄습니다. 2026년 2월의 첫 수에즈 복귀는 이란 전쟁이 시작되며 되돌려졌습니다. 2026년 7월부터 복귀가 이어져, 10월 초 수에즈 통과 컨테이너선 용량이 처음으로 2023년의 절반을 넘었습니다."
    timeline:
      - {date: 2023-11-19, en: "Houthis seize the Galaxy Leader in the Red Sea", ko: "후티, 홍해에서 갤럭시 리더호 나포", source: 1}
      - {date: 2024-01-12, en: "UK and US strike Houthi military targets in Yemen", ko: "영국·미국, 예멘 후티 군사시설 공습", source: 2}
      - {date: 2024-02-22, en: "UNCTAD: container tonnage through Suez down 82%", ko: "UNCTAD, 수에즈 통과 컨테이너 톤수 82% 감소", source: 3}
      - {date: 2025-11-11, en: "Houthi attacks on ships pause for about three and a half months", ko: "후티 상선 공격, 약 3개월 반 중단", source: 4}
      - {date: 2026-02-03, en: "Maersk and Hapag-Lloyd's ME11 service returns to Suez", ko: "머스크·하파크로이트 ME11 노선 수에즈 복귀", source: 4}
      - {date: 2026-03-02, en: "Houthis say they will resume attacks after strikes on Iran", ko: "이란 공습 뒤 후티, 공격 재개 예고", source: 4}
      - {date: 2026-07-06, en: "Gemini Alliance moves AE15/SE3 back to Suez", ko: "제미니 동맹, AE15/SE3 노선 수에즈 복귀 발표", source: 5}
      - {date: 2026-10-19, en: "BIMCO: Suez container transits pass half the 2023 level", ko: "BIMCO, 수에즈 컨테이너 통과량 2023년의 절반 넘어", source: 5}
    products: ["TOTAL", "B:natural_gas", "B:refined_oil"]
    economies: [YEM, EGY, ISR]
    view: {f: M, p: "TOTAL", base: 202302, t: 202402, lens: M}
    watch:
      en: "Whether Asia–Europe trade values hold while their timing shifts. Customs data record origin and destination, not the route or the freight paid, so the diversion itself does not show in the network."
      ko: "아시아–유럽 교역액은 유지되고 시점만 밀리는지 살펴봅니다. 통관자료는 출발국과 도착국만 기록하고 항로와 운임은 담지 않습니다. 따라서 우회 자체는 네트워크에 드러나지 않습니다."
    reading:
      window:
        en: "Dec 2023–Feb 2024 starts a month into the attacks (first seizure 19 November 2023) and covers the months container lines left the Red Sea: weekly Suez passages were down more than 45% in February 2024 and Cape passages had more than doubled. Customs values record origin and destination, not the route: the page shows the immediate effect on who traded with whom."
        ko: "2023년 12월~2024년 2월은 공격 시작(2023년 11월 19일 첫 나포) 한 달 뒤부터의 석 달입니다. 이 기간은 컨테이너 선사들이 홍해를 떠난 기간입니다. 2024년 2월 수에즈 주간 통과 척수는 전년동월대비 45% 넘게 줄었고, 희망봉 통과는 두 배를 넘었습니다. 통관 금액은 출발국과 도착국만 기록하고 항로는 기록하지 않습니다. 따라서 이 페이지의 수치는 누가 누구와 교역했는지에 미친 즉각적 효과입니다."
      items:
        - kind: definition
          number:
            en: "World all-goods trade −2.7% on a year earlier (Dec 2023–Feb 2024, $5.5tn), after −1.3% at the base (Dec 2022–Feb 2023, $5.7tn)."
            ko: "세계 전체 상품 교역은 전년동기대비 −2.7%입니다(2023년 12월~2024년 2월, $5.5tn). 기준 기간(2022년 12월~2023년 2월, $5.7tn)에는 −1.3%였습니다."
          en: "The disruption moved ships, not origins and destinations. Suez Canal trade volume in January–February 2024 was down 50% on a year earlier and Cape of Good Hope transit up 74%; containerised shipments through the canal fell 72% between November 2023 and February 2024 and Asia-to-Europe freight rates rose 270% on February 2023, while containers shipped worldwide in January still topped 14 million."
          ko: "교란은 배의 항로를 바꿨지, 출발국과 도착국을 바꾸지 않았습니다. 2024년 1~2월 수에즈 운하 통과 교역량은 전년동기대비 50% 줄고 희망봉 우회는 74% 늘었습니다. 운하를 지나는 컨테이너 화물은 2023년 11월~2024년 2월에 72% 줄었습니다. 아시아→유럽 운임은 2023년 2월 대비 270% 올랐습니다. 그래도 1월 세계 컨테이너 운송량은 1,400만 개를 넘었습니다."
          sources: [6, 7, 8]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Yemen's imports $561m → $644m (Dec 2022–Feb 2023 → Dec 2023–Feb 2024), no change bar: its partners' reports at the base, its own at t."
            ko: "예멘의 수입은 $561m에서 $644m입니다(2022년 12월~2023년 2월 → 2023년 12월~2024년 2월). 변화 막대는 표시하지 않습니다. 기준 시점은 상대국 보고, t 시점은 예멘 자체 보고이기 때문입니다."
          en: "Yemen filed no monthly data to UN Comtrade for 2020–2022; its monthly series begins in January 2023. The base window is therefore read from its partners' export reports and the later one from Yemen's own report, which puts $644m against the $2.5bn that 72 partners report shipping to Yemen in the same three months."
          ko: "예멘은 2020~2022년 월별 자료를 UN Comtrade에 제출하지 않았습니다. 예멘의 월별 자료는 2023년 1월부터 있습니다. 따라서 기준 창은 교역 상대국의 수출 보고로, 이후 창은 예멘 자체 보고로 읽습니다. 예멘 보고로는 $644m입니다. 같은 3개월 동안 72개 상대국이 예멘으로 수출했다고 보고한 금액은 $2.5bn입니다."
          sources: [9]
          checked: 2026-10-25
        - kind: overlap
          number:
            en: "Israel's imports −12.8% ($22.3bn → $19.4bn); Israel's exports −1.6% ($18.9bn → $18.6bn)."
            ko: "이스라엘의 수입은 −12.8%($22.3bn → $19.4bn), 수출은 −1.6%($18.9bn → $18.6bn)입니다."
          en: "The war from 7 October 2023 falls inside the later window: the Bank of Israel says it split the year, with GDP contracting and imports declining considerably in the fourth quarter. Israel's statistics bureau puts 2023 goods imports at NIS 332.9bn (−6.7%); in October–December trend imports excluding ships, aircraft, diamonds and fuels fell at a 13.9% annual rate, consumer goods at 18.5%."
          ko: "2023년 10월 7일 시작된 전쟁이 뒤 기간에 들어 있습니다. 이스라엘은행은 전쟁으로 그해가 전후로 갈렸다고 분석했습니다. 4분기에는 GDP가 줄고 수입이 크게 감소했습니다. 이스라엘 중앙통계국은 2023년 상품 수입을 3,329억 셰켈(−6.7%)로 집계했습니다. 10~12월 선박·항공기·다이아몬드·연료를 뺀 수입 추세는 연율 13.9%, 소비재는 18.5% 줄었습니다."
          sources: [11, 10]
          checked: 2026-10-25
        - kind: overlap
          number:
            en: "Egypt's exports −9.5% ($13.6bn → $12.3bn); Egypt → Italy 8.4% → 4.3% of Egypt's exports."
            ko: "이집트의 수출은 −9.5%($13.6bn → $12.3bn)입니다. 이집트 수출에서 이탈리아가 차지하는 비중은 8.4%에서 4.3%로 낮아졌습니다."
          en: "Egypt exported no LNG cargo between July and October 2023 as gas went to summer power demand, and its 2023 LNG exports fell nearly 50% to 3.7 million tonnes. In this store's natural gas basket Egypt's exports fell from $2.58bn to $436m between the two windows and the flow to Italy from $514m to $26m, more than the whole fall in Egypt's exports."
          ko: "이집트는 여름 전력 수요에 가스를 돌리느라 2023년 7~10월에 LNG를 한 척도 수출하지 않았습니다. 2023년 LNG 수출은 50% 가까이 줄어 370만 톤이었습니다. 이 사이트의 천연가스 품목 묶음에서 이집트 수출은 두 기간 사이 25억 8,000만 달러에서 4억 3,600만 달러로 줄었습니다. 이탈리아행은 5억 1,400만 달러에서 2,600만 달러로 줄어, 이집트 수출 감소분 전체보다 큽니다."
          sources: [12]
          checked: 2026-10-25
