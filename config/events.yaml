# Economic events for trade-flow: the curated catalogue behind the
# diamonds on every time strip, the event cards in the drawer and the event pages. In date order.
#
# Fields: `num` is the event's number; `start`/`end` ISO dates (end null while `ongoing`); `kind` one of
# crisis, disaster, tariff, export-control, ban, pandemic, logistics, war, sanctions. `timeline` items
# point to `sources` by `n`; an item dated after the latest source that could be opened carries
# `reported: true`. `products` are site product ids (TOTAL, HS:<chapter>, B:<basket in
# trade-collector/config/network.yaml>, C:<chain>:<stage in chains.yaml>), the most relevant first.
# `economies` are ISO3 node codes. `view` is the default network view: `f` A (years) or M (YYYYMM),
# product `p`, `base` and `t`, and the monthly `lens` (L 12-month sum, M 3-month sum against a year
# earlier; null for annual views). Lens S, the single month, was dropped on 31 Oct 2026 (the
# monthly explorer's windows): no event view uses it and no single-month value is published. Monthly
# data: TOTAL from 2006, baskets and stages from 2014; chapters are annual only and monthly stages
# have lens L only. `watch` says what the
# network should show; it carries no numbers of our own. Sources were opened on 24 Oct 2026; a
# source without a date of its own has `date: null` and `accessed`.

events:
  - id: gfc-2008
    num: "A1"
    start: 2008-09-15
    end: 2009-06-30          # NBER: the US recession's trough was June 2009 (a month; its last day used)
    ongoing: false
    kind: crisis
    title: {en: "Lehman Brothers fails and world trade collapses", ko: "리먼 파산과 세계 무역 급감"}
    dek:
      en: "Lehman Brothers filed for bankruptcy on 15 September 2008. The volume of world trade fell 12.2% in 2009, the largest decline since the Second World War, the WTO reported."
      ko: "리먼 브라더스가 2008년 9월 15일 파산을 신청했습니다. WTO에 따르면 2009년 세계 무역량은 12.2% 줄어 제2차 세계대전 이후 가장 크게 감소했습니다."
    timeline:
      - {date: 2008-09-15, en: "Lehman Brothers files for Chapter 11 bankruptcy", ko: "리먼 브라더스, 파산보호 신청", source: 1}
      - {date: 2009-04-02, en: "G20 in London commits at least $250bn to trade finance", ko: "G20 런던 회의, 무역금융에 2,500억 달러 이상 지원 약속", source: 2}
      - {date: 2010-03-26, en: "WTO: world trade volume fell 12.2% in 2009", ko: "WTO, 2009년 세계 무역량 12.2% 감소 발표", source: 3}
      - {date: 2010-09-20, en: "NBER dates the end of the US recession to June 2009", ko: "NBER, 미국 경기침체 종료 시점을 2009년 6월로 판정", source: 4}
    products: ["TOTAL", "B:cars", "C:steel:flat"]
    economies: [USA]
    view: {f: M, p: "TOTAL", base: 200805, t: 200905, lens: M}
    watch:
      en: "The 2009 trough in annual and monthly views, and how fast each chain and each economy climbed back to its 2008 level."
      ko: "연간·월간 화면에서 2009년의 바닥을 표시합니다. 공급망과 경제마다 2008년 수준을 얼마나 빨리 회복했는지도 확인할 수 있습니다."
    reading:
      window:
        en: "Mar–May 2008 is the last spring before Lehman; Mar–May 2009 is the trough (the WTO has world trade in manufactures −29.8% on a year earlier in Q2 2009, and the NBER dates the end of the US recession to June 2009). Only 37 and 41 economies filed monthly data for these months (Korea through its customs service), about a quarter of 2024 world exports; from January 2010 the monthly data have over 100 reporters."
        ko: "2008년 3~5월은 리먼 파산 전 마지막 봄이고, 2009년 3~5월은 바닥입니다. WTO 집계로 2009년 2분기 세계 공산품 교역은 전년동기대비 29.8% 감소했습니다. NBER는 미국 경기침체 종료를 2009년 6월로 판정했습니다. 이 기간 월간 자료를 신고한 경제는 각각 37개국과 41개국입니다(한국은 관세청 자료). 이 경제들의 수출은 2024년 세계 수출의 4분의 1 정도입니다. 2010년 1월부터는 신고국이 100개국을 넘습니다."
      items:
        - kind: definition
          number:
            en: "World exports of All goods −32.4% between May 2008 and May 2009 ($2.0tn → $1.4tn, Mar–May windows), against the 12.2% fall in the volume of world trade in 2009 in the dek."
            ko: "세계 전체 상품 수출은 2008년 5월부터 2009년 5월까지 −32.4% 변했습니다($2.0tn → $1.4tn, 3~5월 창 기준). 머리글에 나온 2009년 세계 교역량 감소율 12.2%와 비교되는 수치입니다."
          en: "The 12.2% is the WTO's volume measure for the whole of 2009; in current dollars world merchandise exports fell 23% to $12.15 trillion, largely on lower oil and commodity prices. The WTO's quarterly table has world trade in manufactures −27.6% on a year earlier in Q1 2009 and −29.8% in Q2; and the world measured here is only the economies that filed monthly data."
          ko: "12.2%는 WTO가 2009년 한 해를 물량 기준으로 집계한 수치입니다. 달러 금액 기준으로 2009년 세계 상품 수출은 23% 감소한 12조 1,500억 달러였습니다. WTO는 그 차이가 주로 석유 등 1차 산품 가격 하락 때문이라고 분석했습니다. WTO 분기표에서 세계 공산품 교역은 2009년 1분기에 전년동기대비 27.6%, 2분기에 29.8% 감소했습니다. 여기서 집계한 세계 합계는 월간 자료를 신고한 경제만 더한 값입니다."
          sources: [3]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "United States · imports −30.6% ($100.8bn → $70.0bn) and exports −25.2% ($74.6bn → $55.8bn), both grey."
            ko: "미국의 수입은 −30.6%($100.8bn → $70.0bn), 수출은 −25.2%($74.6bn → $55.8bn) 변했으며 둘 다 회색으로 표시합니다."
          en: "UNSD began collecting monthly data in 2010 (49 countries by 2 July 2010). For these months the monthly data behind this page have 37 and 41 reporters, about a quarter of 2024 world exports, so the US figures are its trade with those economies, Germany, Korea, France and Italy among them. The US's own May 2009 release: exports −21.3%, imports −31.3% on May 2008 (goods and services)."
          ko: "UNSD는 2010년에야 월간 자료 수집을 시작했습니다(2010년 7월 2일 기준 49개국). 이 기간 이 페이지의 월간 자료에는 37개국과 41개국만 있습니다. 2024년 세계 수출의 4분의 1 정도입니다. 따라서 여기 미국 수치는 독일·한국·프랑스·이탈리아 등 이들 경제와의 교역입니다. 미국 자체 발표로는 2009년 5월 수출이 2008년 5월보다 21.3%, 수입이 31.3% 줄었습니다(상품·서비스 합계)."
          sources: [5, 6]
          checked: 2026-10-25
        - kind: price
          number:
            en: "Russia 2.4% → 1.8%, Norway 2.2% → 1.9% and Angola 0.96% → 0.57% of world All goods exports (May 2008 → May 2009)."
            ko: "세계 전체 상품 수출에서 차지하는 비중은 러시아 2.4% → 1.8%, 노르웨이 2.2% → 1.9%, 앙골라 0.96% → 0.57%였습니다(2008년 5월 → 2009년 5월)."
          en: "Values are in dollars and oil halved: Brent averaged $122.80 a barrel in May 2008 and $57.30 in May 2009. The WTO has the dollar value of exports from the Middle East, Africa and the CIS down 33%, 32% and 36% in 2009 against 23% for the world, due to the sharp drop in oil prices between 2008 and 2009."
          ko: "금액은 달러 기준이며, 이 기간에 유가는 절반으로 하락했습니다. 브렌트유 월평균 가격은 2008년 5월 배럴당 122.80달러에서 2009년 5월 57.30달러로 하락했습니다. WTO에 따르면 2009년 중동·아프리카·CIS의 수출액은 각각 33%, 32%, 36% 감소했습니다. 세계 전체(23%)보다 큰 감소폭입니다. WTO는 2008~09년의 유가 급락을 그 원인으로 들었습니다."
          sources: [3, 7]
          checked: 2026-10-25
        - kind: overlap
          number:
            en: "Passenger cars: Germany 39.9% → 36.4% and France 10.1% → 8.2% of world exports; Romania 0.23% → 0.98% and Italy 3.6% → 4.1% (May 2008 → May 2009)."
            ko: "승용차 세계 수출 비중은 독일이 39.9% → 36.4%, 프랑스가 10.1% → 8.2%로 낮아졌습니다. 루마니아는 0.23% → 0.98%, 이탈리아는 3.6% → 4.1%로 높아졌습니다(2008년 5월 → 2009년 5월)."
          en: "Eleven euro-area countries ran car scrapping schemes from December 2008, most to the end of 2009. The ECB says they shifted sales towards smaller and cheaper cars; German car imports rose 11.5% between January and May 2009, in particular small and less expensive cars from France, Italy, Slovakia and Romania, while euro-area motor-vehicle output was down 31.1% on a year earlier in Q2 2009."
          ko: "유로 지역 11개국이 2008년 12월부터 노후차 폐차 보조금을 시행했습니다. 대부분 2009년 말까지 이어졌습니다. ECB는 이 제도로 판매가 더 작고 싼 차로 옮겨 갔다고 분석했습니다. ECB에 따르면 2009년 1~5월 독일의 승용차 수입은 11.5% 증가했습니다. 특히 프랑스·이탈리아·슬로바키아·루마니아산 소형 저가차 수입이 늘었습니다. 유로 지역 자동차 생산은 2009년 2분기에 전년동기대비 31.1% 감소했습니다."
          sources: [8]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "Lehman Brothers Holdings Inc., Form 8-K, Item 1.03 Bankruptcy or Receivership", publisher: "US Securities and Exchange Commission (EDGAR)", date: 2008-09-19, url: "https://www.sec.gov/Archives/edgar/data/806085/000110465908059632/a08-22764_48k.htm"}
      - {n: 2, title: "Global Plan for Recovery and Reform: statement issued by the G20 leaders, London", publisher: "G20 (text at the G20 Information Centre, University of Toronto)", date: 2009-04-02, url: "https://g20.utoronto.ca/2009/2009communique0402.html"}
      - {n: 3, title: "Trade to expand by 9.5% in 2010 after a dismal 2009, WTO reports (PRESS/598)", publisher: "World Trade Organization", date: 2010-03-26, url: "https://www.wto.org/english/news_e/pres10_e/pr598_e.htm"}
      - {n: 4, title: "Business Cycle Dating Committee Announcement September 20, 2010", publisher: "National Bureau of Economic Research", date: 2010-09-20, url: "https://www.nber.org/news/business-cycle-dating-committee-announcement-september-20-2010"}
      - {n: 5, title: "International Trade Statistics Newsletter, Number 21, June 2010: UN Comtrade monthly and quarterly data", publisher: "United Nations Statistics Division, International Merchandise Trade Statistics Section", date: null, accessed: 2026-10-25, url: "https://unstats.un.org/unsd/trade/ITSB-newsletter%20June%202010%20final.pdf"}
      - {n: 6, title: "U.S. International Trade in Goods and Services, May 2009 (CB09-101, BEA09-32, FT-900 (09-05))", publisher: "US Census Bureau and Bureau of Economic Analysis", date: 2009-07-10, url: "https://www.bea.gov/news/2009/us-international-trade-goods-and-services-may-2009"}
      - {n: 7, title: "Crude Oil Prices: Brent - Europe, monthly (MCOILBRENTEU; source U.S. Energy Information Administration)", publisher: "FRED, Federal Reserve Bank of St. Louis", date: null, accessed: 2026-10-25, url: "https://fred.stlouisfed.org/data/MCOILBRENTEU"}
      - {n: 8, title: "The effects of vehicle scrapping schemes across euro area countries (Box 4, Monthly Bulletin, October 2009)", publisher: "European Central Bank", date: null, accessed: 2026-10-25, url: "https://www.ecb.europa.eu/pub/pdf/other/mb200910_focus04.en.pdf"}

  - id: japan-thailand-2011
    num: "A2"
    start: 2011-03-11
    end: 2011-12-31          # World Bank: the Thai floods lasted from July through December 2011 (month end used)
    ongoing: false
    kind: disaster
    title: {en: "Japan's earthquake and Thailand's floods cut parts supply", ko: "동일본 대지진과 태국 홍수로 부품 공급 차질"}
    dek:
      en: "A magnitude 9.0 earthquake and tsunami struck north-east Japan on 11 March 2011, and Japan's exports in April were 12.5% lower than a year earlier. From mid-October floods inundated six industrial estates in Thailand's Ayutthaya and Pathum Thani, and Western Digital's main hard-drive plant was flooded."
      ko: "2011년 3월 11일 규모 9.0의 지진과 쓰나미가 일본 동북부를 덮쳤습니다. 4월 일본 수출은 전년동월대비 12.5% 감소했습니다. 10월 중순부터는 태국 아유타야와 빠툼타니의 공업단지 여섯 곳이 침수됐습니다. 웨스턴디지털의 주력 하드디스크 공장도 물에 잠겼습니다."
    timeline:
      - {date: 2011-03-11, en: "Magnitude 9.0 earthquake and tsunami off the Pacific coast of Tohoku", ko: "도호쿠 태평양 앞바다 규모 9.0 지진·쓰나미", source: 1}
      - {date: 2011-05-25, en: "Japan's April exports 12.5% below a year earlier; cars down 67%", ko: "일본 4월 수출 전년동월대비 12.5% 감소, 자동차 67% 감소", source: 2}
      - {date: 2011-10-12, en: "Western Digital suspends hard-drive production near Bangkok", ko: "웨스턴디지털, 방콕 인근 하드디스크 생산 중단", source: 3}
      - {date: 2011-10-17, en: "Western Digital: floods inundate its main plant, at Bang Pa-in", ko: "웨스턴디지털, 방파인 주력 공장 침수 발표", source: 4}
    products: ["B:car_parts", "B:computers", "B:chips_ic"]
    economies: [JPN, THA]
    view: {f: A, p: "B:car_parts", base: 2010, t: 2011, lens: null}
    watch:
      en: "Japan's and Thailand's exports of car parts, computer parts (hard drives sit in 8471) and chips in 2011 against 2010, and which suppliers filled in."
      ko: "2011년 일본과 태국의 자동차 부품, 컴퓨터 부품(하드디스크는 8471), 반도체 수출을 2010년과 비교합니다. 어느 공급국이 그 감소분을 대체했는지도 살펴봅니다."
    reading:
      window:
        en: "An annual view: 2011 holds the quake's March–May trough in Japanese vehicle output (292,044 in April against 706,107 in January, 742,531 by June) and the floods' October–December stop in Thailand, beside the months in between; the base year 2010 was itself a rebound (world car-parts trade +29.4%). In the series on this page Japan's car-parts exports rose a further 6.8% in 2012 and Thailand's 28.8%."
        ko: "연간 보기입니다. 2011년에는 지진 뒤 일본 자동차 생산이 바닥을 친 3~5월이 들어 있습니다. 생산은 1월 706,107대에서 4월 292,044대로 줄었다가 6월 742,531대로 회복했습니다. 홍수로 태국 공장이 멈춘 10~12월과 그 사이의 달들도 함께 들어 있습니다. 기준 연도인 2010년은 그 자체가 반등의 해였습니다(세계 자동차 부품 교역 +29.4%). 이 페이지의 시계열에서 2012년 자동차 부품 수출은 일본이 6.8%, 태국이 28.8% 더 늘었습니다."
      items:
        - kind: price
          number:
            en: "Japan's car-parts exports +12.0% ($37.3bn → $41.8bn, 2010 → 2011)."
            ko: "일본의 자동차 부품 수출 +12.0%(373억 달러 → 418억 달러, 2010년 → 2011년)."
          en: "The dollar figures carry the yen's rise: the yen averaged 87.78 per dollar in 2010 and 79.70 in 2011. In yen, Japan's customs statistics show exports of parts of motor vehicles falling 2.8% in 2011 to ¥2,997bn after a 33.5% rise in 2010, with shipments to the US down 2.9%, to China 4.2% and to ASEAN 5.3%."
          ko: "달러 수치에는 엔화 강세가 반영되어 있습니다. 엔화는 달러당 연평균 2010년 87.78엔에서 2011년 79.70엔이 되었습니다. 엔화 기준 일본 통관통계의 자동차 부품 수출은 2010년 33.5% 증가했습니다. 2011년에는 2.8% 감소한 2조 9,971억 엔이었습니다. 미국행은 2.9%, 중국행은 4.2%, 아세안행은 5.3% 줄었습니다."
          sources: [6, 7, 8]
          checked: 2026-10-25
        - kind: cycle
          number:
            en: "Japan: 13.3% → 12.6% of world car-parts exports (−0.7 pp), the largest fall among the movers."
            ko: "일본: 세계 자동차 부품 수출의 13.3% → 12.6%(−0.7%p), 변동 순위에서 가장 큰 감소."
          en: "Vehicle production in Japan fell to 8,398,654 in 2011 from 9,628,920 in 2010. The fall was concentrated in spring: transport-equipment output in March was 46.7% below February (seasonally adjusted), and monthly vehicle output was 403,937 in March and 292,044 in April against 706,107 in January, then 883,602 in September and 904,254 in October."
          ko: "일본의 자동차 생산은 2010년 9,628,920대에서 2011년 8,398,654대로 감소했습니다. 감소는 봄에 집중됐습니다. 3월 수송기계 생산은 전월대비 46.7% 낮았습니다(계절조정). 월별 자동차 생산은 1월 706,107대에서 3월 403,937대, 4월 292,044대로 떨어졌습니다. 이후 9월 883,602대, 10월 904,254대로 회복했습니다."
          sources: [9, 10]
          checked: 2026-10-25
        - kind: definition
          number:
            en: "Thailand's car-parts exports +7.8% ($3.9bn → $4.2bn)."
            ko: "태국의 자동차 부품 수출 +7.8%(39억 달러 → 42억 달러)."
          en: "Thailand's 2011 fall was in finished vehicles: production 1,457,798 against 1,645,304 in 2010 and vehicle exports 735,627 units against 895,831; the Commerce Ministry's heading for motor cars, parts and accessories together fell from €14.0bn to €12.7bn. Output fell 27.8% in April on parts shortages from Japan, and Honda's Ayutthaya plant was shut from 4 October 2011 to 26 March 2012."
          ko: "2011년 태국에서 줄어든 것은 완성차였습니다. 생산은 2010년 1,645,304대에서 1,457,798대로 감소했습니다. 완성차 수출은 895,831대에서 735,627대로 줄었습니다. 상무부 분류의 승용차·부품·부속품 수출도 140억 유로에서 127억 유로로 줄었습니다. 4월에는 일본발 부품 부족으로 생산이 27.8% 감소했습니다. 혼다의 아유타야 공장은 2011년 10월 4일부터 2012년 3월 26일까지 가동을 멈췄습니다."
          sources: [11, 13, 14]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "China → Japan: 28.8% → 32.7% of Japan's car-parts imports (+3.9 pp); Thailand → Japan 10.3% → 9.6%."
            ko: "중국 → 일본: 일본 자동차 부품 수입의 28.8% → 32.7%(+3.9%p), 태국 → 일본 10.3% → 9.6%."
          en: "In yen, Japan's imports of parts of motor vehicles fell 3.3% in 2011; imports from China rose 9.9% while imports from ASEAN fell 14.8% and from the EU 10.8%. The floods closed six industrial estates in Ayutthaya and Pathum Thani from mid-October to November 2011, and Thai output fell 10¾% quarter on quarter in the fourth quarter, the largest fall on record."
          ko: "엔화 기준으로 일본의 자동차 부품 수입은 2011년 3.3% 감소했습니다. 중국산 수입은 9.9% 늘었고, 아세안산은 14.8%, EU산은 10.8% 줄었습니다. 홍수로 2011년 10월 중순부터 11월까지 아유타야와 빠툼타니의 공업단지 여섯 곳이 침수됐습니다. 태국의 4분기 생산은 전분기대비 10¾% 감소해 통계 집계 이후 가장 큰 감소폭을 기록했습니다."
          sources: [5, 6, 12]
          checked: 2026-10-25
