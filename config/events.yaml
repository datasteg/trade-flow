  - id: twelve-day-war-2025
    num: "11"
    start: 2025-06-13
    end: 2025-06-24             # the ceasefire takes effect
    ongoing: false
    kind: war
    title: {en: "Twelve-Day War: Israel and the US strike Iran", ko: "12일 전쟁, 이스라엘·미국이 이란 공습"}
    dek:
      en: "Israel struck Iran's nuclear and military sites on 13 June 2025 and the US bombed three nuclear sites on 22 June; a ceasefire took effect on 24 June. Oil prices spiked mid-month and returned to pre-conflict levels after the ceasefire."
      ko: "이스라엘이 2025년 6월 13일 이란의 핵·군사 시설을 공습했고, 미국이 6월 22일 핵시설 세 곳을 폭격했습니다. 6월 24일 휴전이 발효됐고, 한때 치솟은 유가는 휴전 뒤 분쟁 이전 수준으로 돌아갔습니다."
    timeline:
      - {date: 2025-06-13, en: "Israel strikes Iran's nuclear and military sites", ko: "이스라엘, 이란 핵·군사 시설 공습", source: 1}
      - {date: 2025-06-13, en: "Israel orders the Karish and Leviathan gas fields shut; restarts authorised on 24–25 June", ko: "이스라엘, 카리시·리바이어던 가스전 가동 중단 지시(6월 24~25일 재가동 허가)", source: 11}
      - {date: 2025-06-22, en: "US bombs Fordo, Natanz and Isfahan (Tehran time)", ko: "미국, 포르도·나탄즈·이스파한 폭격", source: 2}
      - {date: 2025-06-23, en: "Iran fires missiles at a US base in Qatar", ko: "이란, 카타르의 미군 기지에 미사일 발사", source: 3}
      - {date: 2025-06-24, en: "Ceasefire takes effect", ko: "휴전 발효", source: 3}
      - {date: 2025-07-11, en: "IEA: oil prices back to pre-conflict levels", ko: "IEA, 유가 분쟁 이전 수준 회복", source: 4}
    products: ["B:crude_oil", "B:natural_gas", "TOTAL"]
    economies: [IRN, ISR, USA, QAT]
    # May-Jul 2025 against May-Jul 2024: the war month and the one after, on the lens of event 12
    view: {f: M, p: "B:crude_oil", base: 202407, t: 202507, lens: M}
    watch:
      en: "A short test: Gulf crude and LNG flows to the importers should barely move in monthly values, since prices were back to pre-conflict levels within weeks; a contrast with 2026."
      ko: "짧은 시험대입니다. 유가가 몇 주 만에 분쟁 이전 수준으로 돌아갔으므로, 걸프산 원유·LNG 흐름은 월별 값에서 거의 움직이지 않아야 합니다. 2026년과 대비됩니다."
    reading:
      window:
        en: "May–Jul 2025 against May–Jul 2024 holds the twelve days of war inside a quarter in which Brent averaged $68 against $83 a year earlier and China's filings were absent. The IEA: Dated \"briefly surpassing $80/bbl before returning to pre-conflict levels after a ceasefire accord\", no impact on Iranian flows, and supply up 950 kb/d in June, led by Saudi Arabia, after OPEC+ added 411 kb/d for June and for July."
        ko: "2024년 5~7월 대비 2025년 5~7월 비교는 12일의 전쟁을 한 분기 안에 담습니다. 그 분기 브렌트유는 1년 전 배럴당 83달러에서 68달러로 하락했습니다. 중국의 신고는 없었습니다. IEA는 유가가 \"잠시 배럴당 80달러를 넘었다가 휴전 합의 뒤 분쟁 이전 수준으로 돌아갔\"다고 밝혔습니다. 이란의 원유 흐름에는 영향이 없었습니다. IEA에 따르면 OPEC+는 6월과 7월에 목표를 하루 41만 1,000배럴씩 올렸습니다. 6월 세계 공급은 사우디아라비아를 중심으로 하루 95만 배럴 늘었습니다."
      items:
        - kind: reporting
          number:
            en: "Saudi Arabia: 14.2% → 24.3% of world crude oil exports (+10.2 pp); Saudi Arabia → Asia, not elsewhere specified: none in May–Jul 2024, $33.1bn in May–Jul 2025 (94.9% of that area's crude imports)."
            ko: "사우디아라비아의 세계 원유 수출 비중은 14.2%에서 24.3%로 높아졌습니다(+10.2%p). 사우디아라비아 → 기타 아시아(달리 분류되지 않음) 원유 수출은 2024년 5~7월에는 없었고, 2025년 5~7월에는 $33.1bn이었습니다(이 지역 원유 수입의 94.9%)."
          en: "Saudi Arabia's filings name no buyer for crude. To December 2024 all of it went to \"Areas, nes\"; from January 2025 about four-fifths goes to \"Other Asia, nes\" (area 490), which this site shows as Asia, not elsewhere specified, never as Taiwan. UN Statistics says the code holds Taiwan's trade \"except for several countries (such as Saudi Arabia, which report all of their exports to unknown countries)\". The EIA puts Taiwan's 2025 crude and condensate imports at 794,000 b/d."
          ko: "사우디아라비아는 신고 자료에 원유 구매국을 적지 않습니다. 2024년 12월까지는 전량이 \"Areas, nes\"로 신고됐습니다. 2025년 1월부터는 약 5분의 4가 \"Other Asia, nes\"(지역 코드 490)로 신고됩니다. 이 사이트는 이 코드를 기타 아시아(달리 분류되지 않음)로 표시하며, 대만으로 표시하지 않습니다. 유엔 통계국(UN Statistics)은 이 코드에 대만의 교역이 담기지만 \"일부 국가(모든 수출을 미상 국가 앞으로 신고하는 사우디아라비아 등)는 예외\"라고 설명합니다. 미국 에너지정보청(EIA)은 대만의 2025년 원유·콘덴세이트 수입을 하루 794,000배럴로 추정합니다."
          sources: [5, 6, 7]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "World crude oil trade −25.7% ($325.4bn → $241.9bn); China's imports −$69.1bn (−84.0%); Russia 10.1% → 5.6% and Iraq 7.6% → 5.4% of world exports."
            ko: "세계 원유 교역은 −25.7%($325.4bn → $241.9bn), 중국의 수입은 −$69.1bn(−84.0%)입니다. 세계 수출에서 러시아 비중은 10.1%에서 5.6%로, 이라크 비중은 7.6%에서 5.4%로 낮아졌습니다."
          en: "China's monthly filings end in December 2024 in this store. The $82.3bn of crude it took in May–Jul 2024, 25.3% of world trade, came nearly half from economies that had not filed May–Jul 2025 (Russia, Iraq, Oman, UAE, Kuwait, Qatar) and $13.4bn from Saudi Arabia, whose filings name no buyer, so those flows vanish at t. China's customs counted 12.14 million b/d of crude imports in June 2025, the most since August 2023."
          ko: "이 사이트 데이터 저장소의 중국 월별 신고 자료는 2024년 12월에서 끝납니다. 중국이 2024년 5~7월 수입한 원유는 $82.3bn으로 세계 교역의 25.3%였습니다. 이 가운데 절반가량은 2025년 5~7월 자료를 신고하지 않은 경제(러시아·이라크·오만·UAE·쿠웨이트·카타르)에서 들어왔습니다. $13.4bn은 구매국을 밝히지 않는 사우디아라비아에서 들어왔습니다. 그래서 이 흐름들은 t 시점에서 사라집니다. 중국 해관은 2025년 6월 원유 수입을 하루 12.14백만 배럴로 집계했습니다. 2023년 8월 이후 최대입니다."
          sources: [8]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Iran · crude exports: no bar and no partner chart; no buyer reported Iranian crude in every month of either window, so the monthly rule draws none."
            ko: "이란 원유 수출에는 막대와 상대국 차트가 없습니다. 두 창 어느 쪽에서도 매달 이란산 원유를 보고한 구매국이 없어 월별 규칙에 따라 그리지 않습니다."
          en: "Iran has filed no monthly return since March 2010, so its exports here are its buyers' reports, and no buyer reported Iranian crude in every month of either window (India entered $112m for June 2025 alone), so neither window holds a flow. China \"has officially not imported Iranian crude since 2022\", while its customs data \"regularly shows more Malaysia-sourced oil than the Southeast Asian country actually produces\"; Kpler counted 1.37 million b/d of Iranian-origin crude into China in January–October 2025."
          ko: "이란은 2010년 3월 이후 월별 신고를 하지 않았습니다. 그래서 이 사이트의 이란 수출은 구매국의 보고 자료입니다. 두 창 어느 쪽에서도 매달 이란산 원유를 보고한 구매국이 없어 흐름이 잡히지 않습니다(인도는 2025년 6월 한 달만 $112m을 기록). 중국은 \"2022년 이후 공식적으로 이란산 원유를 수입하지 않았다\"고 합니다. 그러나 중국 해관 자료에는 \"말레이시아산 원유가 말레이시아의 실제 생산량보다 많게 나타나는 일이 잦다\"는 지적이 있습니다. 케이플러(Kpler)는 2025년 1~10월 중국에 들어간 이란산 원유를 하루 1.37백만 배럴로 집계했습니다."
          sources: [9]
          checked: 2026-10-25
        - kind: definition
          number:
            en: "Israel's crude exports go to the Netherlands alone in both windows (100.0%), so no diversion bar; Israel · crude exports −54.7% ($131m → $59m)."
            ko: "이스라엘의 원유 수출은 두 창 모두 네덜란드로만 향합니다(100.0%). 따라서 수출처 전환 막대가 없습니다. 이스라엘 · 원유 수출 −54.7%($131m → $59m)."
          en: "Israel's crude exports date from February 2023, when Energean first sold condensate, a by-product of gas production, from the Karish field abroad through Vitol. The figures here are the Dutch and German import reports; Israel's own filings record crude exports only in November–December 2024. The Energy Ministry shut Karish and Leviathan from 13 June 2025 and authorised restarts on 24–25 June; the series has no Mar–May 2025 window, no flow being positive in all three months."
          ko: "이스라엘의 원유 수출은 2023년 2월에 시작됐습니다. 이때 에너지안(Energean)이 카리시(Karish) 가스전에서 가스 생산의 부산물인 콘덴세이트를 비톨(Vitol)을 통해 처음 해외에 팔았습니다. 이 사이트의 수치는 네덜란드와 독일의 수입 보고입니다. 이스라엘 자체 신고에는 2024년 11~12월에만 원유 수출이 기록돼 있습니다. 이스라엘 에너지부는 2025년 6월 13일부터 카리시와 리바이어선(Leviathan) 가스전 가동을 중단시켰고, 6월 24~25일 재가동을 승인했습니다. 이 시계열에는 2025년 3~5월 창이 없습니다. 세 달 모두 양수인 흐름이 없기 때문입니다."
          sources: [10, 11, 12]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "What we know as Israel-Iran conflict intensifies", publisher: "BBC News", date: 2025-06-13, url: "https://www.bbc.com/news/articles/cdj9vj8glg2o"}
      - {n: 2, title: "What we know about US air strikes on three Iranian nuclear sites", publisher: "BBC News", date: 2025-06-22, url: "https://www.bbc.com/news/articles/cvg9r4q99g4o"}
