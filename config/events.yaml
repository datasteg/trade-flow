      - {n: 3, title: "Modifying Reciprocal Tariff Rates to Reflect Trading Partner Retaliation and Alignment (Executive Order 14266)", publisher: "The White House", date: 2025-04-09, url: "https://www.whitehouse.gov/presidential-actions/2025/04/modifying-reciprocal-tariff-rates-to-reflect-trading-partner-retaliation-and-alignment/"}
