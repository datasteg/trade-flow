  - id: us-china-tariffs-2018
    num: "1"
    start: 2018-07-06        # USTR: duties collected from 6 July 2018
    end: 2020-01-15          # the Phase One agreement signed
    ongoing: false
    kind: tariff
    title: {en: "US Section 301 tariffs on China start a trade war", ko: "미국, 301조 대중 관세로 무역전쟁 시작"}
    dek:
      en: "The US put a 25% tariff on about $34bn of imports from China on 6 July 2018 and widened the tariffs in rounds through 2019. The two countries signed a Phase One trade agreement on 15 January 2020."
      ko: "미국은 2018년 7월 6일 중국산 수입품 약 340억 달러어치에 25% 관세를 부과했습니다. 이후 2019년까지 여러 차례 대상을 넓혔습니다. 두 나라는 2020년 1월 15일 1단계 무역합의에 서명했습니다."
    timeline:
      - {date: 2018-06-15, en: "USTR lists about $50bn of Chinese goods for a 25% tariff", ko: "USTR, 중국산 약 500억 달러어치 25% 관세 목록 발표", source: 1}
      - {date: 2018-07-06, en: "25% tariff on about $34bn of imports from China takes effect", ko: "중국산 약 340억 달러어치에 25% 관세 발효", source: 1}
      - {date: 2018-07-06, en: "China's retaliatory 25% tariffs on more than 500 US farm products, including soybeans, take effect", ko: "중국, 대두 등 미국산 농산물 500여 개 품목에 25% 보복관세 시행", source: 14}
      - {date: 2018-08-23, en: "Second tranche: 25% on about $16bn more", ko: "2차: 약 160억 달러어치에 25% 관세", source: 2}
      - {date: 2018-09-24, en: "Third tranche: 10% on about $200bn", ko: "3차: 약 2,000억 달러어치에 10% 관세", source: 3}
      - {date: 2019-05-10, en: "Rate on the September 2018 tranche raised from 10% to 25%", ko: "2018년 9월분 관세율 10%에서 25%로 인상", source: 4}
      - {date: 2019-09-01, en: "Duties reach the first part (List 4A) of a further $300bn list", ko: "추가 3,000억 달러 목록 중 첫 부분(4A)에 관세 부과", source: 5}
      - {date: 2020-01-15, en: "US and China sign the Phase One agreement", ko: "미·중 1단계 무역합의 서명", source: 6}
      - {date: 2020-02-14, en: "Phase One enters into force; List 4A rate cut from 15% to 7.5%", ko: "1단계 합의 발효, 4A 관세율 15%에서 7.5%로 인하", source: 6}
    products: ["TOTAL", "B:chips_ic", "C:steel:flat"]
    economies: [USA, CHN, VNM, MEX, S19]   # S19: Asia, not elsewhere specified, most importers' records of Taiwan
    view: {f: M, p: "TOTAL", base: 201806, t: 201906, lens: M}
    watch:
      en: "China's share of US imports falling while Vietnam, Mexico and Asia, not elsewhere specified (most importers' records of Taiwan) gain (the dashboard case \"US–China\")."
      ko: "미국 수입에서 중국 비중이 낮아지는 사이 베트남, 멕시코, 기타 아시아(대부분 수입국 기록상 대만)의 비중이 높아지는지 지켜봅니다(대시보드 사례 \"미국–중국\")."
    reading:
      window:
        en: "Apr–Jun 2018 is the quarter before the first tariff (6 July 2018); Apr–Jun 2019 has the first three lists in force (the September 2018 list at 25% only from 10 May 2019) and precedes List 4A (1 September 2019). It also sits in the 2019 slowdown: the WTO puts 2019 world merchandise trade volume at −0.1% and its dollar value at −3%."
        ko: "2018년 4~6월은 첫 관세(2018년 7월 6일) 직전 분기입니다. 2019년 4~6월에는 1~3차 목록이 시행 중이었습니다(2018년 9월 목록의 25% 관세는 2019년 5월 10일부터 적용). 4A 목록(2019년 9월 1일)은 아직 시행 전입니다. 이 분기는 2019년 세계 교역 둔화기이기도 합니다. WTO 집계로 2019년 세계 상품 교역량은 0.1%, 달러 금액은 3% 감소했습니다."
      items:
        - kind: front-loading
          number:
            en: "China → United States: 20.4% → 18.1% of US imports of all goods, $132.7bn → $118.2bn (−10.9%) (Apr–Jun 2018 → Apr–Jun 2019)."
            ko: "중국 → 미국 수출은 미국 전체 상품 수입 가운데 비중이 20.4% → 18.1%로, 금액이 $132.7bn → $118.2bn(−10.9%)으로 줄었습니다(2018년 4~6월 → 2019년 4~6월)."
          en: "The 10% tariff on about $200bn of imports from China, in force from 24 September 2018, was due to rise to 25% on 1 January 2019; USTR postponed it twice, to 10 May 2019. Census data show US imports from China peaking at $52.1bn in October 2018 and falling to $31.1bn in March 2019; China's share of US imports here was 22.8% in Sep–Nov 2018 and 16.8% in Mar–May 2019."
          ko: "미국은 2018년 9월 24일부터 중국산 수입품 약 $200bn에 10% 관세를 매겼고, 이 관세는 2019년 1월 1일 25%로 오를 예정이었습니다. 미국 무역대표부(USTR)는 인상을 두 차례 미뤄 2019년 5월 10일로 늦췄습니다. 미국 센서스국 자료를 보면 중국산 수입은 2018년 10월 $52.1bn으로 정점을 찍은 뒤 2019년 3월 $31.1bn으로 줄었습니다. 이 화면에서 미국 수입 가운데 중국 비중은 2018년 9~11월 22.8%, 2019년 3~5월 16.8%였습니다."
          sources: [7, 4, 8]
          checked: 2026-10-25
        - kind: scope
          number:
            en: "United States imports of all goods +0.5% ($651.4bn → $654.5bn) while China → United States fell $14.4bn; Mexico → United States +$5.4bn, Vietnam → United States +$3.2bn, Asia, not elsewhere specified (most importers' records of Taiwan) → United States +$2.2bn."
            ko: "미국의 전체 상품 수입은 +0.5%($651.4bn → $654.5bn) 변했지만 중국 → 미국 수출은 $14.4bn 줄었습니다. 멕시코 → 미국은 +$5.4bn, 베트남 → 미국은 +$3.2bn, 기타 아시아(대부분 수입국 기록상 대만) → 미국은 +$2.2bn입니다."
          en: "By late September 2018 the tariffs covered 44.7% of US imports from China, up from 0.8% in early July, and the lists in force mostly targeted intermediate inputs. Over 2019 US imports from China fell $87.4bn to $452.2bn, while imports from Mexico rose $12.0bn to $358.1bn and from Vietnam from $49.1bn to $66.4bn."
          ko: "2018년 9월말 관세 대상은 미국 중국산 수입의 44.7%로, 7월초 0.8%에서 늘었습니다. 시행 중이던 목록은 주로 중간재를 겨냥했습니다. 2019년 한 해 미국의 중국산 수입은 874억 달러 감소한 4,522억 달러였습니다. 멕시코산은 120억 달러 늘어 3,581억 달러였습니다. 베트남산은 491억 달러에서 664억 달러로 늘었습니다."
          sources: [9, 10, 11]
          checked: 2026-10-25
        - kind: rerouting
          number:
            en: "Vietnam → United States: 17.6% → 20.3% of Vietnam's exports, $11.9bn → $15.1bn (+26.5%); China → Vietnam: 28.9% → 31.1% of Vietnam's imports, $16.5bn → $19.5bn (+17.8%)."
            ko: "베트남 → 미국 수출은 베트남 수출 가운데 비중이 17.6% → 20.3%, 금액이 $11.9bn → $15.1bn(+26.5%)입니다. 중국 → 베트남 수출은 베트남 수입 가운데 비중이 28.9% → 31.1%, 금액이 $16.5bn → $19.5bn(+17.8%)입니다."
          en: "Vietnam's share of US imports (1.8% → 2.3%) and of China's exports (2.5% → 3.0%) rose together. A Federal Reserve note finds Vietnam's rising exports to the US came with a disproportionate rise in its imports from China, with Chinese-owned firms' share of those exports up from 11% in 2018–19 to 25% in 2020–23; Iyoha et al. put rerouting in 2018–19 at 16.5% of Vietnam's US exports by product, 1.7% by firm."
          ko: "미국 수입 중 베트남 비중(1.8% → 2.3%)과 중국 수출 중 베트남 비중(2.5% → 3.0%)이 함께 상승했습니다. 미국 연준 보고서는 베트남의 대미 수출 증가에 중국산 수입의 과도한 증가가 뒤따랐다고 분석했습니다. 중국계 기업이 그 수출에서 차지하는 비중은 2018~19년 11%에서 2020~23년 25%로 높아졌습니다. Iyoha 등은 2018~19년 베트남 대미 수출 중 우회수출을 품목 기준 16.5%, 기업 기준 1.7%로 추산했습니다."
          sources: [12, 13]
          checked: 2026-10-25
        - kind: overlap
          number:
            en: "United States → China: 10.2% → 7.6% of US exports, $42.5bn → $31.0bn (−27.2%), a steeper fall than China → United States (−10.9%)."
            ko: "미국 → 중국 수출은 미국 수출 가운데 비중이 10.2% → 7.6%, 금액이 $42.5bn → $31.0bn(−27.2%)으로 중국 → 미국(−10.9%)보다 더 크게 줄었습니다."
          en: "From 6 July 2018 China levied 25% on more than 500 US food and agricultural products, including soybeans, and through 2019 56–58% of its imports from the US carried retaliatory tariffs. US soybean exports to China in January–October 2018 were 63% below 2017, and USDA estimates China's tariffs cut US farm exports by nearly $26bn, soybeans 71% of the losses."
          ko: "중국은 2018년 7월 6일부터 대두를 포함한 미국산 식품·농산물 500여 개 품목에 25% 관세를 부과했습니다. 2019년 내내 미국산 수입의 56~58%가 보복관세 대상이었습니다. 2018년 1~10월 미국의 대중 대두 수출은 2017년 같은 기간보다 63% 적었습니다. 미국 농무부는 중국의 관세로 미국 농산물 수출이 260억 달러 가까이 줄었다고 추산했습니다. 그 손실의 71%가 대두였습니다."
          sources: [14, 15, 9]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "USTR issues tariffs on Chinese products in response to unfair trade practices", publisher: "Office of the United States Trade Representative", date: 2018-06-15, url: "https://ustr.gov/about-us/policy-offices/press-office/press-releases/2018/june/ustr-issues-tariffs-chinese-products"}
      - {n: 2, title: "USTR finalizes second tranche of tariffs on Chinese products in response to China's unfair trade practices", publisher: "Office of the United States Trade Representative", date: 2018-08-07, url: "https://ustr.gov/about-us/policy-offices/press-office/press-releases/2018/august/ustr-finalizes-second-tranche"}
      - {n: 3, title: "USTR finalizes tariffs on $200 billion of Chinese imports in response to China's unfair trade practices", publisher: "Office of the United States Trade Representative", date: 2018-09-18, url: "https://ustr.gov/about-us/policy-offices/press-office/press-releases/2018/september/ustr-finalizes-tariffs-200"}
      - {n: 4, title: "Notice of modification of Section 301 action: China's acts, policies, and practices related to technology transfer, intellectual property, and innovation (84 FR 20459)", publisher: "Federal Register (USTR)", date: 2019-05-09, url: "https://www.federalregister.gov/documents/2019/05/09/2019-09681/notice-of-modification-of-section-301-action-chinas-acts-policies-and-practices-related-to"}
      - {n: 5, title: "Notice of modification of Section 301 action: China's acts, policies, and practices related to technology transfer, intellectual property, and innovation (84 FR 43304)", publisher: "Federal Register (USTR)", date: 2019-08-20, url: "https://www.federalregister.gov/documents/2019/08/20/2019-17865/notice-of-modification-of-section-301-action-chinas-acts-policies-and-practices-related-to"}
      - {n: 6, title: "Notice of modification of Section 301 action: China's acts, policies, and practices related to technology transfer, intellectual property, and innovation (85 FR 3741)", publisher: "Federal Register (USTR)", date: 2020-01-22, url: "https://www.federalregister.gov/documents/2020/01/22/2020-00904/notice-of-modification-of-section-301-action-chinas-acts-policies-and-practices-related-to"}
      - {n: 7, title: "Notice of modification of Section 301 action: China's acts, policies, and practices related to technology transfer, intellectual property, and innovation (83 FR 47974)", publisher: "Federal Register (USTR)", date: 2018-09-21, url: "https://www.federalregister.gov/documents/2018/09/21/2018-20610/notice-of-modification-of-section-301-action-chinas-acts-policies-and-practices-related-to"}
      - {n: 8, title: "Trade in Goods with China (customs basis, monthly)", publisher: "US Census Bureau, Foreign Trade", date: null, accessed: 2026-10-25, url: "https://www.census.gov/foreign-trade/balance/c5700.html"}
      - {n: 9, title: "Phase One China Deal: Steep Tariffs Are the New Normal", publisher: "Peterson Institute for International Economics (Chad P. Bown)", date: 2019-12-19, url: "https://www.piie.com/blogs/trade-and-investment-policy-watch/2019/phase-one-china-deal-steep-tariffs-are-new-normal"}
      - {n: 10, title: "U.S. International Trade in Goods and Services, December 2019", publisher: "US Bureau of Economic Analysis and US Census Bureau", date: 2020-02-05, url: "https://www.bea.gov/news/2020/us-international-trade-goods-and-services-december-2019"}
      - {n: 11, title: "Trade in Goods with Vietnam (customs basis, monthly)", publisher: "US Census Bureau, Foreign Trade", date: null, accessed: 2026-10-25, url: "https://www.census.gov/foreign-trade/balance/c5520.html"}
