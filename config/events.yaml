  - id: russia-ukraine-2022
    num: "6"
    start: 2022-02-24
    end: null
    ongoing: true
    kind: war
    title: {en: "Russia invades Ukraine; oil and potash sanctions follow", ko: "러시아의 우크라이나 침공과 원유·칼리 제재"}
    dek:
      en: "Russia invaded Ukraine on 24 February 2022, and the war goes on in October 2026. EU sanctions on Belarus reached all potash in March–April 2022, and the EU barred seaborne Russian crude from 5 December 2022 and Russian oil products from 5 February 2023, the days the G7 price caps took effect."
      ko: "러시아는 2022년 2월 24일 우크라이나를 침공했고, 전쟁은 2026년 10월에도 이어지고 있습니다. EU는 2022년 3~4월 벨라루스 제재를 칼리 전체로 넓혔습니다. 2022년 12월 5일부터는 러시아산 해상 원유를, 2023년 2월 5일부터는 러시아산 석유제품 수입을 금지했습니다. G7 가격상한제도 같은 날 시행됐습니다."
    timeline:
      - {date: 2022-02-24, en: "Russia invades Ukraine", ko: "러시아, 우크라이나 침공", source: 1}
      - {date: 2022-03-02, en: "EU Belarus sanctions of 2 March to 8 April cover all potash", ko: "EU, 3월 2일~4월 8일 벨라루스 제재로 칼리 전체 금지", source: 2}
      - {date: 2022-03-08, en: "US bans imports of Russian crude oil, petroleum products, LNG and coal", ko: "미국, 러시아산 원유·석유제품·LNG·석탄 수입 금지", source: 16}
      - {date: 2022-07-22, en: "Black Sea Grain Initiative signed in Istanbul", ko: "흑해 곡물 협정 체결(이스탄불)", source: 3}
      - {date: 2022-12-02, en: "G7 and Australia cap Russian crude at $60 a barrel", ko: "G7·호주, 러시아산 원유 배럴당 60달러 상한 합의", source: 4}
      - {date: 2022-12-05, en: "EU ban on seaborne Russian crude takes effect", ko: "EU, 러시아산 해상 원유 수입 금지 발효", source: 5}
      - {date: 2023-02-05, en: "EU ban on Russian oil products takes effect", ko: "EU, 러시아산 석유제품 수입 금지 발효", source: 5}
      - {date: 2023-07-17, en: "Black Sea Grain Initiative expires", ko: "흑해 곡물 협정 만료", source: 3}
      - {date: 2026-10-22, en: "Strikes go on; Russia ready to resume talks in November", ko: "공습 계속, 러시아 '11월 협상 재개 용의'", source: 6}
    products: ["B:crude_oil", "B:refined_oil", "B:natural_gas"]
    economies: [RUS, UKR, BLR, USA]
    view: {f: M, p: "B:crude_oil", base: 202202, t: 202302, lens: M}
    watch:
      en: "Russia's crude and oil products moving from EU buyers to others after the bans of December 2022 and February 2023; Belarus's potash leaving EU markets; EU gas imports turning from Russian pipeline gas to LNG, the US among the suppliers; Ukraine's grain exports during the Black Sea deal."
      ko: "2022년 12월과 2023년 2월 금지 이후 러시아산 원유·석유제품의 행선지가 EU 밖으로 옮겨 가는지 살펴봅니다. 벨라루스산 칼리가 EU 시장에서 빠지는지도 살펴봅니다. EU 가스 수입이 러시아 파이프라인 가스에서 미국 등지의 LNG로 바뀌는지 확인합니다. 흑해 곡물 협정 기간의 우크라이나 곡물 수출도 살펴봅니다."
    reading:
      window:
        en: "Dec 2021–Feb 2022 is the last quarter before the invasion; Dec 2022–Feb 2023 is the first quarter of the EU seaborne crude ban and the G7 price cap (5 December 2022) and ends three weeks after the products ban. In the series on this page India's share of Russia's crude exports had reached 31.2% by December 2022 and held at 40–45% from March to August 2023."
        ko: "2021년 12월~2022년 2월은 침공 전 마지막 분기입니다. 2022년 12월~2023년 2월은 EU의 해상 원유 수입 금지와 G7 가격 상한제(2022년 12월 5일) 시행 후 첫 분기이며, 석유제품 수입 금지 3주 뒤에 끝납니다. 이 페이지의 시계열에서 러시아 원유 수출 중 인도 비중은 2022년 12월 31.2%에 이르렀습니다. 2023년 3~8월에는 40~45%를 유지했습니다."
      items:
        - kind: substitution
          number:
            en: "Russia → India: none → 39.0% of Russia's crude exports ($10.3bn at t); Russia → China 36.0% → 47.4% (Dec 2021–Feb 2022 → Dec 2022–Feb 2023)."
            ko: "러시아 → 인도는 없던 흐름이 러시아 원유 수출의 39.0%(t 시점 $10.3bn)가 됐습니다. 러시아 → 중국은 36.0%에서 47.4%로 높아졌습니다(2021년 12월~2022년 2월 → 2022년 12월~2023년 2월)."
          en: "The EU agreed its ban on seaborne Russian crude on 3 June 2022 with a six-month phase-out to 5 December. The IEA counted India and China taking over 70% of Russia's crude exports in February 2023, Russia supplying about 40% of India's and 20% of China's crude imports; China's customs put Russia ahead of Saudi Arabia in January–February 2023."
          ko: "EU는 2022년 6월 3일 러시아산 해상 원유 금수를 결정했고, 6개월 유예 뒤 12월 5일 발효됐습니다. IEA 집계로 2023년 2월 러시아 원유 수출의 70% 이상이 인도와 중국으로 향했습니다. 러시아산은 인도 원유 수입의 약 40%, 중국의 약 20%를 차지했습니다. 중국 세관 통계에서는 2023년 1~2월 러시아가 사우디아라비아를 제치고 최대 공급국이 됐습니다."
          sources: [8, 9, 13]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Russia · crude exports −20.7% ($33.5bn → $26.5bn) and · crude imports −100.0%, both drawn grey."
            ko: "러시아 · 원유 수출은 −20.7%($33.5bn → $26.5bn), 러시아 · 원유 수입은 −100.0%이며, 둘 다 회색으로 표시합니다."
          en: "Russia's Federal Customs Service stopped publishing foreign trade statistics in April 2022. Russia's own monthly filings end in December 2021 in the series here, so every Russian figure in both windows is its partners' report; Russia → India is India's filing. Belarus, whose crude came from Russia in this series, stops filing after March 2022, so its crude charts are empty."
          ko: "러시아 연방관세청은 2022년 4월 대외무역 통계 공표를 중단했습니다. 이 시계열에서 러시아의 월별 신고는 2021년 12월에 끝납니다. 따라서 두 기간의 러시아 수치는 모두 교역상대국의 신고이며, 러시아 → 인도는 인도의 신고입니다. 원유를 러시아에서 수입하던 벨라루스는 2022년 3월 이후 신고가 없어 원유 그림이 비어 있습니다."
          sources: [7]
          checked: 2026-10-25
        - kind: price
          number:
            en: "Russia · crude exports −20.7% in USD while world crude trade rose 7.2% ($298.5bn → $320.2bn)."
            ko: "러시아 · 원유 수출은 달러 기준 −20.7%였습니다. 같은 기간 세계 원유 교역은 7.2%($298.5bn → $320.2bn) 늘었습니다."
          en: "Russia's Finance Ministry put the average Urals export price at $49.48 a barrel in January 2023 against $85.64 a year earlier, and at $49.56 in February, while Brent averaged $83 in December 2022–February 2023 against $85 a year earlier. The IEA put Russia's February 2023 oil export revenues at $11.6bn, down 42% on a year earlier, on exports of 7.5 mb/d."
          ko: "러시아 재무부가 집계한 우랄유 평균 수출 가격은 2023년 1월 배럴당 49.48달러였습니다. 1년 전 85.64달러에서 하락했고, 2월은 49.56달러였습니다. 같은 기간 브렌트유는 2022년 12월~2023년 2월 평균 83달러로, 전년동기평균 85달러와 비슷했습니다. IEA는 2023년 2월 러시아의 석유 수출 수익을 116억 달러로 집계했습니다. 전년동월대비 42% 감소한 수치이며, 수출량은 하루 750만 배럴이었습니다."
          sources: [9, 10, 11, 15]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "United States · crude exports +41.4% ($22.2bn → $31.5bn); United States → India 14.5% → 11.2% of US exports, United States → Netherlands 6.1% → 8.5%."
            ko: "미국의 원유 수출은 41.4% 늘었습니다($22.2bn → $31.5bn). 미국 수출 가운데 인도 비중은 14.5%에서 11.2%로 낮아졌고, 네덜란드 비중은 6.1%에서 8.5%로 높아졌습니다."
          en: "The EIA records 2022 US crude exports at a record 3.6 million b/d, 22% above 2021: less went to India and China, which imported more discounted Russian crude, and the drop was more than offset by demand in Europe; South Korea and the Netherlands each took over 10% of US exports and the UK 9.6%."
          ko: "EIA 집계로 2022년 미국 원유 수출은 하루 360만 배럴로 통계 집계 이후 최대였습니다. 2021년보다 22% 많았습니다. 인도와 중국은 할인된 러시아산 원유 수입을 늘리고 미국산 수입을 줄였습니다. 유럽의 수요 증가가 그 감소분보다 컸습니다. 한국과 네덜란드는 각각 미국 수출의 10% 이상을, 영국은 9.6%를 수입했습니다."
          sources: [14]
          checked: 2026-10-25
    sources:
