  - id: covid-2020
    num: "4"
    start: 2020-03-11
    end: 2023-05-05          # WHO: COVID-19 no longer a public health emergency of international concern
    ongoing: false
    kind: pandemic
    title: {en: "WHO declares COVID-19 a pandemic", ko: "WHO, 코로나19 팬데믹 선언"}
    dek:
      en: "WHO characterized COVID-19 as a pandemic on 11 March 2020. World merchandise trade fell 14.3% from the first to the second quarter, the largest drop on record, and its volume ended 2020 down 5.3%, the WTO estimated."
      ko: "WHO는 2020년 3월 11일 코로나19를 팬데믹으로 규정했습니다. WTO 추산으로 세계 상품 무역은 2분기에 전분기대비 14.3% 감소해 통계 집계 이후 최대 낙폭을 기록했습니다. 2020년 한 해 무역량은 5.3% 줄었습니다."
    timeline:
      - {date: 2020-01-30, en: "WHO declares a public health emergency of international concern", ko: "WHO, 국제적 공중보건 비상사태 선포", source: 2}
      - {date: 2020-03-11, en: "WHO characterizes COVID-19 as a pandemic", ko: "WHO, 코로나19 팬데믹 규정", source: 1}
      - {date: 2020-04-08, en: "WTO: world merchandise trade set to fall by 13% to 32% in 2020", ko: "WTO, 2020년 세계 상품 무역 13%에서 32% 감소 전망", source: 3}
      - {date: 2020-10-06, en: "WTO: second-quarter fall of 14.3% is the largest on record", ko: "WTO, 2분기 14.3% 감소는 통계 집계 이후 최대", source: 4}
      - {date: 2021-03-31, en: "WTO: trade volume fell 5.3% in 2020", ko: "WTO, 2020년 무역량 5.3% 감소 집계", source: 5}
      - {date: 2023-05-05, en: "WHO ends the public health emergency", ko: "WHO, 국제적 공중보건 비상사태 해제", source: 6}
    products: ["TOTAL", "B:masks", "B:ventilators"]
    economies: [CHN]
    view: {f: M, p: "TOTAL", base: 201905, t: 202005, lens: M}
    watch:
      en: "Imports of the economies that filed every month dropping in April and May 2020 against a year earlier and how fast they recovered; masks and ventilators moving against the fall."
      ko: "매달 신고한 경제의 수입이 2020년 4~5월 전년동월대비 줄었다가 얼마나 빨리 회복했는지 살펴봅니다. 마스크·인공호흡기 교역이 전체 흐름과 반대로 움직였는지도 확인합니다."
    reading:
      window:
        en: "Mar–May 2020 is the quarter of the Western lockdowns and of China's restart after its January–February shutdown (exports −17.2% in January–February at China's customs); the base, Mar–May 2019, sits inside the US–China tariff war, with world trade already −1.8% on a year earlier. In the series on this page China's exports were +6.6% and imports +8.1% on a year earlier by November 2020."
        ko: "2020년 3~5월은 서방의 봉쇄와 중국의 재가동이 겹친 분기입니다. 중국은 1~2월 가동을 멈췄다가 재가동했습니다(중국 세관 집계로 1~2월 수출 −17.2%). 기준 기간인 2019년 3~5월은 미중 관세전쟁 기간입니다. 당시 세계 교역은 이미 전년동기대비 1.8% 감소했습니다. 이 페이지의 시계열에서 2020년 11월 중국의 수출은 전년동월대비 6.6%, 수입은 8.1% 많았습니다."
      items:
        - kind: reporting
          number:
            en: "China's All goods exports −9.1% ($642.3bn → $583.7bn), Mar–May 2019 → Mar–May 2020."
            ko: "중국의 전체 상품 수출은 −9.1%($642.3bn → $583.7bn)입니다(2019년 3~5월 → 2020년 3~5월)."
          en: "China's customs put exports at −6.6% in March, +3% in April and −3% in May 2020 on a year earlier in dollars. This page draws each flow from the importer's report for every month it filed (else the exporter's report spliced to the importer's level), so China's exports here are mostly partners' import figures: China → United States is the US report, $110.1bn → $91.6bn (−16.8%)."
          ko: "중국 해관은 2020년 수출을 달러 기준 전년동월대비 3월 −6.6%, 4월 +3%, 5월 −3%로 집계했습니다. 이 페이지는 수입국이 보고한 달에는 수입국 보고를 쓰고, 그렇지 않은 달에는 수출국 보고를 수입국 수준에 맞춰 이어 붙입니다. 따라서 여기서 중국의 수출은 대부분 상대국의 수입 통계입니다. 중국 → 미국은 미국 보고로 $110.1bn → $91.6bn(−16.8%)입니다."
          sources: [7, 8, 9]
          checked: 2026-10-25
        - kind: denominator
          number:
            en: "China 13.5% → 15.3% of world All goods exports (+1.8 pp) while its exports fell 9.1% and world trade 19.9%; masks: 56.3% → 88.1% of world exports, +1382%."
            ko: "세계 전체 상품 수출에서 중국 비중은 13.5% → 15.3%(+1.8%p)로 높아졌습니다. 같은 기간 중국 수출은 9.1%, 세계 교역은 19.9% 줄었습니다. 마스크는 세계 수출에서 중국 비중이 56.3% → 88.1%, 수출액은 +1382%입니다."
          en: "The WTO counts world trade −14% in the first half of 2020 and medical goods +16%: China supplied 56% of world face-mask exports, and its exports of COVID-19-critical products tripled from $18bn to $55bn, 12% to 29% of the world total. China's white paper counts 70.6 billion masks and 96,700 ventilators exported from 1 March to 31 May 2020."
          ko: "WTO 집계로 2020년 상반기 세계 교역은 14% 줄고 의료용품 교역은 16% 늘었습니다. 중국은 세계 마스크 수출의 56%를 공급했습니다. 중국의 코로나19 필수 품목 수출은 180억 달러에서 550억 달러로 세 배가 됐습니다. 세계 비중은 12%에서 29%로 상승했습니다. 중국 백서는 2020년 3월 1일~5월 31일 마스크 706억 장과 인공호흡기 9만 6,700대를 수출했다고 밝혔습니다."
          sources: [11, 12]
          checked: 2026-10-25
        - kind: price
          number:
            en: "China's All goods imports −10.9% ($487.0bn → $433.9bn); UAE 1.2% → 0.80% and Saudi Arabia 1.4% → 1.0% of world exports."
            ko: "중국의 전체 상품 수입은 −10.9%($487.0bn → $433.9bn)입니다. 세계 수출에서 UAE 비중은 1.2% → 0.80%, 사우디아라비아 비중은 1.4% → 1.0%입니다."
          en: "Brent averaged $18.38 a barrel in April 2020, against $71.23 a year earlier. BOFIT attributes about 5 points of China's 14% import fall in April to crude oil alone; in May China imported a record volume of crude for about $15bn less than it would have cost in May 2019. The WTO counts fuels and mining trade −38% in the second quarter as prices collapsed."
          ko: "브렌트유는 2020년 4월 배럴당 평균 18.38달러로, 전년동월 71.23달러에서 하락했습니다. BOFIT는 4월 중국 수입 감소 14% 가운데 약 5%p를 원유 하나로 설명했습니다. 5월 중국은 통계 집계 이후 최대 물량의 원유를 수입하면서도 2019년 5월보다 약 150억 달러 적게 지불했습니다. WTO 집계로 2분기 연료·광물 교역은 가격 급락으로 38% 감소했습니다."
          sources: [4, 8, 9, 10]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Asia, not elsewhere specified (most importers' records of Taiwan) → China: 8.5% → 10.4% of China's imports (+2.0 pp); Asia, not elsewhere specified 2.4% → 3.1% of world All goods exports."
            ko: "기타 아시아(대부분 수입국의 대만 기록) → 중국: 중국 수입에서 비중은 8.5% → 10.4%(+2.0%p)입니다. 세계 전체 상품 수출에서 기타 아시아 비중은 2.4% → 3.1%입니다."
          en: "Taiwan does not report to UN Comtrade, and most importers book their trade with Taiwan under \"Other Asia, nes\" (code 490), which this site shows as Asia, not elsewhere specified, never as Taiwan: every flow here is the partner's report, and Asia, not elsewhere specified → China is China's import record. Taiwan's finance ministry put May 2020 exports at −2.0% ($27bn), with telecommunications products and tech gadgets up nearly 11% on telecommuting demand and exports to the mainland and Hong Kong up 10.3% to $12.12bn."
          ko: "대만은 UN Comtrade에 보고하지 않습니다. 대부분의 수입국은 대만과의 교역을 \"Other Asia, nes\"(코드 490)로 기록합니다. 이 사이트는 이를 대만이 아닌 '기타 아시아'로 표시합니다. 여기서 모든 흐름은 상대국 보고이므로 기타 아시아 → 중국은 중국의 수입 기록입니다. 대만 재정부는 2020년 5월 수출을 −2.0%($27bn)로 집계했습니다. 재택근무 수요로 통신제품과 IT 기기는 11% 가까이 늘었습니다. 중국 본토·홍콩으로의 수출은 10.3% 늘어난 $12.12bn이었습니다."
          sources: [13, 14, 15]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "WHO Director-General's opening remarks at the media briefing on COVID-19 - 11 March 2020", publisher: "World Health Organization", date: 2020-03-11, url: "https://www.who.int/news-room/speeches/item/who-director-general-s-opening-remarks-at-the-media-briefing-on-covid-19---11-march-2020"}
      - {n: 2, title: "Statement on the second meeting of the International Health Regulations (2005) Emergency Committee regarding the outbreak of novel coronavirus (2019-nCoV)", publisher: "World Health Organization", date: 2020-01-30, url: "https://www.who.int/news/item/30-01-2020-statement-on-the-second-meeting-of-the-international-health-regulations-(2005)-emergency-committee-regarding-the-outbreak-of-novel-coronavirus-(2019-ncov)"}
      - {n: 3, title: "Trade set to plunge as COVID-19 pandemic upends global economy (PRESS/855)", publisher: "World Trade Organization", date: 2020-04-08, url: "https://www.wto.org/english/news_e/pres20_e/pr855_e.htm"}
      - {n: 4, title: "Trade shows signs of rebound from COVID-19, recovery still uncertain (PRESS/862)", publisher: "World Trade Organization", date: 2020-10-06, url: "https://www.wto.org/english/news_e/pres20_e/pr862_e.htm"}
      - {n: 5, title: "World trade primed for strong but uneven recovery after COVID-19 pandemic shock (PRESS/876)", publisher: "World Trade Organization", date: 2021-03-31, url: "https://www.wto.org/english/news_e/pres21_e/pr876_e.htm"}
      - {n: 6, title: "Statement on the fifteenth meeting of the IHR (2005) Emergency Committee on the COVID-19 pandemic", publisher: "World Health Organization", date: 2023-05-05, url: "https://www.who.int/news/item/05-05-2023-statement-on-the-fifteenth-meeting-of-the-international-health-regulations-(2005)-emergency-committee-regarding-the-coronavirus-disease-(covid-19)-pandemic"}
      - {n: 7, title: "China March exports slump slows to 6.6% year-on-year, imports down 0.9%", publisher: "Reuters (Gabriel Crossley, Lusha Zhang), via WHBL", date: 2020-04-13, url: "https://whbl.com/2020/04/13/china-march-exports-slump-slows-to-6-6-year-on-year-imports-down-0-9/"}
      - {n: 8, title: "Chinese goods exports performed surprisingly well in April, while imports from the US contracted sharply (BOFIT Weekly Review 20/2020)", publisher: "Bank of Finland Institute for Emerging Economies (BOFIT)", date: 2020-05-15, url: "https://www.bofit.fi/en/monitoring/weekly/2020/vw202020_3/"}
      - {n: 9, title: "Lower commodity prices reduce value of Chinese imports in May; exports down just slightly (BOFIT Weekly Review 24/2020)", publisher: "Bank of Finland Institute for Emerging Economies (BOFIT)", date: 2020-06-12, url: "https://www.bofit.fi/en/monitoring/weekly/2020/vw202024_3"}
      - {n: 10, title: "Europe Brent Spot Price FOB, monthly (dollars per barrel)", publisher: "U.S. Energy Information Administration", date: 2026-10-21, url: "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=RBRTE&f=M"}
      - {n: 11, title: "Trade in medical goods in the context of tackling COVID-19: developments in the first half of 2020 (information note)", publisher: "World Trade Organization", date: 2020-12-22, url: "https://www.wto.org/english/tratop_e/covid19_e/medical_goods_update_e.pdf"}
      - {n: 12, title: "Fighting COVID-19: China in Action (white paper, full text)", publisher: "State Council Information Office of the People's Republic of China, via China Daily Global", date: 2020-06-08, url: "https://epaper.chinadaily.com.cn/a/202006/08/WS5edd76f5a3107831ec752924.html"}
      - {n: 13, title: "Taiwan cautious on trade outlook as May exports fall again", publisher: "Reuters (Yimou Lee, Liang-sa Loh), via WHBL", date: 2020-06-08, url: "https://whbl.com/2020/06/08/taiwan-cautious-on-trade-outlook-as-may-exports-fall-again/"}
      - {n: 14, title: "Taiwan's exports keep shrinking", publisher: "Xinhua, via China Services Info", date: 2020-06-10, url: "https://www.chinaservicesinfo.com/s/202006/10/WS5f30af39498ed1e2f34086ae/taiwans-exports-keep-shrinking.html"}
      - {n: 15, title: "Reporters reference table (Reporters.json)", publisher: "UN Comtrade", date: 2026-10-01, url: "https://comtradeapi.un.org/files/v1/app/reference/Reporters.json"}

  - id: suez-chips-2021
    num: "5"
    start: 2021-03-23
    end: 2021-03-29          # the Ever Given refloated and canal traffic resumed; the chip shortage ran on through 2021
    ongoing: false
    kind: logistics
    title: {en: "Ever Given blocks Suez as a chip shortage hits carmakers", ko: "에버기븐호 수에즈 봉쇄, 차량용 반도체 부족"}
    dek:
      en: "The container ship Ever Given ran aground across the Suez Canal on 23 March 2021 and was refloated on 29 March. A shortage of chips held back US vehicle production through 2021; buyers' median chip inventories fell from 40 days in 2019 to less than five in 2021, the US Commerce Department found."
      ko: "컨테이너선 에버기븐호가 2021년 3월 23일 수에즈 운하를 가로막고 좌초했다가 29일 다시 떠올랐습니다. 2021년 내내 반도체 부족이 미국 차량 생산을 제약했습니다. 미국 상무부 조사에서 구매 기업의 반도체 재고 중앙값은 2019년 40일에서 2021년 5일 미만으로 줄었습니다."
    timeline:
      - {date: 2021-03-19, en: "Fire halts Renesas's 300mm chip line at Naka, Japan", ko: "르네사스 나카 공장 화재로 300mm 라인 가동 중단", source: 3}
      - {date: 2021-03-23, en: "Ever Given runs aground and blocks the Suez Canal", ko: "에버기븐호 좌초, 수에즈 운하 봉쇄", source: 1}
      - {date: 2021-03-29, en: "Ship refloated; canal traffic resumes", ko: "선박 부양, 운하 통항 재개", source: 2}
      - {date: 2021-04-03, en: "Suez Canal Authority: the queue of 422 ships has cleared", ko: "수에즈운하청, 대기 선박 422척 통과 완료", source: 6}
      - {date: 2021-07-08, en: "Cleveland Fed: chip shortage constrains US vehicle production", ko: "클리블랜드 연준, 반도체 부족이 미국 차량 생산 제약", source: 4}
      - {date: 2022-01-25, en: "US Commerce: median chip inventory down from 40 days in 2019 to under 5 in 2021", ko: "미국 상무부, 반도체 재고 중앙값 2019년 40일에서 2021년 5일 미만으로 감소", source: 5}
    products: ["B:cars", "B:chips_ic", "B:car_parts"]
    economies: [EGY, JPN, USA]
    view: {f: M, p: "B:cars", base: 202009, t: 202109, lens: M}
    watch:
      en: "World car trade falling while chip trade rose in 2021: the chain's mismatch, and which suppliers filled the gaps."
      ko: "2021년 반도체 교역은 늘었는데 세계 자동차 교역은 줄어든 공급망의 엇박자를 살펴봅니다. 어느 공급국이 그 감소분을 대체했는지도 확인합니다."
    reading:
      window:
        en: "Jul–Sep 2021 starts three months after the canal reopened on 29 March 2021 and holds the chip shortage near its worst: in the series on this page world trade was −16.6% on a year earlier in November 2021 and Japan's exports −33.0%. The base, Jul–Sep 2020, was itself 10.7% below a year earlier."
        ko: "2021년 7~9월은 운하가 2021년 3월 29일 다시 열린 지 석 달 뒤에 시작하며, 반도체 부족이 가장 심하던 때와 겹칩니다. 이 페이지 계열에서 2021년 11월 세계 교역은 전년동월대비 −16.6%, 일본 수출은 −33.0%였습니다. 기준 기간인 2020년 7~9월도 1년 전보다 10.7% 낮았습니다."
      items:
        - kind: cycle
          number:
            en: "World passenger-car trade: −2.7% on a year earlier in Jul–Sep 2021 ($161.7bn → $157.2bn), after −10.7% in Jul–Sep 2020; −16.6% in Nov 2021, the lowest since the base."
            ko: "세계 승용차 교역은 2021년 7~9월 전년동기대비 −2.7%($161.7bn → $157.2bn)를 기록했습니다. 2020년 7~9월 −10.7%에 이은 감소입니다. 2021년 11월에는 −16.6%로 기준 시점 이후 가장 낮았습니다."
          en: "The window holds the chip shortage, not the canal: the 422-ship backlog cleared by 3 April 2021, and canal transits rose 10% in 2021 to 20,694. Statistics Canada: since early 2021 a shortage of semiconductor chips forced carmakers worldwide to slow or halt production, and the stoppages intensified in North America in September, when US output of motor vehicles and parts fell 7.2%."
          ko: "이 기간에 담긴 것은 운하가 아니라 반도체 부족입니다. 대기 선박 422척은 2021년 4월 3일까지 모두 통과했습니다. 2021년 운하 통항 선박은 10% 늘어 20,694척이었습니다. 캐나다 통계청에 따르면 2021년 초부터 반도체 부족으로 세계 자동차 업체들이 생산을 늦추거나 멈췄습니다. 북미의 생산 중단은 9월에 더 심해졌습니다. 그달 미국의 자동차·부품 생산은 7.2% 감소했습니다."
          sources: [6, 7, 8, 9]
          checked: 2026-10-25
        - kind: denominator
          number:
            en: "United States imports −11.8% ($37.8bn → $33.3bn): Canada → United States −$3.3bn (−37.4%), Mexico → United States −$1.9bn (−23.0%); Japan's share of US imports 21.3% → 25.7%, Korea's 11.0% → 13.7%."
            ko: "미국 수입은 −11.8%($37.8bn → $33.3bn)입니다. 캐나다 → 미국은 −$3.3bn(−37.4%), 멕시코 → 미국은 −$1.9bn(−23.0%)입니다. 미국 수입에서 일본 비중은 21.3% → 25.7%, 한국 비중은 11.0% → 13.7%로 높아졌습니다."
          en: "The fall is North American assembly: Canada's motor-vehicle and parts exports were 40.2% below September 2020, passenger cars and light trucks down 25.8% from August on production stoppages, and Mexico exported 195,294 light vehicles that month, 24.2% fewer than a year earlier. Japan → United States rose only $505m (+6.3%): most of Japan's share gain is the shrinking denominator."
          ko: "감소는 북미 자동차 조립에서 비롯됐습니다. 캐나다의 자동차·부품 수출은 2020년 9월보다 40.2% 적었습니다. 승용차·경트럭 수출은 생산 중단으로 8월보다 25.8% 줄었습니다. 멕시코는 같은 달 소형차량 195,294대를 수출해 1년 전보다 24.2% 적었습니다. 일본 → 미국은 $505m(+6.3%) 늘어나는 데 그쳤습니다. 일본의 점유율 상승은 대부분 분모가 줄어든 결과입니다."
          sources: [8, 10]
          checked: 2026-10-25
        - kind: cycle
          number:
            en: "Japan exports +9.7% ($21.1bn → $23.2bn) in Jul–Sep 2021, then −20.6% (Oct), −33.0% (Nov) and −29.1% (Dec 2021) on a year earlier."
            ko: "일본 수출은 2021년 7~9월 +9.7%($21.1bn → $23.2bn) 늘었습니다. 이후 전년동월대비 10월 −20.6%, 11월 −33.0%, 2021년 12월 −29.1%를 기록했습니다."
          en: "Jul–Sep 2020 was itself 25.5% below a year earlier, and the fall came at the window's end: Japan's car exports in September 2021 were 46.6% below September 2020 by value (258,857 units, −40.1%). Toyota cut its September plan by about 70,000 vehicles and October's by about 330,000 for a parts shortage caused by COVID-19 in Southeast Asia and tighter semiconductor supplies."
          ko: "2020년 7~9월 자체가 전년동기대비 25.5% 낮았고, 감소는 창의 끝에서 나타났습니다. 2021년 9월 일본의 승용차 수출은 금액 기준으로 2020년 9월보다 46.6% 적었습니다(258,857대, −40.1%). 도요타는 동남아시아의 코로나19 확산에 따른 부품 부족과 반도체 공급 제약으로 9월 생산 계획을 약 7만 대 줄였습니다. 10월 계획은 약 33만 대 줄였습니다."
          sources: [11, 12]
          checked: 2026-10-25
        - kind: denominator
          number:
            en: "Egypt's passenger-car exports: no flow is positive in every month of either window, so no Egypt export bar is drawn; Egypt's imports +20.9% ($667m → $806m), China's share 6.8% → 13.9%."
            ko: "이집트 승용차 수출은 어느 창에서도 모든 달에 양(+)인 흐름이 없어 이집트 수출 막대를 그리지 않습니다. 이집트 수입은 +20.9%($667m → $806m)이고, 중국 비중은 6.8% → 13.9%입니다."
          en: "Egypt exports almost no passenger cars, and its few flows skip months, so under the monthly rule none enters either window and the page draws no Egypt export bar. Its imports grew with its market: AMIC counted almost 291,000 new vehicles sold in 2021 (+26%), passenger cars +28% to 215,000, and 42,392 Chinese cars sold in January–October 2021, up from 21,585."
          ko: "이집트는 승용차를 거의 수출하지 않습니다. 몇 안 되는 흐름도 빠지는 달이 있습니다. 그래서 월별 기준으로는 어느 창에도 포함되지 않아 이 페이지에는 이집트 수출 막대가 없습니다. 이집트 수입은 시장과 함께 늘었습니다. AMIC 집계로 2021년 신차 판매는 약 291,000대(+26%)였고, 승용차는 28% 늘어 215,000대였습니다. 2021년 1~10월 중국산 차 판매는 42,392대로 21,585대에서 늘었습니다."
          sources: [13, 14]
          checked: 2026-10-25
    sources:
