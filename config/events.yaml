  - id: us-china-tariffs-rare-earths-2025
    num: "10"
    start: 2025-04-02
    end: null
    ongoing: true          # MOFCOM, 28 Sep 2026: the Kuala Lumpur arrangement (suspensions to 10 Nov 2026) extended to 10 Jan 2027
    kind: tariff
    title: {en: "US sets reciprocal tariffs, China curbs rare-earth exports", ko: "미국 상호관세 부과, 중국 희토류 수출통제"}
    dek:
      en: "On 2 April 2025 the US ordered tariffs on imports from all countries, and on 4 April China put seven rare earths under export licensing; the US rate on Chinese goods rose to 125% before a truce in Geneva on 12 May. After Xi and Trump met in Busan on 30 October, China suspended the wider controls it had announced on 9 October, a truce since extended to 10 January 2027."
      ko: "미국은 2025년 4월 2일 모든 나라의 수입품에 관세를 부과하기로 했습니다. 중국은 4월 4일 희토류 7종을 수출허가 대상으로 지정했습니다. 미국의 대중 상호관세율은 125%까지 올랐다가 5월 12일 제네바 합의로 인하됐습니다. 10월 30일 부산 회담 뒤 중국은 10월 9일 발표한 확대 통제를 유예했습니다. 이 휴전은 2027년 1월 10일까지 연장됐습니다."
    timeline:
      - {date: 2025-04-02, en: "US orders reciprocal tariffs: 10% on all countries from 5 April, higher rates from 9 April", ko: "미국, 상호관세 발표(4월 5일 10% 기본관세)", source: 1}
      - {date: 2025-04-04, en: "China requires export licences for seven medium and heavy rare earths", ko: "중국, 중·중(重)희토류 7종 수출허가제 시행", source: 2}
      - {date: 2025-04-09, en: "US pauses the higher rates for 90 days except for China, whose reciprocal rate rises to 125%", ko: "미국, 중국 외 고율관세 90일 유예·대중 125%", source: 3}
      - {date: 2025-05-12, en: "Geneva joint statement: both sides suspend 24 points of their tariffs for 90 days", ko: "제네바 공동성명, 양국 관세 90일 인하", source: 4}
      - {date: 2025-10-09, en: "China adds five rare earths and requires licences for goods containing even trace amounts", ko: "중국, 희토류 5종 추가·역외 통제 확대", source: 5}
      - {date: 2025-10-30, en: "Xi and Trump meet in Busan; China agrees to suspend the October expansion for a year", ko: "부산 미·중 정상회담, 확대 통제 1년 유예 합의", source: 5}
      - {date: 2025-11-07, en: "China suspends its October control announcements until 10 November 2026", ko: "중국, 10월 통제 공고 2026년 11월 10일까지 유예", source: 6}
      - {date: 2026-02-20, en: "US Supreme Court rules that IEEPA does not authorize the President to impose tariffs", ko: "미 대법원, IEEPA 관세 권한 불인정", source: 7}
    products: ["TOTAL", "C:magnets:magnets", "B:rare_earths"]
    economies: [USA, CHN]
    # t 202506: Apr-Jun 2025, the months of the 125% rate and the Geneva cut, against Apr-Jun 2024.
    # Importer-reported: China has filed only to Dec 2024, so its 2025 exports are seen through the
    # US's, Japan's and India's imports (filed to Jul-Aug 2026); Korea's from its customs service from Jan 2026.
    view: {f: M, p: "TOTAL", base: 202406, t: 202506, lens: M}
    watch:
      en: "Reporters' monthly imports from China against the same months a year earlier, through the April 2025 escalation, the Geneva cut and the 2026 ruling; rare-earth magnet (8505.11) exports by destination and who else supplies magnets and rare-earth compounds. China has filed only to December 2024, so after that its exports show only as partners' imports."
      ko: "각국의 월별 중국산 수입을 전년동월과 비교합니다. 2025년 4월 확전, 제네바 인하, 2026년 판결 전후가 기준입니다. 희토류 영구자석(8505.11)의 목적지별 수출과 자석·희토류 화합물의 다른 공급국도 살펴봅니다. 중국은 2024년 12월분까지만 신고했습니다. 그 뒤 중국의 수출은 상대국 수입으로만 나타납니다."
    # 9 Oct 2025 primary texts (checked): MOFCOM Announcement No. 61 of 2025 (foreign-made items with
    # 0.1% or more Chinese rare-earth content by value), https://www.mofcom.gov.cn/zcfb/blgg/gg/2025/art/2025/art_e2587592fd774f23a62925ee51641071.html ;
    # MOFCOM/GAC No. 57 of 2025 (holmium and others, effective 8 Nov 2025), https://www.mofcom.gov.cn/zcfb/blgg/gg/2025/art/2025/art_9510f263c3c246d8936fbfa684a58ca8.html
    # The plan's Mining.com link (https://www.mining.com/?p=1191831) resolves to source 5.
    reading:
      window:
        en: "Apr–Jun 2025 spans the 10% baseline tariff (5 April), the 125% rate on China (9 April to the Geneva truce of 12 May) and the first weeks of China's rare-earth licences: the immediate impact, after a first quarter in which US imports ran 25% above a year earlier on front-loading. China's filings end in December 2024, so its figures are read from partners."
        ko: "2025년 4~6월에는 10% 기본관세(4월 5일)가 들어 있습니다. 대중국 125% 관세(4월 9일부터 5월 12일 제네바 합의까지)와 중국 희토류 수출허가제의 첫 몇 주도 포함됩니다. 이 기간은 미국 수입이 선주문으로 전년동기대비 25% 많았던 1분기 직후의 즉각적 영향을 나타냅니다. 중국의 신고는 2024년 12월에 끝나므로 중국 수치는 상대국 신고로 읽습니다."
      items:
        - kind: reporting
          number:
            en: "Hong Kong → China: 0.83% → 1.9% of China's all-goods imports, $5.2bn → $8.0bn (Apr–Jun 2024 → Apr–Jun 2025)."
            ko: "홍콩 → 중국 수출이 중국 전체 상품 수입에서 차지하는 비중은 0.83%에서 1.9%로, 금액은 $5.2bn에서 $8.0bn으로 늘었습니다(2024년 4~6월 → 2025년 4~6월)."
          en: "China's filings end in December 2024, so the 2025 figure is Hong Kong's export report spliced to China's own level (the ratio of the two reports in the 12 months to December 2024). Hong Kong's report counts re-exports of goods made elsewhere (of HK$295.6bn exported to the US in 2024, HK$289.7bn were re-exports). Importers record goods by country of origin, so in 2024 China reported $18.5bn of imports from Hong Kong against Hong Kong's $378bn of exports to China."
          ko: "중국의 신고 자료는 2024년 12월에서 끝납니다. 그래서 2025년 수치는 홍콩의 수출 보고를 중국 자체 수준에 맞춰 이어 붙인 것입니다(2024년 12월까지 12개월간 두 보고의 비율 적용). 홍콩의 보고에는 다른 지역에서 생산된 상품의 재수출이 포함됩니다(2024년 미국으로 수출한 HK$295.6bn 가운데 HK$289.7bn이 재수출). 수입국은 원산지 기준으로 상품을 기록합니다. 이 때문에 2024년 중국이 보고한 홍콩으로부터의 수입은 $18.5bn이지만, 홍콩이 중국으로 수출했다고 보고한 금액은 $378bn입니다."
          sources: [12, 13]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "China's all-goods exports and imports: no change bars at Apr–Jun 2025 (China's own report at the base, its partners' at t)."
            ko: "중국의 전체 상품 수출입에는 2025년 4~6월 변화 막대가 없습니다(기준 시점은 중국 자체 보고, t 시점은 상대국 보고 기준)."
          en: "China has filed nothing for 2025, so its 2025 windows are its partners' reports (spliced to China's level), so the page draws no change bar against its own 2024 report; and Taiwan (not a Comtrade reporter), Vietnam, Russia and the UAE are missing from the sum. China's customs put first-half 2025 exports at +7.2% and imports at −2.7% in yuan terms; trade with the United States fell 9.3% and trade with ASEAN rose 9.6%."
          ko: "중국은 2025년 자료를 전혀 제출하지 않았습니다. 따라서 2025년 창은 상대국 보고를 중국 수준에 맞춰 이어 붙인 것이며, 페이지는 중국 자체의 2024년 보고와 비교한 변화 막대를 그리지 않습니다. 대만(Comtrade 보고국 아님)·베트남·러시아·아랍에미리트(UAE)는 합계에서 빠져 있습니다. 중국 세관 통계로는 2025년 상반기 위안화 기준 수출이 +7.2%, 수입이 −2.7%였습니다. 미국과의 교역은 9.3% 줄었고 ASEAN과의 교역은 9.6% 늘었습니다."
          sources: [14, 15, 16]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "China → United States: 12.8% → 8.2% of US all-goods imports, $106.5bn → $69.2bn; Vietnam → United States 4.1% → 6.0% (Apr–Jun 2024 → Apr–Jun 2025)."
            ko: "중국 → 미국 수입은 미국 전체 상품 수입의 12.8%에서 8.2%로, $106.5bn에서 $69.2bn으로 줄었습니다. 베트남 → 미국은 4.1%에서 6.0%로 늘었습니다(2024년 4~6월 → 2025년 4~6월)."
          en: "Census tables agree: imports from China $100.8bn → $64.7bn in April–June, after a first quarter only 5.5% above 2024, while imports from Vietnam rose $32.9bn → $48.6bn. The WTO attributes early-2025 trade growth to a surge in North American imports ahead of tariff hikes; Vietnam's statistics office puts first-half exports to the US at $70.9bn and imports from China at $84.7bn."
          ko: "미국 센서스국 자료도 같습니다. 4~6월 중국산 수입은 1,008억 달러에서 647억 달러로 줄었습니다. 그 앞 1분기는 2024년보다 5.5% 많았을 뿐입니다. 베트남산 수입은 329억 달러에서 486억 달러로 늘었습니다. WTO는 2025년 초 교역 증가를 관세 인상 전 북미 수입 증가로 설명했습니다. 베트남 통계청은 2025년 상반기 대미 수출을 709억 달러, 중국산 수입을 847억 달러로 집계했습니다."
          sources: [9, 10, 11, 18]
          checked: 2026-10-25
        - kind: scope
          number:
            en: "United States imports of permanent magnets −36.1% on a year earlier (Apr–Jun 2025); China 77.1% → 66.9% of them."
            ko: "미국의 영구자석 수입은 전년동기대비 −36.1%입니다(2025년 4~6월). 이 가운데 중국 비중은 77.1%에서 66.9%로 낮아졌습니다."
          en: "From 4 April 2025 China's licence covers samarium-cobalt magnets and NdFeB magnets containing terbium or dysprosium, not every magnet in 8505.11. Customs data reported by Reuters: China's magnet exports fell to 1,238 tonnes in May, 74% below a year earlier, then 3,188 tonnes in June, of which 353 tonnes went to the US, up 660% from May."
          ko: "2025년 4월 4일부터 중국의 수출허가 대상은 사마륨코발트 자석과, 테르븀·디스프로슘을 함유한 네오디뮴 자석입니다. 8505.11의 모든 자석이 대상은 아닙니다. 로이터가 전한 해관 자료에 따르면 중국의 자석 수출은 5월 1,238톤으로 전년동월대비 74% 감소했습니다. 6월에는 3,188톤으로 늘었습니다. 그중 353톤이 미국으로 향해 5월보다 660% 많았습니다."
          sources: [2, 17]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "Fact Sheet: President Donald J. Trump Declares National Emergency to Increase our Competitive Edge, Protect our Sovereignty, and Strengthen our National and Economic Security", publisher: "The White House", date: 2025-04-02, url: "https://www.whitehouse.gov/fact-sheets/2025/04/fact-sheet-president-donald-j-trump-declares-national-emergency-to-increase-our-competitive-edge-protect-our-sovereignty-and-strengthen-our-national-and-economic-security/"}
