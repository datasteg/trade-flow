  - id: indonesia-nickel-ban-2020
    num: "3"
    start: 2020-01-01        # the ban took effect on 1 January 2020
    end: null                # still in force (IEA policy database, status "In force", updated 19 Mar 2024)
    ongoing: true
    kind: ban
    title: {en: "Indonesia bans nickel-ore exports", ko: "인도네시아, 니켈 원광 수출금지"}
    dek:
      en: "Indonesia stopped all nickel-ore exports from 1 January 2020, two years earlier than first planned, so that the ore would be processed at home. A WTO panel found the ban inconsistent with the GATT in November 2022, and Indonesia appealed."
      ko: "인도네시아는 원광을 국내에서 가공하려고 2020년 1월 1일부터 니켈 원광 수출을 전면 금지했습니다. 애초 계획보다 2년 앞당긴 조치였습니다. WTO 패널은 2022년 11월 이 조치가 GATT에 어긋난다고 판정했고, 인도네시아는 상소했습니다."
    timeline:
      - {date: 2014-01-11, en: "First ban on nickel-ore exports (ESDM Regulation 1/2014)", ko: "첫 니켈 원광 수출금지(에너지광물자원부 규정 1/2014)", source: 2}
      - {date: 2019-09-02, en: "Mining ministry announces a ban on all grades from 1 January 2020", ko: "광업 당국, 2020년 1월 1일부터 전 등급 수출금지 발표", source: 1}
      - {date: 2019-11-22, en: "EU requests WTO consultations (DS592)", ko: "EU, WTO에 협의 요청(DS592)", source: 3}
      - {date: 2020-01-01, en: "Ban on nickel-ore exports takes effect", ko: "니켈 원광 수출금지 시행", source: 1}
      - {date: 2022-11-30, en: "WTO panel finds the ban inconsistent with GATT Article XI:1", ko: "WTO 패널, 수출금지가 GATT 제11조 1항 위반이라고 판정", source: 3}
      - {date: 2022-12-08, en: "Indonesia appeals the panel report", ko: "인도네시아, 패널 판정에 상소", source: 3}
    products: ["C:batteries:nickel_ore", "C:batteries:nickel_int", "C:steel:ferroalloys"]
    economies: [IDN]
    view: {f: A, p: "C:batteries:nickel_ore", base: 2019, t: 2020, lens: null}
    watch:
      en: "Indonesia leaving the nickel-ore trade, and its rise as an exporter of nickel intermediates (mattes, MHP, nickel sulphate) and ferro-alloys."
      ko: "인도네시아가 니켈 원광 교역에서 빠지고 니켈 중간재(매트, MHP, 황산니켈)와 합금철 수출국으로 올라서는지 살펴봅니다."
    reading:
      window:
        en: "2020 against 2019 sets the ban's first year against the pre-ban rush: the ministry announced the ban on 2 September 2019 with exports allowed to the end of December, and in the series on this page Indonesia's ore exports rose 82.4% in 2019 and fell a further 77.4% in 2021. Against 2018 ($1.0bn) the 2020 level is −79%."
        ko: "2020년을 2019년과 비교하면 금지 첫해를 금지 직전의 밀어내기 수출과 비교하는 셈입니다. 광업 당국은 2019년 9월 2일 금지를 발표하면서 12월말까지 수출을 허용했습니다. 이 페이지의 시계열에서 인도네시아의 광석 수출은 2019년에 82.4% 늘었다가 2021년에 다시 77.4% 줄었습니다. 2018년(10억 달러)과 비교하면 2020년 수준은 79% 낮습니다."
      items:
        - kind: front-loading
          number:
            en: "World nickel-ore trade: +25.3% in 2019 ($5.0bn), then −20.4% in 2020 ($4.0bn); Indonesia's exports $1.9bn (2019) → $217m (2020), −88.3%."
            ko: "세계 니켈 광석 교역은 2019년 25.3% 증가해 50억 달러, 2020년 20.4% 감소해 40억 달러였습니다. 인도네시아의 수출은 19억 달러(2019년)에서 2억 1,700만 달러(2020년)로 88.3% 감소했습니다."
          en: "The 2019 base is the pre-ban rush. On 2 September 2019 the energy ministry announced that ore below 1.7% nickel could not be exported from 1 January 2020, with a four-month transition to December. China's imports of Indonesian ore rose 72% to 23.9 million tonnes in 2019, 2.47 million tonnes in December alone, as traders stepped up purchases before the ban."
          ko: "2019년 기준치는 금지 직전의 밀어내기 수출이 반영된 값입니다. 에너지광물자원부는 2019년 9월 2일 니켈 함량 1.7% 미만 광석의 수출금지를 발표했습니다. 시행일은 2020년 1월 1일이었고, 12월까지 넉 달의 유예를 두었습니다. 중국의 인도네시아산 광석 수입은 2019년에 72% 늘어 2,390만 톤이었습니다. 상인들이 금지 전에 매입을 서두르면서 12월 한 달에만 247만 톤이 수입됐습니다."
          sources: [4, 5]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Indonesia → China: $1.8bn → $193m (−89.3%), still 89.2% of Indonesia's nickel-ore exports in 2020."
            ko: "인도네시아 → 중국: 18억 달러 → 1억 9,300만 달러(−89.3%). 2020년에도 인도네시아 니켈 광석 수출의 89.2%."
          en: "This flow is China's report. Chinese customs recorded 3.4 million tonnes of Indonesian ore in 2020 (−85.8%), 1.98 million tonnes of it in January and February: the last cargoes loaded before the 1 January ban. Indonesian data show zero nickel-ore exports to China for January to November 2020; analysts say some later cargoes left declared as iron ore."
          ko: "이 흐름은 중국 쪽 신고 기준입니다. 중국 세관은 2020년 인도네시아산 광석 340만 톤(−85.8%)을 집계했습니다. 그중 198만 톤은 1월 1일 금지 전에 선적돼 1~2월에 도착한 마지막 화물입니다. 인도네시아 통계에서 2020년 1~11월 대중 니켈 광석 수출은 0입니다. 분석가들은 그 뒤 일부 화물이 철광석으로 신고돼 수출됐다고 봅니다."
          sources: [6, 7]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "Philippines: 30.7% → 45.3% of world nickel-ore exports (+14.6 pp); Philippines → China $1.4bn → $1.8bn (+21.6%). New Caledonia 9.8% → 14.9%."
            ko: "필리핀: 세계 니켈 광석 수출의 30.7% → 45.3%(+14.6%p). 필리핀 → 중국 14억 달러 → 18억 달러(+21.6%). 뉴칼레도니아 9.8% → 14.9%."
          en: "China's nickel-ore imports fell 34.4% to 38.7 million tonnes in 2020, while those from the Philippines held at 31.8 million tonnes (+0.7%): the rise in value is more per tonne, not more ore, and the flow is China's report, 1.68 times what the Philippines reports. New Caledonia's SLN exported 2.5 million wet tonnes of ore in 2020, +55%."
          ko: "중국의 니켈 광석 수입은 2020년에 34.4% 줄어 3,870만 톤이었습니다. 필리핀산은 3,180만 톤(+0.7%)으로 유지됐습니다. 금액 증가는 물량이 아니라 톤당 단가가 오른 결과입니다. 이 흐름은 중국 쪽 신고 기준이며, 필리핀 쪽 신고의 1.68배입니다. 뉴칼레도니아의 SLN은 2020년에 광석 250만 습식톤을 수출해 55% 늘었습니다."
          sources: [8, 10]
          checked: 2026-10-25
        - kind: scope
          number:
            en: "Indonesia: 37.4% → 5.5% of world nickel-ore exports (−31.9 pp), but 16.7% → 16.3% of world nickel mattes and intermediates exports."
            ko: "인도네시아: 세계 니켈 광석 수출의 37.4% → 5.5%(−31.9%p). 그러나 세계 니켈 매트·중간재 수출에서는 16.7% → 16.3%."
          en: "The ban covers ore only. China's imports of nickel pig iron from Indonesia rose 100.9% to 2.73 million tonnes in 2020, and USGS records the continued ramp-up of nickel pig iron and stainless-steel projects in Indonesia while its mine output fell from 853,000 to 760,000 tonnes of nickel content. Ferronickel is HS 7202, the ferro-alloys stage, not the intermediates charted here."
          ko: "금지 대상은 광석뿐입니다. 중국의 인도네시아산 니켈 선철 수입은 2020년에 100.9% 늘어 273만 톤이었습니다. USGS에 따르면 인도네시아의 광산 생산은 니켈 함량 기준 85만 3,000톤에서 76만 톤으로 줄었습니다. 그동안 니켈 선철·스테인리스강 사업의 증설은 이어졌습니다. 페로니켈은 HS 7202로, 여기 그린 중간재가 아니라 페로알로이 단계에 속합니다."
          sources: [7, 9]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "World's biggest nickel ore maker bans exports from January 2020", publisher: "Reuters (via Al Jazeera)", date: 2019-09-02, url: "https://www.aljazeera.com/economy/2019/9/2/worlds-biggest-nickel-ore-maker-bans-exports-from-january-2020"}
      - {n: 2, title: "Prohibition of the export of nickel ore", publisher: "International Energy Agency, policies database", date: 2024-03-19, url: "https://www.iea.org/policies/16084-prohibition-of-the-export-of-nickel-ore"}   # "last updated" date
      - {n: 3, title: "DS592: Indonesia — Measures relating to raw materials", publisher: "World Trade Organization", date: null, accessed: 2026-10-24, url: "https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds592_e.htm"}
      - {n: 4, title: "Bijih Nikel Tidak Boleh Diekspor Lagi per Januari 2020 (Siaran Pers 549.Pers/04/SJI/2019)", publisher: "Kementerian ESDM (Ministry of Energy and Mineral Resources, Indonesia)", date: 2019-09-02, url: "https://www.esdm.go.id/id/media-center/arsip-berita/bijih-nikel-tidak-boleh-diekspor-lagi-per-januari-2020"}
      - {n: 5, title: "China's imports of Indonesian nickel ore rose 72% in 2019", publisher: "Shanghai Metals Market (SMM), from China customs data", date: 2020-02-03, url: "https://news.metal.com/newscontent/101022234-chinas-imports-of-indonesian-nickel-ore-rose-72-in-2019"}
      - {n: 6, title: "China's nickel ore imports dropped 38% in January as Indonesia banned exports", publisher: "Shanghai Metals Market (SMM), from China customs data", date: 2020-02-27, url: "https://news.metal.com/newscontent/101033457-chinas-nickel-ore-imports-dropped-38-in-january-as-indonesia-banned-exports"}
      - {n: 7, title: "Indonesia stays China's second-biggest nickel ore supplier despite export ban", publisher: "Reuters (via The Jakarta Post)", date: 2021-01-20, url: "https://www.thejakartapost.com/news/2021/01/20/indonesia-stays-chinas-second-biggest-nickel-ore-supplier-despite-export-ban"}
      - {n: 8, title: "Imports of nickel ore and ferronickel declined significantly in December 2020", publisher: "Shanghai Metals Market (SMM), from China customs data", date: 2021-01-26, url: "https://news.metal.com/newscontent/101382010-imports-of-nickel-ore-and-ferronickel-declined-significantly-in-december-2020"}
      - {n: 9, title: "Mineral Commodity Summaries 2021: Nickel (January 2021)", publisher: "U.S. Geological Survey", date: 2021-01-29, url: "https://pubs.usgs.gov/periodicals/mcs2021/mcs2021-nickel.pdf"}
