  - id: iran-war-2026
    num: "12"
    start: 2026-02-28
    end: null
    ongoing: true
    kind: war
    title: {en: "War on Iran shuts the Strait of Hormuz", ko: "이란 전쟁으로 호르무즈 해협 봉쇄"}
    dek:
      en: "The US and Israel struck Iran on 28 February 2026 and tanker traffic through the Strait of Hormuz all but stopped. A ceasefire (8 April), a US blockade of Iran's ports (13 April) and a memorandum (17 June) did not hold: fighting resumed on 8 July and spread to Bab al-Mandab in September."
      ko: "미국과 이스라엘이 2026년 2월 28일 이란을 공습하자 호르무즈 해협의 유조선 통항이 사실상 멈췄습니다. 휴전(4월 8일), 미국의 이란 항만 봉쇄(4월 13일), 양해각서(6월 17일)가 이어졌습니다. 그러나 7월 8일 교전이 재개됐고, 9월에는 바브엘만데브 해협으로 번졌습니다."
    timeline:
      - {date: 2026-02-28, en: "US and Israel strike Iran; tanker traffic through Hormuz stops", ko: "미·이스라엘, 이란 공습… 호르무즈 통항 중단", source: 2}
      - {date: 2026-04-08, en: "Two-week ceasefire; Iran to let ships through the strait", ko: "2주 휴전, 해협 통항 허용", source: 4}
      - {date: 2026-04-13, en: "US naval blockade of Iran's ports takes effect", ko: "미국, 이란 항만 해상봉쇄 발효", source: 5}
      - {date: 2026-06-17, en: "US and Iranian presidents sign a memorandum to end the war", ko: "미·이란 대통령, 종전 양해각서 서명", source: 7}
      - {date: 2026-07-08, en: "Truce collapses: US strikes after Iran hits three ships", ko: "휴전 붕괴, 이란의 선박 공격에 미국 공습", source: 8}
      - {date: 2026-07-13, en: "US announces it will reinstate the blockade", ko: "미국, 해상봉쇄 재개 발표", source: 9}
      - {date: 2026-09-11, en: "Houthis take Mokha and Perim at Bab al-Mandab", ko: "후티, 바브엘만데브의 모카·페림 장악", source: 10}
      - {date: 2026-10-22, en: "Iran says seven tankers hit in Hormuz; the US disputes it", ko: "이란, 유조선 7척 피격 주장… 미국은 반박", source: 11}
    products: ["B:crude_oil", "B:natural_gas", "C:fertiliser:nitrogen"]
