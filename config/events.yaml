  - id: japan-korea-controls-2019
    num: "2"
    start: 2019-07-04        # METI: announced 1 July, individual licences from 4 July 2019
    end: 2023-03-23          # METI returns the three items to bulk licensing; Korea withdraws its WTO complaint
    ongoing: false
    kind: export-control
    title: {en: "Japan tightens chip-material exports to Korea", ko: "일본, 한국행 반도체 소재 수출규제"}
    dek:
      en: "From 4 July 2019 Japan required individual licences for exports of fluorinated polyimide, resist and hydrogen fluoride to Korea, and from 28 August it dropped Korea from its \"white countries\". The three items returned to bulk licensing on 23 March 2023."
      ko: "일본은 2019년 7월 4일부터 한국으로 수출되는 불화폴리이미드, 레지스트, 불화수소에 개별 허가를 요구했습니다. 8월 28일부터는 한국을 '화이트 국가'에서 제외했습니다. 세 품목은 2023년 3월 23일 포괄허가 대상으로 돌아갔습니다."
    timeline:
      - {date: 2019-07-01, en: "METI announces individual licences for three items and moves to drop Korea from its white countries", ko: "일본 경제산업성, 3개 품목 개별허가와 화이트국가 제외 절차 발표", source: 1}
      - {date: 2019-07-04, en: "Individual licences required for fluorinated polyimide, resist and hydrogen fluoride", ko: "불화폴리이미드·레지스트·불화수소 개별허가 시행", source: 1}
      - {date: 2019-08-02, en: "Cabinet approves removing Korea from the white countries", ko: "일본 각의, 한국 화이트국가 제외 의결", source: 2}
      - {date: 2019-08-28, en: "Korea's removal from the white countries takes effect", ko: "한국 화이트국가 제외 시행", source: 2}
      - {date: 2019-09-11, en: "Korea requests WTO consultations (DS590)", ko: "한국, WTO에 협의 요청(DS590)", source: 3}
      - {date: 2023-03-16, en: "After a policy dialogue, METI decides to revise the controls on the three items", ko: "정책대화 뒤 경제산업성, 3개 품목 규제 운용 변경 결정", source: 4}
      - {date: 2023-03-23, en: "The three items return to bulk export licences", ko: "3개 품목 포괄수출허가 복귀", source: 5}
      - {date: 2023-03-23, en: "Korea withdraws its WTO complaint", ko: "한국, WTO 제소 철회", source: 3}
    products: ["HS:37", "HS:28", "HS:39", "C:semiconductors:ics"]
    economies: [JPN, KOR]
    view: {f: A, p: "HS:37", base: 2018, t: 2020, lens: null}
    watch:
      en: "Korea's imports of hydrogen fluoride (2811.11), photoresist (3707.90) and polyimide film by supplier: Japan's share against the others'. The site has these only as whole chapters (28, 37, 39) and annually until the six-digit codes join the monthly watch list."
      ko: "한국의 불화수소(2811.11), 포토레지스트(3707.90), 폴리이미드 필름 수입을 공급국별로 살펴봅니다. 일본 비중이 다른 나라에 비해 어떻게 변했는지 확인합니다. 여섯 자리 코드가 월간 관찰 목록에 들어가기 전까지는 28·37·39류 연간 자료로만 볼 수 있습니다."
    reading:
      window:
        en: "2018 is the year before the licences; 2020 is their first full year and the COVID year (world trade in the chapter −11.3%); the licences ran to 23 March 2023. In the series on this page Japan's share of Korea's photographic and film goods imports was 67.9% (2018), 66.2% (2019), 68.2% (2020) and 65.7% (2021)."
        ko: "2018년은 일본의 수출 허가 규제 직전 해입니다. 2020년은 규제가 1년 내내 적용된 첫해이자 코로나19가 확산한 해입니다(이 품목군의 세계 교역 −11.3%). 규제는 2023년 3월 23일까지 이어졌습니다. 이 페이지 계열에서 한국의 사진·영화용 재료 수입 중 일본 비중은 67.9%(2018년), 66.2%(2019년), 68.2%(2020년), 65.7%(2021년)였습니다."
      items:
        - kind: scope
          number:
            en: "Japan → Korea: 67.9% → 68.2% of Korea's photographic and film goods imports, $648m → $704m (+8.6%) (2018 → 2020)."
            ko: "일본 → 한국: 한국의 사진·영화용 재료 수입 중 일본 비중은 67.9% → 68.2%, 금액은 $648m → $704m(+8.6%)입니다(2018년 → 2020년)."
          en: "Chapter 37 is all photographic chemicals and film; photoresist is one heading, 3707. The licence requirement reached only the high-specification part of \"resist\", such as EUV photoresist, and from 20 December 2019 METI moved EUV photoresist for Korea to specific bulk licences. KITA: Korea's photoresist imports from Japan were $150.81m in January–May 2020, up 33.8% on a year earlier."
          ko: "37류는 사진용 화학제품과 필름 전체이고, 포토레지스트는 그중 한 호(3707)입니다. 허가 대상은 '레지스트' 가운데 EUV용 같은 고사양 일부에 그쳤습니다. 경제산업성은 2019년 12월 20일 한국행 EUV용 포토레지스트를 특정포괄허가로 돌렸습니다. 무역협회 집계로 2020년 1~5월 일본산 포토레지스트 수입은 1억 5,081만 달러였습니다. 전년동기대비 33.8% 증가했습니다."
          sources: [1, 6, 7, 8, 13]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "Belgium → Korea: 1.2% → 3.8% of Korea's photographic and film goods imports (2018 → 2020); 6.8% in 2021."
            ko: "벨기에 → 한국: 한국 사진용·영화용 재료 수입에서 벨기에가 차지하는 비중은 1.2% → 3.8%(2018년 → 2020년), 2021년에는 6.8%입니다."
          en: "JSR has a plant in Belgium whose photoresists were not under the Japanese licence requirement. KITA's count shows Korea's photoresist imports diversifying to Belgium (RMQC), the United States (DuPont) and Germany (Merck), with Japan's share down from 92% in January–June 2019 to 85% in July–November; the government said imports of EUV photoresist from Belgium grew twelve-fold in two years."
          ko: "JSR은 벨기에에 공장을 두고 있고, 이 공장에서 만든 포토레지스트는 일본의 허가 요건에 해당하지 않았습니다. 무역협회 집계로 한국의 포토레지스트 수입선은 벨기에(RMQC)·미국(듀폰)·독일(머크)로 다변화됐습니다. 일본 비중은 2019년 1~6월 92%에서 7~11월 85%로 하락했습니다. 정부는 벨기에산 EUV 포토레지스트 수입이 2년 사이 12배로 늘었다고 밝혔습니다."
          sources: [10, 11, 15]
          checked: 2026-10-25
        - kind: definition
          number:
            en: "Korea's inorganic chemicals imports (HS 28): Japan's share 13.0% → 9.2% (−3.8 pp, 2018 → 2020); Korea's imports −8.0% in 2020."
            ko: "한국의 무기화학품 수입(HS 28)에서 일본 비중은 13.0% → 9.2%로 낮아졌습니다(−3.8%p, 2018년 → 2020년). 2020년 한국의 수입은 −8.0%입니다."
          en: "Chapter 28 runs from rare gases to precious-metal compounds and radioactive isotopes; hydrogen fluoride is one line, 2811.11. KITA and the semiconductor-display society: Korea's hydrogen fluoride imports from Japan were $4.03m in January–May 2020, −85.8% on a year earlier, Japan's share 43.9% → 12.3%, after Soulbrain and others began mass-producing liquid hydrogen fluoride matching the Japanese product in early 2020."
          ko: "28류는 희가스부터 귀금속 화합물, 방사성 동위원소까지 아우릅니다. 불화수소는 그중 여섯 자리 품목 하나(2811.11)입니다. 무역협회와 반도체디스플레이기술학회 집계로 2020년 1~5월 일본산 불화수소 수입은 403만 달러였습니다. 전년동기대비 85.8% 감소했습니다. 일본 비중은 43.9%에서 12.3%로 하락했습니다. 2020년 초 솔브레인 등이 일본산과 대등한 액체 불화수소 양산에 성공한 뒤의 일입니다."
          sources: [9, 14]
          checked: 2026-10-25
        - kind: cycle
          number:
            en: "World trade in photographic and film goods −11.3% in 2020 ($13.7bn); Japan's exports −6.5%, Korea's imports +8.4%."
            ko: "2020년 세계 사진용·영화용 재료 교역 −11.3%(137억 달러), 일본의 수출 −6.5%, 한국의 수입 +8.4%."
          en: "2020 is the COVID year: Japan's photographic-goods exports fell to France (−39.2%), the UK (−40.7%) and the United States (−10.5%), while Korea's chip industry kept growing. MOTIE's annual figures: Korea's semiconductor exports were $99.18bn in 2020, +5.6% and the second-highest on record, while total exports fell 5.4%."
          ko: "2020년은 코로나19의 해입니다. 일본의 사진용·영화용 재료 수출은 프랑스(−39.2%), 영국(−40.7%), 미국(−10.5%)행이 줄었습니다. 한국의 반도체 산업은 계속 성장했습니다. 산업통상자원부 연간 집계로 2020년 한국의 반도체 수출은 991억 8,000만 달러로 5.6% 증가했습니다. 역대 2위 규모였고, 전체 수출은 5.4% 감소했습니다."
          sources: [12]
          checked: 2026-10-25
    sources:
      - {n: 1, title: "Update of METI's licensing policies and procedures on exports of controlled items to the Republic of Korea", publisher: "Ministry of Economy, Trade and Industry, Japan (archived copy)", date: 2019-07-01, url: "http://web.archive.org/web/20190718094739/https://www.meti.go.jp/english/press/2019/0701_001.html"}
      - {n: 2, title: "The Cabinet approved partial amendment to the Export Trade Control Order", publisher: "Ministry of Economy, Trade and Industry, Japan (archived copy)", date: 2019-08-02, url: "http://web.archive.org/web/20190802033048/https://www.meti.go.jp/english/press/2019/0802_001.html"}
      - {n: 3, title: "DS590: Japan — Measures related to the exportation of products and technology to Korea", publisher: "World Trade Organization", date: null, accessed: 2026-10-24, url: "https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds590_e.htm"}
      - {n: 4, title: "Japan-Korea Export Control Policy Dialogue held", publisher: "Ministry of Economy, Trade and Industry, Japan (archived copy)", date: 2023-03-16, url: "http://web.archive.org/web/20230320040254/https://www.meti.go.jp/english/press/2023/0316_001.html"}
      - {n: 5, title: "Circular notice on partial amendment to the circular notice on the operation of the Cabinet Order on Export Trade Control (review of export control to South Korea)", publisher: "Ministry of Economy, Trade and Industry, Japan (archived copy)", date: 2023-03-23, url: "http://web.archive.org/web/20230927105335/https://www.meti.go.jp/english/press/2023/0323_001.html"}
      - {n: 6, title: "韓国向け輸出管理の運用の見直しに関連する日本の制度運用についての基礎的解説", publisher: "安全保障貿易情報センター (CISTEC)", date: 2019-08-02, url: "https://www.cistec.or.jp/service/kankoku/190802kankokumuke_kaisetu.pdf"}
      - {n: 7, title: "日, 수출규제 5개월 만에 '찔끔' 완화…\"불확실성 우려 여전\"", publisher: "서울신문", date: 2019-12-20, url: "https://www.seoul.co.kr/news/2019/12/20/20191220500200"}
      - {n: 8, title: "[日 수출 규제 1년]소·부·장 경쟁력 향상됐지만…'100% 탈일본'은 아직 요원", publisher: "뉴시스 (한국무역협회 집계)", date: 2020-07-01, url: "https://www.newsis.com/view/NISX20200630_0001078853"}
      - {n: 9, title: "[日 수출규제 1년-중] 반·디 절반의 성공...국산화 일부 성과에도 갈길 멀어", publisher: "데일리안 (한국무역협회·한국반도체디스플레이기술학회 집계)", date: 2020-07-22, url: "https://www.dailian.co.kr/news/view/906715/"}
      - {n: 10, title: "동진쎄미켐, 日규제에도 '국산화' 포토레지스트 공장 증설", publisher: "아시아경제 (한국무역협회 집계)", date: 2020-01-15, url: "https://view.asiae.co.kr/article/2020011514080854433"}
