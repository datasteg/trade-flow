    # Mar-May 2026 against Mar-May 2025: the first three full months after the strait closed;
    # importer-reported (Japan, India, the US, EU members and others; no China filings; Korea from its customs service)
    view: {f: M, p: "B:crude_oil", base: 202505, t: 202605, lens: M}
    watch:
      en: "Crude and LNG imports by supplier for the economies that have filed: the Gulf's share of Japan's and India's crude and LNG falling after March 2026, and who replaced it; the Gulf's exports of urea, ammonia and aluminium. China (after Dec 2024) is missing from the store; Korea's months from Jan 2026 come from its customs service."
      ko: "신고를 마친 경제의 공급국별 원유·LNG 수입을 살펴봅니다. 핵심은 2026년 3월 이후 일본·인도의 원유·LNG 수입에서 걸프 비중이 하락하는지입니다. 어느 공급국이 그 감소분을 대체했는지, 걸프의 요소·암모니아·알루미늄 수출이 어떻게 변했는지도 살펴봅니다. 중국(2024년 12월 이후)은 아직 자료에 없고, 한국의 2026년 1월 이후 자료는 관세청 통계입니다."
    reading:
      window:
        en: "Mar–May 2026 is the first three full months of the closure; Mar–May 2025 a quarter of falling prices. At May 2026, 71 economies had filed (62% of 2024 world exports): Japan, India and the US had, Korea through its customs service, Saudi Arabia to April, Kuwait to December 2024; Iran, the UAE, Qatar and Iraq never do."
        ko: "2026년 3~5월은 해협 봉쇄 뒤 첫 석 달이고, 2025년 3~5월은 유가가 하락하던 분기입니다. 2026년 5월까지 자료가 있는 경제는 71개국(2024년 세계 수출의 62%)입니다. 일본·인도·미국은 신고했고, 한국은 관세청 통계로 포함합니다. 사우디아라비아는 4월까지, 쿠웨이트는 2024년 12월까지만 신고했습니다. 이란·아랍에미리트·카타르·이라크는 신고하지 않습니다."
      items:
        - kind: price
          number:
            en: "World crude oil trade −9.4% on a year earlier at May 2026 ($272.2bn → $246.6bn), after −18.0% at May 2025; Japan · imports −18.2% ($16.2bn → $13.2bn), India · imports −0.2% ($41.3bn → $41.2bn)."
            ko: "2026년 5월 세계 원유 교역은 전년동월대비 −9.4%($272.2bn → $246.6bn)로, 2025년 5월(−18.0%)에 이어 감소했습니다. 일본 · 수입 −18.2%($16.2bn → $13.2bn), 인도 · 수입 −0.2%($41.3bn → $41.2bn)입니다."
          en: "Brent averaged $102 a barrel in March–May 2026 against $68 a year earlier, and the values here are in dollars. In barrels, the IEA has Japan's crude imports down 1.9 mb/d and India's 760 kb/d between February and April 2026, with Gulf output 14.4 mb/d below pre-war levels; METI's April figure for Japan is 66% below a year earlier."
          ko: "브렌트유는 2026년 3~5월 배럴당 평균 102달러로 전년동기(68달러)보다 높았습니다. 여기 금액은 달러 기준입니다. IEA 집계로 물량 기준 일본의 원유 수입은 2026년 2월에서 4월 사이 하루 190만 배럴, 인도는 76만 배럴 줄었습니다. 걸프 산유량은 전쟁 전보다 하루 1,440만 배럴 적었습니다. 경제산업성 자료로 일본의 4월 수입은 전년동월대비 66% 적었습니다."
          sources: [13, 15, 19]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "Japan's crude imports by supplier: Saudi Arabia 38.1% → 42.9%, UAE 47.3% → 45.2%, United States 3.7% → 9.5%, Kuwait 5.5% → 0.0%, Qatar 5.5% → 0.0% (May 2025 → May 2026)."
            ko: "일본의 원유 수입을 공급국별로 보면 사우디아라비아 38.1% → 42.9%, 아랍에미리트(UAE) 47.3% → 45.2%, 미국 3.7% → 9.5%, 쿠웨이트 5.5% → 0.0%, 카타르 5.5% → 0.0%입니다(2025년 5월 → 2026년 5월)."
          en: "Only Saudi Arabia and the UAE have pipelines around Hormuz, about 4.7 mb/d of bypass capacity; by late March the East-West line ran at 7 mb/d, with about 5 mb/d of crude loading at Yanbu. The IEA counted Iraq's and Kuwait's crude as locked in. US crude exports reached a record 5.6 mb/d in April, and Japan's intake of US crude a record 331 kb/d in May."
          ko: "호르무즈를 우회하는 송유관은 사우디아라비아와 아랍에미리트에만 있고, 우회 용량은 하루 약 470만 배럴입니다. 3월말 동서 송유관은 최대치인 하루 700만 배럴로 가동됐습니다. 얀부에서는 하루 약 500만 배럴의 원유가 선적됐습니다. IEA는 이라크와 쿠웨이트의 원유가 갇혀 있다고 평가했습니다. 미국의 원유 수출은 4월 하루 560만 배럴로 통계 집계 이후 최대였습니다. 일본의 미국산 원유 수입도 5월 하루 33만 1,000배럴로 집계 이후 최대였습니다."
          sources: [14, 16, 17, 18, 19]
          checked: 2026-10-25
        - kind: substitution
          number:
            en: "Iraq → India 18.9% → 2.4% of India's crude imports ($7.8bn → $999m); Russia → India 33.2% → 43.2% ($13.7bn → $17.8bn); Iran → India: none in either window, India's Iranian cargoes not arriving in every month."
            ko: "인도의 원유 수입에서 이라크산 비중은 18.9% → 2.4%($7.8bn → $999m), 러시아산 비중은 33.2% → 43.2%($13.7bn → $17.8bn)입니다. 이란산은 두 창 모두 없습니다. 인도로 가는 이란산 화물은 매달 들어오지 않기 때문입니다."
          en: "Iraq exported about 3.5 mb/d before the war, mostly through Hormuz; around 200 kb/d has gone out via Ceyhan. Russian crude reached a record 2.8 mb/d, 55.5% of India's imports, in July. The Iranian cargoes were India's first since May 2019, bought under OFAC General License U, which covered Iranian oil loaded by 20 March for delivery to 19 April."
          ko: "이라크는 전쟁 전 하루 약 350만 배럴을 수출했고, 대부분 호르무즈를 지났습니다. 그 뒤로는 제이한을 거쳐 하루 20만 배럴 안팎이 수출됐습니다. 러시아산 원유는 7월 하루 280만 배럴로 인도 수입의 55.5%를 차지해 최대였습니다. 이란산 화물은 2019년 5월 이후 인도의 첫 수입입니다. 인도는 미국 재무부 해외자산통제국의 일반허가 U에 따라 이를 수입했습니다. 이 허가는 3월 20일까지 선적된 이란산 원유를 4월 19일까지 넘겨받는 거래를 허용했습니다."
          sources: [20, 21, 22, 23]
          checked: 2026-10-25
        - kind: reporting
          number:
            en: "Saudi Arabia → Asia, not elsewhere specified 54.6% of Saudi crude exports in Mar–May 2025, absent in Mar–May 2026 (Saudi Arabia's May 2026 filing is missing and no importer reports the flow); Saudi Arabia · exports, no bar (its own report at the base, its partners' at t); Korea 10.1% → 22.5%."
            ko: "사우디아라비아 → 기타 아시아(미분류)는 2025년 3~5월 사우디 원유 수출의 54.6%였으나 2026년 3~5월에는 없습니다(사우디아라비아의 2026년 5월 신고가 없고 이 흐름을 보고한 수입국도 없기 때문입니다). 사우디아라비아 · 수출은 막대가 없습니다(기준 시점은 자국 보고, t 시점은 상대국 보고). 한국 10.1% → 22.5%입니다."
          en: "Saudi Arabia's monthly filings record crude exports by region, not by country: \"Other Asia, nes\" (Comtrade partner code 490, $9.7–15.8bn a month since January 2025), which this site shows as Asia, not elsewhere specified, never as Taiwan, beside \"Other Europe, nes\" and \"North America and Central America, nes\". Its May 2026 filing is missing and no importer reports Saudi crude booked to that area, so under the monthly rule the flow is not in the window to May 2026; the rest is read from the importers' reports, Korea's from its customs service."
          ko: "사우디아라비아는 월별 신고에서 원유 수출을 나라별이 아니라 지역별로 집계합니다. \"Other Asia, nes\"(Comtrade 상대국 코드 490, 2025년 1월 이후 월 $9.7–15.8bn)가 그 예입니다. 이 사이트는 이 항목을 대만이 아닌 기타 아시아(미분류)로 표시합니다. 같은 방식의 항목으로 \"Other Europe, nes\"와 \"North America and Central America, nes\"도 있습니다. 사우디아라비아의 2026년 5월 신고가 없고, 이 지역으로 계상된 사우디산 원유를 보고한 수입국도 없습니다. 따라서 월별 규칙에 따라 이 흐름은 2026년 5월까지의 창에 포함되지 않습니다. 나머지는 수입국의 보고로 읽으며, 한국은 관세청 자료를 씁니다."
          sources: [24]
          checked: 2026-10-25
