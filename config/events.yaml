      - {n: 7, title: "Taiwan (Country Analysis Brief)", publisher: "US Energy Information Administration", date: 2026-04-02, url: "https://www.eia.gov/international/content/analysis/countries_short/Taiwan/"}
      - {n: 8, title: "China's surplus crude oil surges in June, giving refiners options (Clyde Russell)", publisher: "Reuters, via Hydrocarbon Processing", date: 2025-07-16, url: "https://hydrocarbonprocessing.com/news/2025/07/chinas-surplus-crude-oil-surges-in-june-giving-refiners-options/"}
      - {n: 9, title: "Are surging Chinese imports of Indonesia oil rebranded Iranian crude?", publisher: "Reuters, via Baird Maritime", date: 2025-11-24, url: "https://www.bairdmaritime.com/shipping/tankers/are-surging-chinese-imports-of-indonesia-oil-rebranded-iranian-crude"}
      - {n: 10, title: "Energean begins exports from Israel of gas-byproduct condensate", publisher: "Reuters, via Kitco News", date: 2023-02-14, url: "https://www.kitco.com/news/off-the-wire/2023-02-14/energean-begins-exports-israel-gas-byproduct-condensate"}
