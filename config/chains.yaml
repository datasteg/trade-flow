  copper:
    label: Copper and electrification
    label_ko: 구리와 전력망
    levels:
      - {en: Concentrate, ko: 정광, who: {en: Miners, ko: 채굴국}}
      - {en: Blister, anodes and scrap, ko: 조동·양극동·스크랩, who: {en: Smelters, ko: 제련국}}
      - {en: Refined cathode, ko: 전기동, who: {en: Refiners, ko: 정련국}}
      - {en: Wire, strip and foil, ko: 선재·판재·동박, who: {en: Mills, ko: 가공국}}
      - {en: Cable and transformers, ko: 케이블·변압기, who: {en: Equipment makers, ko: 기기 생산국}}
    stages:
      - key: cu_conc
        stage: 1
        label: Copper concentrate
        codes: ["260300"]
        feeds: [cu_blister]
        caveat: Concentrate is roughly a quarter copper by weight.
      - key: cu_blister
        stage: 2
        label: Mattes, blister and anodes
        codes: ["740100", "740200"]
        feeds: [cu_cathode]
      - key: cu_cathode
        stage: 3
        label: Refined copper cathode
        codes: ["740311"]
        feeds: [cu_semis]
      - key: cu_scrap
        stage: 2
        label: Copper scrap
        codes: ["740400"]
        feeds: [cu_cathode, cu_semis]
      - key: cu_semis
        stage: 4
        label: Wire, strip and foil
        codes: ["7408", "7409", "7410"]
        feeds: [cable, transformers]
        use_share:
          copper:
            share: null
            what: {en: "of wire, strip and foil that goes to cable and transformers: no free source; foil (7410), which goes to circuit boards and battery anodes instead, is 5% of copper's first use against 63% for wire", ko: "선재·판재·동박 중 전선·변압기로 가는 비중은 무료 출처가 없습니다(회로기판·배터리 음극으로 가는 동박은 구리 1차 사용의 5%, 선재는 63%)."}
            source: "ICSG, The World Copper Factbook 2026 (IWCC data), p. 46"
            year: 2025
            url: "https://icsg.org/copper-factbook/"
            quote: null
            published: 2026-10-15
        caveat: Copper foil (7410) also feeds circuit boards and battery anodes.
      - key: cable
        stage: 5
        label: Insulated wire and cable
        codes: ["8544"]
        caveat: Includes car wiring harnesses (8544.42) and optical fibre cables (8544.70).
      - key: transformers
        stage: 5
        label: Power transformers
        codes: ["850421", "850422", "850423", "850433", "850434"]

  magnets:
    label: Rare earths, magnets and motors
    label_ko: 희토류, 영구자석, 모터
    levels:
      - {en: Ore, ko: 광석, who: {en: Miners, ko: 채굴국}}
      - {en: Compounds, ko: 화합물, who: {en: Separators, ko: 분리·정제국}}
