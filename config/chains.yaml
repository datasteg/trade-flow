        codes: ["850231"]

  plastics:
    label: Oil and gas to plastics
    label_ko: 석유·가스에서 플라스틱까지
    levels:
      - {en: Crude oil, gas and LPG, ko: 원유·가스·LPG, who: {en: Oil and gas producers, ko: 산유·산가스국}}
      - {en: Naphtha, ko: 나프타, who: {en: Refiners, ko: 정제국}}
      - {en: Olefins and aromatics, ko: 올레핀·방향족, who: {en: Crackers, ko: 기초유분 생산국}}
      - {en: Intermediates, ko: 중간 원료, who: {en: Chemical makers, ko: 화학 중간재 생산국}}
      - {en: Polymers and rubber, ko: 합성수지·합성고무, who: {en: Polymer makers, ko: 수지 생산국}}
      - {en: Plastic goods and tyres, ko: 플라스틱 제품·타이어, who: {en: Converters, ko: 가공국}}
    stages:
      - key: crude
        stage: 1
        label: Crude oil
        codes: ["270900"]
        feeds: [naphtha]
        role: feedstock
        use_share:
          plastics:
            share: 0.12
            what: {en: "of world oil demand is petrochemical feedstock", ko: "세계 석유 수요 중 석유화학 원료로 쓰이는 비중"}
            source: "IEA, The Future of Petrochemicals (2018), p. 78"
            year: 2017
            url: "https://iea.blob.core.windows.net/assets/bee4ef3a-8876-4566-98cf-7a130c013805/The_Future_of_Petrochemicals.pdf"
            quote: "With around 12 mb/d, global oil demand for chemical feedstock accounted for about 12% of total oil demand in 2017."
            published: 2018-10-04
      - key: gas_lpg
        stage: 1
        label: Natural gas and LPG
        codes: ["271111", "271121", "271112", "271113"]
        feeds: [olefins]
        shared: [fertiliser]
        role: feedstock
        use_share:
          plastics:
            share: 0.08
            what: {en: "of natural gas demand goes to the chemical sector (feedstock and process energy, ammonia and methanol included); no free source gives LPG's petrochemical share", ko: "천연가스 수요 중 화학 부문(원료·공정 에너지, 암모니아·메탄올 포함)이 쓰는 비중"}
            source: "IEA, The Future of Petrochemicals (2018), p. 27"
            year: 2017
            url: "https://iea.blob.core.windows.net/assets/bee4ef3a-8876-4566-98cf-7a130c013805/The_Future_of_Petrochemicals.pdf"
            quote: "The chemical sector, accounting for 8% of total demand for natural gas, uses twice as much as the entire transport sector."
            published: 2018-10-04
      - key: naphtha
        stage: 2
        label: Light oils (naphtha, with gasoline)
        codes: ["271012"]
        feeds: [olefins]
        use_share:
          plastics:
            share: null
            what: {en: "of 2710.12 trade that is naphtha for petrochemicals: unknown, because motor gasoline shares the code; national 8- and 10-digit lines split them", ko: "HS 2710.12 교역 중 석유화학용 나프타 비중은 알 수 없습니다. 휘발유와 같은 코드를 쓰기 때문입니다. 국가별 8·10단위 코드로는 구분할 수 있습니다."}
            source: "none free; national tariff lines (Korea customs, Comtrade Tariffline) to be measured"
            year: null
