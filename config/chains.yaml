    stages:
      - key: ree_ore
        stage: 1
        label: Rare-earth ore (no own code)
        codes: ["253090", "261220"]
        feeds: [ree_compounds]
        caveat: Bastnaesite sits in the residual 2530.90 with lithium ore; monazite partly in
          thorium ores (2612.20). Trade in ore is mostly Myanmar, Laos and the US into China.
      - key: ree_compounds
        stage: 2
        label: Rare-earth compounds (oxides, carbonates)
        codes: ["2846"]
        feeds: [ree_metals]
