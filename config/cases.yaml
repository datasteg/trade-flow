  - id: hormuz
    num: 5
    events: ["11", "12"]
    title: {en: "Closing Hormuz cut Asia's crude from the Gulf", ko: "호르무즈 봉쇄로 아시아의 걸프산 원유가 줄었다"}
    question:
      en: "Who depends on goods that pass the Strait, and what did the 2026 closure change?"
      ko: "누가 호르무즈 해협을 지나는 상품에 기대고 있으며, 2026년 봉쇄는 무엇을 바꿨는가?"
    carries_over: []
    papers:
      - ref: "jejualps:121864"
        authors: "Kharroubi"
        year: 2026
        series: "BIS Working Paper"
        number: "1378"
        title: "Maritime chokepoints and the global economy: evidence from the Strait of Hormuz"
        url: "https://www.bis.org/publications/working-paper-1378-maritime-chokepoints-and-the-global-economy-evidence-strait-hormuz"
        date: 2026-09-17
        finding:
          en: "Using IMF/Oxford PortWatch traffic data on what the paper calls “an unprecedented shock to the global economy”, supply-driven falls in Hormuz traffic push up fertiliser prices through inputs such as natural gas, while demand-driven ones have mixed effects."
          ko: "저자는 호르무즈 사태를 “세계 경제에 대한 전례 없는 충격”이라 불렀습니다. IMF·옥스퍼드대 포트워치(PortWatch) 해상 통행 자료로 그 파급효과를 분석했습니다. 공급 요인으로 통행이 줄면 천연가스 등 투입재를 거쳐 비료 가격이 오릅니다. 수요 요인에 따른 통행 변동의 효과는 엇갈립니다."
        quote: "an unprecedented shock to the global economy"
        verified: true
      - ref: "jejualps:122254"
        authors: "Alshehri, Banerjee, Chui, Maddux, Munakata & Zampolli"
        year: 2026
        series: "BIS Bulletin"
        number: "138"
        title: "Chokepoint disruptions and their macroeconomic consequences"
        url: "https://www.bis.org/publications/bulletin-138-chokepoint-disruptions-and-their-macroeconomic-consequences"
        date: 2026-10-15
        finding:
          en: "A chokepoint is a node “for which substitutes are limited or cannot be activated quickly”; “fertiliser production in the Middle East” is among the nodes that “have become more central over time”."
          ko: "저자들은 병목을 “대체재가 제한되거나 빨리 동원할 수 없는” 노드로 정의했습니다. “중동의 비료 생산”은 “시간이 지나며 더 중심적이 된” 노드 가운데 하나입니다."
        quote:
          - "for which substitutes are limited or cannot be activated quickly"
          - "fertiliser production in the Middle East"
          - "have become more central over time"
        verified: true
      - ref: "jejualps:47500"
        authors: "Kilian, Plante & Richter"
        year: 2026
        series: "Federal Reserve Bank of Dallas Working Paper"
        number: "2615"
        title: "How Times Have Changed: The Impact of the 2026 Iran War on the U.S. Economy"
        url: "https://www.dallasfed.org/research/papers/2026/wp2615"
        date: 2026-06-23
        finding:
          en: "In a two-country model, the response of US real GDP growth to the 2026 oil disruption is “only one-twentieth of what it would have been in 1980” and “only one-sixth of the decline in the rest of the world”."
          ko: "저자들은 2개국 모형으로 2026년 석유 공급 차질에 대한 미국 실질 GDP 성장률의 반응을 추정했습니다. 저자들은 이 반응이 “1980년이었다면 나타났을 반응의 20분의 1에 불과”하다고 썼습니다. 또 “나머지 세계 감소폭의 6분의 1에 불과하다”고 썼습니다."
        quote:
          - "only one-twentieth of what it would have been in 1980"
          - "only one-sixth of the decline in the rest of the world"
        verified: true
      - ref: "jejualps:78106"
        authors: "Fernández-Villaverde, Li, Xu & Zanetti"
        year: 2025
        series: "NBER Working Paper"
        number: "w33486"
        title: "Charting the Uncharted: The (Un)Intended Consequences of Oil Sanctions and Dark Shipping"
        url: "https://www.nber.org/papers/w33486"
        date: 2025-02-01
        finding:
          en: "Machine-learning ship tracking follows dark-shipped crude under sanctions on Iran and others: “These sanctioned flows offset recorded declines in global oil exports”, and customs records do not show them for what they are."
          ko: "저자들은 기계학습 선박 군집 모형으로 이란 등 제재 대상국의 ‘다크 십핑’ 원유 흐름을 추적했습니다. 저자들은 “이 제재 대상 흐름이 기록된 세계 석유 수출 감소를 상쇄했다”고 썼습니다. 통관자료에는 이 흐름이 실제 성격대로 기록되지 않습니다."
        quote: "These sanctioned flows offset recorded declines in global oil exports"
        verified: true
    network:
      freq: M
      products: ["B:crude_oil", "B:natural_gas", "C:fertiliser:nitrogen", "C:fertiliser:ammonia", "C:aluminium:al_unwrought"]
      from: 201901
      to: 202608
      base: "Sep 2025 to Feb 2026, the six months before the war began on 28 Feb 2026"
      note: "The Gulf is the eight economies of regions.gulf, by origin, not route. 2026 months use only the economies that have filed (Japan, India, the US, EU members, Australia, Brazil and others into mid-2026); China is missing in the current store; Korea's months from Jan 2026 come from its customs service. Extend `to` as reporters file."
      measures:
        - kind: partner_shares
          product: "B:crude_oil"
          importer: JPN
          partners: *gulf
          sum_partners: true
          lens: S
          from: 202509
          to: 202608
          en: "The Gulf's share of Japan's crude imports by month"
          ko: "일본 원유 수입의 걸프 비중(월별)"
        - kind: partner_shares
          product: "B:crude_oil"
          importer: IND
          partners: *gulf
          sum_partners: true
          lens: S
          from: 202509
          to: 202608
          en: "The Gulf's share of India's crude imports by month"
          ko: "인도 원유 수입의 걸프 비중(월별)"
        - kind: partner_shares
          product: "B:natural_gas"
          codes: ["271111"]
          importer: JPN
          partners: *gulf
          sum_partners: true
          lens: S
          from: 202509
          to: 202608
          en: "The Gulf's share of Japan's LNG imports by month"
          ko: "일본 LNG 수입의 걸프 비중(월별)"
        - kind: korea_exposure
          product: "B:crude_oil"
          supplier: *gulf
          periods: [2025]
          en: "The Gulf's share of Korea's crude imports, 2025"
          ko: "한국 원유 수입의 걸프 비중, 2025년"
        - kind: korea_exposure
          product: "B:natural_gas"
          codes: ["271111"]
          supplier: *gulf
          periods: [2025]
          en: "The Gulf's share of Korea's LNG imports, 2025"
          ko: "한국 LNG 수입의 걸프 비중, 2025년"
        - kind: top_exporters
          each: {product: ["C:fertiliser:nitrogen", "C:fertiliser:ammonia", "C:aluminium:al_unwrought"]}
          periods: [2025]
          group: *gulf
          en: "The Gulf's share of world exports of urea and ammonium nitrate, ammonia and unwrought aluminium, 2025"
          ko: "세계 요소·질산암모늄, 암모니아, 알루미늄 괴 수출에서 걸프가 차지한 비중, 2025년"
      plan_numbers:
        en: "The Gulf's share of Japan's crude imports 91–95% (Sep 2025–Mar 2026) → 60–63% (Jun–Aug 2026); India's 38–58% (Sep 2025–Feb 2026) → 26% (Jul 2026); Japan's LNG from the Gulf 9–14% → 3–6%"
        ko: "일본 원유 수입의 걸프 비중 91~95%(2025년 9월~2026년 3월) → 60~63%(2026년 6~8월). 인도 38~58%(2025년 9월~2026년 2월) → 26%(2026년 7월). 일본 LNG의 걸프 비중 9~14% → 3~6%"
    scenario:
      kind: close_route
      route: "Strait of Hormuz"
      product: "C:plastics:crude"
      other_products: ["B:natural_gas", "C:fertiliser:nitrogen", "C:fertiliser:ammonia", "C:aluminium:al_unwrought"]
      supplier: *gulf
      bypass: [SAU, ARE]
      cut: 1.0
      period: 2025
      down_stage: "C:plastics:naphtha"
      note: "The bypass switch exempts Saudi Arabia's and the UAE's flows as if their pipelines to the Red Sea (Yanbu) and Fujairah carried everything; pipeline capacity is not in trade data, so the switch gives a lower bound on the share at risk."
      en: "Close the Strait for Gulf exporters (a switch keeps Saudi Arabia's pipeline to the Red Sea and the UAE's to Fujairah open) and rank importers by the share of their crude, LNG, urea, ammonia or aluminium imports at risk"
      ko: "걸프 수출국에 대해 해협을 봉쇄합니다. 스위치로 사우디아라비아의 홍해행 송유관과 아랍에미리트의 푸자이라행 송유관은 열어 둘 수 있습니다. 원유·LNG·요소·암모니아·알루미늄 수입 가운데 위험에 놓인 비중으로 수입국 순위를 매깁니다."
    korea:
      en: "In the Korea Customs Service's figures the Gulf supplied 69.3% of Korea's crude imports in 2025 ($52.2bn of $75.3bn) and 20.3% of its LNG ($5.3bn of $26.0bn). In Mar–May 2026, the first three months of the closure, its share fell to 55.5% of crude ($12.1bn of $21.8bn), from 66.1% a year earlier, and to 3.3% of LNG, from 21.2%. The network adds these customs months where Comtrade has no Korean file."
      ko: "관세청 통계에 따르면 2025년 걸프는 한국 원유 수입의 69.3%(753억 달러 가운데 522억 달러)를 공급했습니다. LNG 수입에서는 20.3%(260억 달러 가운데 53억 달러)였습니다. 2026년 3~5월은 해협 봉쇄 뒤 첫 석 달입니다. 이 기간 원유 수입의 걸프 비중은 55.5%(218억 달러 가운데 121억 달러)로 전년동기(66.1%)보다 하락했습니다. LNG 수입의 걸프 비중은 21.2%에서 3.3%로 하락했습니다. 네트워크는 Comtrade에 한국 자료가 없는 달에 이 관세청 자료를 더합니다."
    limits:
      en: "Customs data record origin, not route: the Gulf list counts Oman, whose main crude terminal lies outside the Strait, and the UAE's exports from Fujairah alongside cargoes that cross it, and dark-shipped crude (Fernández-Villaverde et al.) is missed or recorded under other origins. Kharroubi measures traffic itself and its effect on prices, output and financial conditions, and Kilian, Plante and Richter model GDP; a trade network sees none of that, and its 2026 months cover only the economies that have filed."
      ko: "통관자료는 경로가 아니라 원산지를 기록합니다. 걸프 목록에는 주요 원유 터미널이 해협 밖에 있는 오만이 포함됩니다. 아랍에미리트의 푸자이라 수출도 해협을 지나는 화물과 함께 들어 있습니다. 다크 십핑 원유(페르난데스비야베르데 등)는 누락되거나 다른 원산지로 기록됩니다. 카루비는 통행량 자체와 그것이 가격, 산출, 금융여건에 미치는 영향을 측정합니다. 킬리언·플랜티·리히터는 GDP를 모형으로 분석합니다. 무역 네트워크에는 그 어느 것도 담기지 않습니다. 2026년 월별 자료는 신고를 마친 경제만 포함합니다."

