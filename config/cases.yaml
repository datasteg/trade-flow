      ko: "중국의 희토류 화합물·금속·영구자석 수출을 0~100% 줄입니다(기본값은 보그만스 등의 충격인 80%). 그 부족분을 모터와 풍력 터빈 제조국으로 넘깁니다"
    korea:
      en: "Korea takes 6.2% of world magnet imports, 87% of them from China (2024; plan numbers, to be re-measured). The scenario turns that into the share of Korea's magnet supply at risk and the motor and turbine output one stage down that depends on it."
      ko: "한국은 세계 영구자석 수입의 6.2%를 차지하고, 그 87%를 중국에서 수입합니다(2024년, 계획서 수치, 재산출 예정). 시나리오는 이를 한국의 영구자석 공급 가운데 위험에 놓인 비중으로 환산합니다. 이 공급에 의존하는 한 단계 아래 모터·풍력 터빈 생산도 산출합니다."
    limits:
      en: "Magnets are a small value in trade, so value shares understate what a shortfall stops; Bogmans et al. need an input-output table augmented with rare earths and substitution elasticities to reach GDP, and find the losses fade at longer horizons, which a first-round map cannot show. Rare-earth ore has no code of its own, most magnets travel inside motors and cars, and licences act on firms and grades that HS codes do not separate. The ECB paper adds inflation and the spread through global value chains."
      ko: "영구자석은 교역액이 작습니다. 따라서 금액 비중은 부족으로 멈추는 생산을 과소평가합니다. 보그만스 등은 GDP 효과를 추정하려고 희토류를 반영한 산업연관표와 대체탄력성을 썼습니다. 이들은 긴 시계에서는 손실이 사라진다는 것을 보였습니다. 1차 효과 지도에는 이것이 나타나지 않습니다. 희토류 광석에는 고유 코드가 없습니다. 영구자석은 대부분 모터와 자동차에 내장되어 교역됩니다. 수출 허가는 HS 코드로 구분되지 않는 기업과 등급에 적용됩니다. 유럽중앙은행 논문은 물가와 글로벌 가치사슬을 통한 파급까지 다룹니다."

