  - id: fragility-screen
    num: 9
    events: []            # all chains, no single event
    title: {en: "Concentrated stages are where supply breaks first", ko: "공급은 집중된 단계에서 먼저 끊긴다"}
    question:
      en: "Which traded goods, and which economies' import baskets, are most fragile to a supply shock?"
