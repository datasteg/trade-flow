  - id: chips
    num: 7
    events: ["5", "7"]
    title: {en: "A chip shortage costs several times its size", ko: "반도체 부족의 피해는 그 크기의 몇 배다"}
    question:
      en: "Why does a chip shortage hurt more than its size, and how did controls reshape the trade?"
      ko: "반도체 부족은 왜 그 크기보다 더 큰 피해를 주며, 수출통제는 교역을 어떻게 바꿨는가?"
    carries_over: ["semiconductors"]
    papers:
      - ref: "jejualps:235"
        authors: "Rungcharoenkitkul & Rees"
        year: 2021
        series: "BIS Bulletin"
        number: "48"
        title: "Bottlenecks: causes and macroeconomic implications"
        url: "https://www.bis.org/publ/bisbull48.htm"
        date: 2021-11-11
        finding:
          en: "The output loss from a constraint on energy or semiconductors is “on average 3.5 to 4.5 the size of the initial impact”; “a 10% contraction in world semiconductor production would reduce global GDP by about 0.2%”."
          ko: "에너지나 반도체 공급 제약에 따른 산출 감소는 “평균적으로 최초 충격의 3.5~4.5배”입니다. 저자들은 “세계 반도체 생산이 10% 줄면 세계 GDP가 약 0.2% 감소한다”고 썼습니다."
        quote:
          - "on average 3.5 to 4.5 the size of the initial impact"
          - "a 10% contraction in world semiconductor production would reduce global GDP by about 0.2%"
        verified: true
      - ref: "jejualps:49249"
        authors: "Miki & Tamanyu"
        year: 2024
        series: "Bank of Japan Working Paper"
        number: "24-E-6"
        title: "On the Restructuring of Global Semiconductor Supply Chains"
        url: "https://www.boj.or.jp/en/research/wps_rev/wps_2024/data/wp24e06.pdf"
        date: 2024-06-26
        finding:
          en: "With the 2018–19 US tariffs on China as a natural experiment, the restructuring of chip supply chains is “not led solely by the direct consequences of the tariff hikes” but also by shifts in comparative advantage between the countries in the chain."
          ko: "저자들은 2018~19년 미국의 대중 관세 인상을 자연실험으로 삼았습니다. 저자들은 반도체 공급망 재편이 “관세 인상의 직접적 결과만으로 이끌린 것이 아니”라고 썼습니다. 공급망 속 나라들 사이의 비교우위 변화도 재편을 이끌었습니다."
        quote: "not led solely by the direct consequences of the tariff hikes"
        verified: true
    network:
      freq: A
      products: ["C:semiconductors:ics", "C:semiconductors:chip_tools", "C:semiconductors:phones", "C:semiconductors:computers", "B:cars"]
      from: 2015
      to: 2025
      base: 2019
      measures:
        - kind: top_exporters
          product: "C:semiconductors:ics"
          periods: [2019, 2024]
          en: "Shares of world chip exports"
          ko: "세계 집적회로 수출에서 각국이 차지한 비중"
          note: "The plan's Korea 17% (second) names no year; 2024, the last complete year, is assumed."
        - kind: korea_exposure
          product: "C:semiconductors:chip_tools"
          supplier: NLD
          periods: [2024]
          en: "The Netherlands' share of Korea's imports of chip-making machines"
          ko: "한국 반도체 제조장비 수입의 네덜란드 비중"
          note: "Also Korea's share of world imports of chip-making machines (13.5% in the plan)."
        - kind: partner_shares
          product: "C:semiconductors:chip_tools"
          importer: CHN
          partners: [JPN, NLD, USA, KOR, SGP]
          from: 2015
          to: 2025
          en: "China's purchases of chip-making machines by supplier, before and after the October 2022 controls"
          ko: "중국의 공급국별 반도체 제조장비 수입, 2022년 10월 통제 전후"
        - kind: partner_shares
          product: "C:semiconductors:ics"
          importer: USA
          partners: [CHN, S19, MYS, VNM, KOR, MEX]
          from: 2015
          to: 2025
          en: "US chip imports by supplier, around the 2018–19 tariffs"
          ko: "미국의 공급국별 집적회로 수입, 2018~19년 관세 전후"
        - kind: world_change
          each: {product: ["B:cars", "C:semiconductors:ics"]}
          importers: all
          periods: [2021]
          against: 2019
          en: "World trade in cars and in chips, 2021 against 2019: cars falling while chips rose"
          ko: "세계 승용차 교역과 집적회로 교역, 2021년과 2019년 비교(승용차 감소, 집적회로 증가)"
      plan_numbers: null   # the plan's numbers for this case are Korea's, in the korea block
    scenario:
      kind: cut_output
      product: "C:semiconductors:ics"
      supplier: S19   # Asia, not elsewhere specified: most importers' records of Taiwan (Comtrade partner 490)
      cut: 0.1
      period: 2024
      down_stage: ["C:semiconductors:phones", "C:semiconductors:computers"]
      note: "chains.yaml feeds chips only to phones and computers; reaching cars (C:steel:cars) needs a cross-chain feed. An export cut stands in for the output cut."
      en: "Cut one supplier's chip output by 10% (by default Asia, not elsewhere specified, most importers' records of Taiwan; China, Malaysia and others to choose) and follow the shortfall into phones, computers and cars"
      ko: "한 공급국의 칩 생산을 10% 줄이고 그 부족분이 휴대전화·컴퓨터·자동차로 어떻게 번지는지 따라갑니다(기본값은 '아시아(달리 분류되지 않음)'입니다. 대부분 수입국이 대만과의 교역을 여기에 기록합니다. 중국·말레이시아 등도 고를 수 있습니다)"
    korea:
      en: "Korea is the second-largest chip exporter (17%) and buys 13.5% of the world's chip-making machines, a third of them from the Netherlands (plan numbers, to be re-measured). The scenario shows Korea both ways: as a buyer exposed to a cut elsewhere, and, with Korea selected, as the supplier whose cut others feel."
      ko: "한국은 세계 2위 집적회로 수출국(17%)입니다. 세계 반도체 제조장비 수입의 13.5%를 차지하며, 그 3분의 1을 네덜란드에서 수입합니다(계획서 수치, 재산출 예정). 시나리오는 한국을 두 방향에서 다룹니다. 하나는 다른 나라의 감산에 노출된 수입국으로서의 한국입니다. 다른 하나는 한국을 선택했을 때 그 감산이 다른 나라에 영향을 주는 공급국으로서의 한국입니다."
    limits:
      en: "The multiplier in the BIS bulletin comes from a global input-output table, not from trade: a network shows who buys chips, not how much output stops without them. Export cuts stand in for output cuts, a chip crosses borders several times under the same code, and controls act on specific tools and grades that HS 8486 and 8542 do not separate. Miki and Tamanyu go further with upstreamness and wage gaps; Funke and Wende (further reading) model export bans in general equilibrium."
      ko: "BIS 불레틴의 승수는 무역 자료가 아니라 세계 산업연관표에서 산출한 값입니다. 네트워크에는 누가 반도체를 수입하는지만 나타납니다. 반도체가 없을 때 산출이 얼마나 멈추는지는 알 수 없습니다. 수출 감소로 생산 감소를 대신합니다. 반도체 하나가 같은 코드로 여러 번 국경을 넘습니다. 수출통제는 HS 8486과 8542로 구분되지 않는 특정 장비와 등급에 적용됩니다. 미키와 다마뉴는 상류도와 임금 격차까지 분석했습니다. 풍케와 벤데(더 읽을거리)는 수출 금지를 일반균형 모형으로 다룹니다."

