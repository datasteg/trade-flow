gaps:
  en: "No paper in jejualps covers Japan's 2019 export controls on Korea, the Red Sea attacks of 2023–24 on their own, or Korea's place in chip supply chains; the archive holds no Bank of Korea or KIEP working papers. Those events get event pages without a case study, and the Korea sections rest on our own numbers. Adding Bank of Korea, KIEP and KDI papers to jejualps would close the gap."
  ko: "jejualps에는 2019년 일본의 대한국 수출규제, 2023~24년 홍해 공격 자체, 반도체 공급망 속 한국의 위치를 다룬 논문이 없습니다. 한국은행이나 대외경제정책연구원(KIEP)의 연구 보고서도 없습니다. 따라서 그 사건들은 사례 연구 없이 사건 페이지만 있습니다. 한국 부분은 이 사이트가 산출한 수치에 근거합니다. 한국은행, KIEP, 한국개발연구원(KDI)의 논문을 jejualps에 추가하면 이 공백을 메울 수 있습니다."
