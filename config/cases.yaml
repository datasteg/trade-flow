  - id: russian-gas
    num: 4
    events: ["6"]
    title: {en: "Europe could replace most of its Russian gas", ko: "유럽은 러시아 가스 대부분을 대체할 수 있었다"}
    question:
      en: "Could Europe replace Russian gas, and who paid for it elsewhere?"
      ko: "유럽은 러시아 가스를 대체할 수 있었는가, 그리고 그 대가는 다른 곳에서 누가 치렀는가?"
    carries_over: []
    papers:
      - ref: "jejualps:67736"
        authors: "Di Bella, Flanagan, Foda, Maslova, Pienkowski, Stuermer & Toscani"
        year: 2022
        series: "IMF Working Paper"
        number: "WP/22/145"
        title: "Natural Gas in Europe: The Potential Impact of Disruptions to Supply"
        url: "https://www.elibrary.imf.org/view/journals/001/2022/145/001.2022.issue-145-en.xml"
        date: 2022-07-19
        finding:
          en: "“Alternative sources could replace up to 70 percent of Russian gas”, enough to ride out a disruption of about six months; in a longer full shut-off, Hungary, the Slovak Republic and Czechia would in the short term “face a risk of shortages of as much as 40 percent of gas consumption”."
          ko: "저자들은 “대체 공급원이 러시아 가스의 최대 70%를 대신할 수 있다”고 썼습니다. 6개월 내외의 일시 중단이라면 부족 없이 넘길 수 있는 규모입니다. 그러나 전면 차단이 길어지면 헝가리·슬로바키아·체코는 단기적으로 “가스 소비량의 최대 40%에 이르는 부족 위험에 처한다”고 썼습니다."
        quote:
          - "Alternative sources could replace up to 70 percent of Russian gas"
          - "face a risk of shortages of as much as 40 percent of gas consumption"
        verified: true
      - ref: "jejualps:67738"
        authors: "Albrizio, Bluedorn, Koch, Pescatori & Stuermer"
        year: 2022
        series: "IMF Working Paper"
        number: "WP/22/143"
        title: "Market Size and Supply Disruptions: Sharing the Pain of a Potential Russian Gas Shut-off to the European Union"
        url: "https://www.elibrary.imf.org/view/journals/001/2022/143/001.2022.issue-143-en.xml"
        date: 2022-07-19
        finding:
          en: "Counting the global LNG market, the adverse impact of a Russian gas cut-off on the EU “shrinks five-fold”, but “other LNG importers (such as Japan, South Korea, and Pakistan) see adverse effects from higher prices”."
          ko: "세계 LNG 시장을 함께 고려하면 러시아 가스 차단이 유럽연합 경제에 주는 타격은 “5분의 1로 줄어든다”. 그러나 저자들은 “다른 LNG 수입국(일본, 한국, 파키스탄 등)은 가격 상승으로 불리한 영향을 받는다”고 썼다."
        quote:
          - "shrinks five-fold"
          - "other LNG importers (such as Japan, South Korea, and Pakistan) see adverse effects from higher prices"
        verified: true
    network:
      freq: A
      products: ["C:fertiliser:gas"]
      from: 2019
      to: 2025
      base: 2021
      note: "Pipeline gas (2711.21) and LNG (2711.11) share the stage, so the measures below split it by code. EU27 as one importer means its members' imports from non-members, so gas resold inside the EU is not counted twice."
      measures:
