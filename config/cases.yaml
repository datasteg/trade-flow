        quote:
          - "evaluating and ranking the supply fragility of individual traded goods"
          - "supply shock vulnerability based on the composition of their individual import baskets"
        verified: true
      - ref: "jejualps:122254"
        authors: "Alshehri, Banerjee, Chui, Maddux, Munakata & Zampolli"
        year: 2026
        series: "BIS Bulletin"
