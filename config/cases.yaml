  - id: tariffs-2025
    num: 8
    events: ["10"]
    title: {en: "Chinese exports ran ahead of the tariffs, then around them", ko: "중국 수출은 관세를 앞질렀다가 비켜 갔다"}
    question:
      en: "How did Chinese exports and US imports move around the 2025 tariffs, month by month?"
      ko: "2025년 관세를 전후해 중국의 수출과 미국의 수입은 달마다 어떻게 움직였는가?"
    carries_over: []
    papers:
      - ref: "jejualps:66864"
        authors: "Lu & Milkov"
        year: 2026
        series: "IMF Working Paper"
        number: "WP/26/013"
        title: "Understanding China’s 2024–25 Frontloading from the Lens of Product-Level Export Baskets"
        url: "https://www.elibrary.imf.org/view/journals/001/2026/013/001.2026.issue-013-en.xml"
        date: 2026-01-23
        finding:
          en: "China's shipments to the US “accelerated in the second half of 2024”; from January 2025 shipments of intermediate inputs to Vietnam and other ASEAN economies accelerated; as shipments to the US “fell sharply in April-May”, the decline “was offset by increased shipments to third destinations”."
          ko: "저자들은 중국의 대미 선적이 “2024년 하반기에 가속했다”고 썼습니다. 2025년 1월부터는 베트남 등 아세안으로 가는 중간재 선적이 빨라졌습니다. 저자들은 대미 선적이 “4~5월에 급감”하자 그 감소가 “제3국으로의 선적 증가로 상쇄되었다”고 썼습니다."
        quote:
          - "accelerated in the second half of 2024"
          - "fell sharply in April-May"
          - "was offset by increased shipments to third destinations"
        verified: true
      - ref: "jejualps:45586"
        authors: "Zhao"
        year: 2025
        series: "BIS Working Paper"
        number: "1316"
        title: "Assessing the macroeconomic impacts of the 2025 US tariffs"
        url: "https://www.bis.org/publ/work1316.htm"
        date: 2025-12-11
        finding:
          en: "The 2025 measures raised the average effective US tariff rate “from 2.4% at the end of 2024 to 17.4%”; in a multi-country model, “The US itself suffers a significant output drop of 0.9%” in the short run."
          ko: "2025년 조치로 미국의 평균 실효관세율은 “2024년 말 2.4%에서 17.4%로” 올랐습니다. 저자는 다국가 모형에서 단기에 “미국 자신도 0.9%의 상당한 산출 감소를 겪는다”고 썼습니다."
        quote:
          - "from 2.4% at the end of 2024 to 17.4%"
          - "The US itself suffers a significant output drop of 0.9%"
        verified: true
      - ref: "jejualps:66739"
        authors: "Ahn, Rotunno & Ruta"
        year: 2026
        series: "IMF Working Paper"
        number: "WP/26/149"
        title: "Tariff Pass-Through and Import Reallocation"
        url: "https://www.elibrary.imf.org/view/journals/001/2026/149/001.2026.issue-149-en.xml"
        date: 2026-07-17
        finding:
          en: "Duty-exclusive import prices “at the variety (country-product) level do not adjust to tariffs, implying full pass-through to duty-inclusive prices at the border”; within products, imports reallocate toward lower-priced sources."
          ko: "저자들은 관세를 제외한 수입가격을 분석했습니다. 저자들은 이 가격이 “품종(국가·품목) 수준에서 관세에 반응하지 않아, 국경에서 관세를 포함한 가격으로 완전히 전가된다”고 했습니다. 같은 품목 안에서는 수입이 더 싼 공급처로 재배치됩니다."
        quote: "at the variety (country-product) level do not adjust to tariffs, implying full pass-through to duty-inclusive prices at the border"
        verified: true
    network:
      freq: M
      products: [TOTAL]
      from: 202401
      to: 202607
      base: "same month a year earlier"
      note: "Only reporters that have filed: the US to Jul 2026. China's own monthly files end in Dec 2024 in the store, so China's exports are read from its partners' imports."
      measures:
        - kind: partner_shares
          product: TOTAL
          importer: USA
          partners: [CHN, MEX, CAN, VNM, S19, KOR]
          lens: S
          from: 202401
          to: 202607
          en: "Shares of US imports by partner, month by month"
          ko: "미국 수입의 상대국별 비중(월별)"
        - kind: world_change
          product: TOTAL
          importers: [USA]
          partner: CHN
          lens: S
          periods: [202504, 202505]
          against: same_month_year_before
          en: "US imports from China, April and May 2025 against a year earlier"
          ko: "미국의 대중 수입, 2025년 4월과 5월 전년동월대비"
        - kind: partner_shares
          product: TOTAL
          exporter: CHN
          partners: [USA, ASEAN, EU27]
          lens: M
          from: 202401
          to: 202606
          mirror: true
          en: "China's exports by destination as its partners report them, 3-month sums"
          ko: "상대국이 신고한 중국의 행선지별 수출, 3개월 합계"
        - kind: world_change
          product: TOTAL
          importers: ASEAN
          partner: CHN
          lens: M
          periods: [202503, 202506]
          against: same_month_year_before
          en: "ASEAN members' imports from China in 2025 against a year earlier, for the members that have filed"
          ko: "신고를 마친 아세안 회원국의 대중 수입, 2025년 전년동기대비"
        - kind: share_change
          product: TOTAL
          supplier: CHN
          importer: USA
          lens: L
          periods: [202412, 202606]
          en: "China's share of US imports, 12 months to Dec 2024 against 12 months to Jun 2026"
          ko: "미국 수입의 중국 비중, 2024년 12월까지 12개월과 2026년 6월까지 12개월 비교"
      plan_numbers: null
    scenario:
      kind: tariff
      product: TOTAL
      supplier: CHN
      importer: USA
      cut: 0.5
      period: 2024
      down_stage: null
      en: "Set a tariff by partner and product, entered as the share of that partner's flow it removes, and see the shift in other suppliers' shares it would take to keep supply whole"
      ko: "상대국·품목별로 관세를 정합니다. 관세는 그로 인해 사라지는 해당국 물량의 비중으로 입력합니다. 공급을 유지하려면 다른 공급국의 비중이 얼마나 바뀌어야 하는지 살펴봅니다."
    korea:
      en: "The plan gives no Korean number for this case. The page shows Korea's share of US imports month by month from 2024, read from US reports, which run to July 2026; Korea's own months from January 2026 come from the Korea Customs Service."
      ko: "계획서에는 이 사례의 한국 수치가 없습니다. 페이지에는 2024년 이후 미국 수입의 한국 비중을 월별로 표시합니다. 이 수치는 미국의 신고 자료이며, 2026년 7월까지 있습니다. 한국 자체의 2026년 1월 이후 자료는 관세청 통계입니다."
    limits:
      en: "The network has values, not prices or tariffs: Ahn, Rotunno and Ruta need tariff lines and unit values to find full pass-through and the shift toward cheaper sources, and Zhao's output and price effects come from a multi-country model. Frontloading is a shift in timing that later months reverse, so a single month's change on a year earlier can mislead; reporters file late, and the 2026 months cover only the economies that have filed."
      ko: "네트워크에는 금액만 있고 가격이나 관세는 없습니다. 안·로투노·루타는 관세 세번과 단가 자료로 완전 전가와 더 싼 공급처로의 이동을 확인했습니다. 자오의 산출·물가 효과는 다국가 모형에서 산출합니다. 앞당긴 수출은 이후 몇 달 동안 되돌려지는 시점 이동입니다. 따라서 한 달의 전년동월대비 변화는 오해를 낳을 수 있습니다. 신고는 늦게 들어오고, 2026년 월별 자료는 신고를 마친 경제만 포함합니다."

