# Case studies for trade-flow.datasteg.com: nine papers' findings or scenarios rebuilt on the
# Comtrade network, so a reader can see them and change them.
# scripts/build_snapshots.py reads this file. Every paper was found in the jejualps archive and
# every quoted phrase checked against its abstract or text on 24 Oct 2026 (`artools jejualps doc`
# and `chunks --around`); `ref` is the archive id, kept here and not shown on the site.
#
# Conventions
#   events        the events' numbers: "A1", "A2", "1" … "12"
#   products      TOTAL, HS:<chapter>, B:<basket> (trade-collector config/network.yaml) or
#                 C:<chain>:<stage> (config/chains.yaml; a stage shared by two chains is named after
#                 the first, e.g. C:semiconductors:wafers). "C:*" means every chain stage (78).
#   codes         a measure on part of a product (gas: 271121 pipeline, 271111 LNG); the builder has
#                 to split the product by code, since snapshots are built per product
#   periods       YYYY or YYYYMM. Monthly measures name a lens: L = 12-month sum,
#                 M = 3-month sum, S = the single month (January and February one period)
#   importers     complete = economies that filed every month of the window; filed = those that
#                 filed the period; all = every importer (annual); or ISO3 / group keys / a list
#   against       same_month_year_before, or a period the change is measured from
#   importer, supplier, exporter: ISO3, a network.yaml group key, or a list (a list of economies
#                 to sum; under `each:` one result per economy)
#   quote         the verbatim phrase as found (whitespace and line breaks normalised); a list when
#                 the finding quotes more than one phrase. verified: every phrase was found.
#   plan_numbers  numbers stated in the plan, to be re-measured by the builder (null: none given)
#   scenario      the first-round engine: exposure = import share × cut, the gap
#                 filled by the importer's other suppliers in proportion, the shortfall passed one
#                 stage down through chains.yaml feeds. A tariff is entered as the share of the
#                 partner's flow it removes (the engine has no prices).
# Regions not in network.yaml groups are ISO3 lists; the Gulf (Hormuz) is written once below.

regions:
  gulf: &gulf [SAU, ARE, IRQ, KWT, QAT, IRN, OMN, BHR]

cases:
  # ----------------------------------------------------------------------------------------------
  - id: lockdowns-2020
    num: 1
    events: ["4"]
    title: {en: "Lockdowns travel along supply chains", ko: "봉쇄는 공급망을 타고 번진다"}
    question:
      en: "How much of the 2020 trade collapse came from lockdowns abroad rather than from demand, and through which flows?"
      ko: "2020년 무역 붕괴 가운데 수요가 아니라 해외 봉쇄에서 비롯된 몫은 얼마이며, 그 몫이 어떤 흐름을 타고 번졌는지 살펴봅니다."
    carries_over: []
    papers:
      - ref: "jejualps:67760"
        authors: "Aiyar, Malacrino, Mohommad & Presbitero"
        year: 2022
        series: "IMF Working Paper"
        number: "WP/22/120"
        title: "International Trade Spillovers from Domestic COVID-19 Lockdowns"
        url: "https://www.elibrary.imf.org/view/journals/001/2022/120/001.2022.issue-120-en.xml"
        date: 2022-06-17
        finding:
          en: "International spillovers from lockdowns “accounted for up to 60 percent of the observed decline in trade in the early phase of the pandemic, but their effect was shortlived, concentrated among goods produced in key global value chains”."
          ko: "저자들은 다른 나라의 봉쇄가 낳은 국제 파급효과를 분석했습니다. 저자들은 이 효과가 “팬데믹 초기에 관찰된 무역 감소의 최대 60%를 설명했다”고 썼습니다. 그러나 “그 효과는 오래가지 않았고 핵심 글로벌 가치사슬에서 생산되는 재화에 집중되었다”고 덧붙였습니다."
        quote: "accounted for up to 60 percent of the observed decline in trade in the early phase of the pandemic, but their effect was shortlived, concentrated among goods produced in key global value chains"
        verified: true
      - ref: "jejualps:67862"
        authors: "Boranova, Huidrom, Ozturk, Stepanyan, Topalova & Zhang"
        year: 2022
        series: "IMF Working Paper"
        number: "WP/22/006"
        title: "Cars in Europe: Supply Chains and Spillovers during COVID-19 Times"
        url: "https://www.elibrary.imf.org/view/journals/001/2022/006/001.2022.issue-006-en.xml"
        date: 2022-01-14
        finding:
          en: "In a multi-country model of the pandemic's labour-supply shocks, Europe's major car producers see “one-third of the decline in the value added of the car sector attributable to spillovers via supply chains within and across borders”."
          ko: "저자들은 팬데믹 초기의 노동공급 충격이 유럽 주요 자동차 생산국에 미친 영향을 다국가·다부문 일반균형 모형으로 분석했습니다. 저자들은 “자동차 부문 부가가치 감소의 3분의 1”이 “국경 안팎의 공급망을 통한 파급효과”에서 비롯되었다고 분석했습니다."
        quote: "one-third of the decline in the value added of the car sector attributable to spillovers via supply chains within and across borders"
        verified: true
      - ref: "jejualps:96588"
        authors: "Bonadio, Huo, Levchenko & Pandalai-Nayar"
        year: 2020
        series: "NBER Working Paper"
        number: "w27224"
        title: "Global Supply Chains in the Pandemic"
        url: "https://www.nber.org/papers/w27224"
        date: 2020-05-01
        finding:
          en: "A multi-sector model of 64 countries traces how the pandemic's labour-supply shock travelled through supply chains: “One quarter of the total model-implied real GDP decline is due to transmission through global supply chains.”"
          ko: "저자들은 64개국 다부문 모형으로 팬데믹 노동공급 충격의 공급망 파급 경로를 추적했습니다. 저자들은 “모형이 함의하는 실질 GDP 감소 전체의 4분의 1은 글로벌 공급망을 통한 파급 때문”이라고 썼습니다."
        quote: "One quarter of the total model-implied real GDP decline is due to transmission through global supply chains."
        verified: true
    network:
      freq: M
      products: [TOTAL, "B:car_parts", "B:chips_ic"]
      from: 202001
      to: 202112
      base: "same month of 2019"
      measures:
        - kind: world_change
          product: TOTAL
          importers: complete
          window: [201901, 202012]
          lens: S
          periods: [202004, 202005]
          against: same_month_year_before
          en: "Imports of the economies that filed every month of 2019 and 2020, April and May 2020 against the same months of 2019"
          ko: "2019년과 2020년에 매달 신고한 경제의 수입, 2020년 4월과 5월 전년동월대비"
          note: "Single months (lens S), as the plan's −24% and −28%; the event strip itself shows lens M."
        - kind: world_change
          product: TOTAL
          importers: complete
          window: [201901, 202012]
          lens: S
          periods: [202006, 202007, 202008, 202009, 202010, 202011, 202012]
          against: same_month_year_before
          en: "The same imports month by month to December 2020: the first month back at the 2019 level"
          ko: "같은 수입의 2020년 12월까지 월별 전년동월대비 변화. 2019년 수준을 처음 회복한 달"
          # A3 (1 Nov 2026): the panel is balanced every month (115 files a month, none set aside), so the dips are not
          # a reporting gap. They follow working days and the base months: Jun 2020 had two more weekdays than Jun
          # 2019, Jul the same, Sep one more, Oct one fewer; Jul 2019 was strong (UK gold); China drove Sep (+13.9%).
          note: "The Jul and Oct dips are calendar effects, not lost trade: June and September 2020 had more weekdays than a year earlier, July the same and October one fewer, so single months jump around. Fuels (HS 27) lower every month by 4 to 5 points as oil prices fell; without them imports are above 2019 from September."
          note_ko: "7월과 10월의 감소는 교역 위축이 아니라 달력 효과입니다. 2020년 6월과 9월은 전년 같은 달보다 평일이 많았습니다. 7월은 평일 수가 같았고, 10월은 하루 적었습니다. 그래서 한 달 단위 수치는 변동이 큽니다. 유가 급락으로 연료(HS 27)가 매달 증감률을 4~5%p 끌어내렸습니다. 연료를 제외하면 9월부터 2019년 수준을 웃돕니다."
        - kind: world_change
          product: "B:car_parts"
          importers: complete
          window: [201901, 202012]
          lens: S
          periods: [202002, 202003, 202004, 202005, 202006]
          against: same_month_year_before
          en: "Car-parts imports of the same economies, January–February to June 2020 against a year earlier"
          ko: "같은 경제의 자동차 부품 수입, 2020년 1~2월부터 6월까지 전년동월대비"
        - kind: world_change
          product: "B:chips_ic"
          importers: complete
          window: [201901, 202012]
          lens: S
          periods: [202002, 202003, 202004, 202005, 202006]
          against: same_month_year_before
          en: "Chip imports of the same economies in the same months"
          ko: "같은 경제의 집적회로 수입, 같은 기간"
        # A7: the one decomposition customs data supports, a test of the supplier-lockdown channel: did imports from the
        # supplier in lockdown fall more than imports from everyone else, in its lockdown months?
        - kind: partner_split
          product: TOTAL
          importers: complete
          window: [201901, 202012]
          lens: S
          partner: CHN
          periods: [202002, 202003]
          en: "Imports from China and from everyone else, January–February and March 2020, when China was in lockdown"
          ko: "중국이 봉쇄되었던 2020년 1~2월과 3월, 중국산 수입과 그 밖의 수입"
        - kind: partner_split
          product: TOTAL
          importers: complete
          window: [201901, 202012]
          lens: S
          partner: EU27
          outside: true
          periods: [202004, 202005]
          en: "Imports from the EU and from everyone else, April and May 2020, when Europe was in lockdown (importers outside the EU)"
          ko: "유럽이 봉쇄되었던 2020년 4월과 5월, EU산 수입과 그 밖의 수입(EU 밖의 수입국)"
          note: "Importers inside the EU are left out: their imports from one another mix the exporter's lockdown with their own."
          note_ko: "EU 안의 수입국은 제외했습니다. 회원국 간 수입에는 수출국의 봉쇄와 수입국 자신의 봉쇄 효과가 섞여 있기 때문입니다."
        - kind: korea_exposure
          product: "B:car_parts"
          supplier: CHN
          periods: [2019]
          en: "China's share of Korea's car-parts imports in 2019, where the scenario starts"
          ko: "시나리오의 출발점인 2019년 한국 자동차 부품 수입의 중국 비중"
      plan_numbers:
        en: "Imports of 113 economies −24% (Apr) and −28% (May 2020) on a year earlier; back to the 2019 level by Sep 2020"
        ko: "113개 경제의 수입은 전년동월대비 2020년 4월 −24%, 5월 −28%였습니다. 9월에는 2019년 수준을 회복했습니다."
        # 1 Nov 2026: no 2019–2020 monthly file arrived after the plan (manifest), and no file of those months is set aside,
        # so the count did not change with new data; the plan's 113 cannot be reproduced from the files.
        note:
          en: "The plan counted 113 economies; the same rule (every month of 2019 and 2020 filed) gives 115 on today's files. No file for those months arrived after the plan, so the two differ in how the earlier count was made, not in the data."
          ko: "계획서는 113개 경제를 집계했습니다. 같은 규칙(2019년과 2020년 매달 신고)을 현재 파일에 적용하면 115개입니다. 해당 기간 파일 가운데 계획서 이후 새로 들어온 것은 없습니다. 따라서 차이는 자료가 아니라 앞선 집계 방식에서 생겼습니다."
      # A2 (1 Nov 2026): recomputed independently from the layer; genuine coincidences at one decimal:
      # chips Jan–Feb +8.428% vs Mar +8.407%, all goods Dec +8.398%; car parts Jun −27.226% vs all goods May −27.163%.
      reviewed_repeats:
        values: ["+8.4%", "-27.2%"]
    scenario:
      kind: cut_supplier
      product: "C:steel:car_parts"
      supplier: CHN
      alternatives: [EU27]
      cut: 1.0
      period: 2019
      down_stage: "C:steel:cars"
      note: "The stage C:steel:car_parts adds engines (8407.34, 8408.20) to the basket's 8708, so the shortfall can pass to cars."
      en: "Close China (as in February 2020) or Europe (as in April 2020) and see whose car-parts imports were most exposed, and which car makers one stage down"
      ko: "중국(2020년 2월처럼)이나 유럽(2020년 4월처럼)의 공급을 차단합니다. 어느 나라의 자동차 부품 수입이 가장 크게 노출되는지 살펴봅니다. 그 부족이 한 단계 아래 어느 완성차 생산국으로 이어지는지도 살펴봅니다."
    korea:
      en: "The plan gives no Korean number for this case. The page compares Korea's car-parts and chip imports from February to June 2020 with the same months of 2019, and measures China's share of Korea's car-parts imports in 2019, the exposure the scenario starts from."
      ko: "계획서에는 이 사례의 한국 수치가 없습니다. 페이지는 2020년 2월부터 6월까지 한국의 자동차 부품·반도체 수입을 2019년 같은 달과 비교합니다. 시나리오의 출발점인 2019년 한국 자동차 부품 수입의 중국 비중도 산출합니다."
    limits:
      en: "Customs values cannot tell a supply shock from a demand shock: the fall is the same number either way. Aiyar et al. separate the two with an import-demand model and their partners' lockdown stringency, Boranova et al. and Bonadio et al. with multi-country models of labour supply. Values also move with prices (oil fell sharply in 2020), and the scenario's first-round map assumes no stocks and no substitution."
      ko: "통관 금액만으로는 공급 충격과 수요 충격을 구분할 수 없습니다. 어느 쪽이든 감소액은 같습니다. 아이야르 등은 수입수요 모형과 교역상대국의 봉쇄 강도로 둘을 구분합니다. 보라노바 등과 보나디오 등은 노동공급을 다룬 다국가 모형을 씁니다. 금액은 가격에 따라서도 변합니다(2020년에는 유가가 급락했습니다). 시나리오의 1차 효과 지도는 재고와 대체가 없다고 가정합니다."

  # ----------------------------------------------------------------------------------------------
  - id: japan-2011
    num: 2
    events: ["A2"]
    title: {en: "After Japan's 2011 quake, buyers switched suppliers", ko: "2011년 일본 지진 뒤 구매자들은 공급처를 바꿨다"}
    question:
      en: "After the earthquake, did buyers of Japanese car parts and electronics bring production home, move it nearby, or switch suppliers?"
      ko: "지진 뒤 일본산 자동차 부품·전자부품 수입국은 생산을 자국으로 되돌렸습니까, 인근 국가로 옮겼습니까, 아니면 공급처를 바꿨습니까?"
    carries_over: []
    papers:
      - ref: "jejualps:79233"
        authors: "Freund, Mattoo, Mulabdic & Ruta"
        year: 2021
        series: "World Bank Policy Research Working Paper"
        number: "WPS9719"
        title: "Natural Disasters and the Reshaping of Global Value Chains"
        url: "http://documents.worldbank.org/curated/en/293731624900715587/Natural-Disasters-and-the-Reshaping-of-Global-Value-Chains"
        date: 2021-06-28
        finding:
          en: "The 2011 shock “did not lead to reshoring, nearshoring, or diversification”. “Imports did shift to new suppliers, especially where dependence on Japan was greater. But production relocated to developing countries rather than to other top exporters.”"
          ko: "저자들은 2011년 충격이 “리쇼어링, 니어쇼어링, 다변화로 이어지지 않았다”고 썼다. 또 “수입은 새 공급처로 옮겨 갔고, 일본 의존도가 컸던 나라일수록 더 그랬다. 그러나 생산은 다른 주요 수출국이 아니라 개발도상국으로 옮겨 갔다”고 썼다."
        quote:
          - "did not lead to reshoring, nearshoring, or diversification"
          - "Imports did shift to new suppliers, especially where dependence on Japan was greater. But production relocated to developing countries rather than to other top exporters."
        verified: true
      - ref: "jejualps:69197"
        authors: "Korniyenko, Pinat & Dew"
        year: 2017
        series: "IMF Working Paper"
        number: "WP/17/30"
        title: "Assessing the Fragility of Global Trade: The Impact of Localized Supply Shocks Using Network Analysis"
        url: "https://www.elibrary.imf.org/view/journals/001/2017/030/001.2017.issue-030-en.xml"
        date: 2017-02-13
        finding:
          en: "Natural disasters revealed choke points in the trade network, such as “hard drive components and Thailand flooding, Japanese auto components post-Fukushima”."
          ko: "자연재해는 무역 네트워크의 병목을 드러냈습니다. 저자들은 그 예로 “하드디스크 부품과 태국 홍수, 후쿠시마 이후 일본 자동차 부품”을 들었습니다."
        quote: "hard drive components and Thailand flooding, Japanese auto components post-Fukushima"
        verified: true
    network:
      freq: A
      products: ["B:car_parts", "B:semiconductors"]
      from: 2009
      to: 2014
      base: 2010
      note: "The plan adds monthly views from 2010, but monthly snapshots of products other than all goods start in January 2014 (FIRST_MONTH in scripts/build_snapshots.py), so the case is annual unless that changes. Hard-drive parts (8471.70, 8473.30) are in no basket or stage."
      measures:
        - kind: top_exporters
          product: "B:car_parts"
          periods: [2010, 2011, 2012, 2014]
          en: "Shares of world car-parts exports: Japan's, and who rose"
          ko: "세계 자동차 부품 수출의 국가별 비중(일본과 비중이 높아진 나라)"
        - kind: top_exporters
          product: "B:semiconductors"
          periods: [2010, 2011, 2012, 2014]
          en: "Shares of world exports of chips and other semiconductors"
          ko: "세계 반도체(집적회로와 개별소자) 수출에서 각국이 차지한 비중"
        - kind: share_change
          product: "B:car_parts"
          supplier: JPN
          each: {importer: [USA, CHN, THA, KOR]}
          periods: [2010, 2012]
          en: "Japan's share of the largest importers' car-parts imports, 2010 against 2012"
          ko: "주요 수입국의 자동차 부품 수입에서 일본이 차지한 비중, 2010년과 2012년 비교"
        - kind: partner_shares
          product: "B:car_parts"
          importer: USA
          partners: [JPN, MEX, CAN, CHN, DEU, KOR]
          from: 2009
          to: 2014
          en: "US car-parts imports by supplier, 2009–2014"
          ko: "미국의 공급국별 자동차 부품 수입, 2009~2014년"
        - kind: korea_exposure
          product: "B:car_parts"
          supplier: JPN
          periods: [2010, 2012]
          en: "Japan's share of Korea's car-parts imports, 2010 and 2012"
          ko: "한국 자동차 부품 수입의 일본 비중, 2010년과 2012년"
        - kind: korea_exposure
          product: "B:semiconductors"
          supplier: JPN
          periods: [2010, 2012]
          en: "Japan's share of Korea's semiconductor imports, 2010 and 2012"
          ko: "한국 반도체 수입의 일본 비중, 2010년과 2012년"
      plan_numbers: null
    scenario:
      kind: cut_supplier
      product: "C:steel:car_parts"
      supplier: JPN
      cut: 1.0
      period: 2010
      down_stage: "C:steel:cars"
      en: "Remove Japan from car parts (or chips) and rank who fills the gap in the first round, then compare with the shares that actually moved in 2011–2012"
      ko: "자동차 부품(또는 반도체) 공급에서 일본을 제외하고 1차로 이를 대체하는 공급국의 순위를 매깁니다. 이를 2011~2012년에 실제로 변한 비중과 비교합니다."
    korea:
      en: "The plan gives no Korean number for this case. The page measures Japan's share of Korea's car-parts and chip imports in 2010 and 2012, and whether Korean suppliers gained share in other importers' car-parts imports after March 2011."
      ko: "계획서에는 이 사례의 한국 수치가 없습니다. 페이지는 2010년과 2012년 한국의 자동차 부품·반도체 수입에서 일본이 차지한 비중을 산출합니다. 2011년 3월 이후 다른 나라의 자동차 부품 수입에서 한국산 비중이 높아졌는지도 살펴봅니다."
    limits:
      en: "Trade shows where imports came from, not where production moved: Freund et al. test reshoring, nearshoring and diversification with detailed product data, and Boehm, Flaaen and Pandalai-Nayar (further reading) need firm-level data on US affiliates of Japanese firms to measure how hard inputs are to replace. Annual totals blur a shock that lasted months, and the scenario fills the gap only from suppliers the importer already uses, so it cannot see the new suppliers the paper finds."
      ko: "무역 자료로는 수입이 어디서 왔는지만 알 수 있고, 생산이 어디로 옮겨 갔는지는 알 수 없습니다. 프로인트 등은 상세한 품목 자료로 리쇼어링, 니어쇼어링, 다변화를 검정했습니다. 뵘·플라엔·판달라이나야르(더 읽을거리)는 일본 기업 미국 자회사의 기업 단위 자료를 썼습니다. 투입재를 대체하기가 얼마나 어려운지 측정하기 위해서입니다. 연간 합계에서는 몇 달 동안 이어진 충격이 희석됩니다. 시나리오는 수입국의 기존 공급처로만 부족분을 메우므로 논문이 찾은 새 공급처는 반영하지 못합니다."

  # ----------------------------------------------------------------------------------------------
  - id: blocs-connectors
    num: 3
    events: ["1", "6"]
    title: {en: "Trade is splitting into blocs, with connectors between", ko: "무역은 블록으로 갈라지고 연결국이 사이를 잇는다"}
    question:
      en: "Is trade splitting along geopolitical lines, and are “connector” economies bridging the blocs or just relabelling Chinese goods?"
      ko: "무역은 지정학적 경계를 따라 갈라지고 있습니다. ‘연결국’들은 블록 사이를 잇는가, 아니면 중국산의 원산지만 바꾸어 붙이는가?"
    carries_over: ["US–China", "nearshoring", "blocs"]
    papers:
      - ref: "jejualps:67306"
        authors: "Gopinath, Gourinchas, Presbitero & Topalova"
        year: 2024
        series: "IMF Working Paper"
        number: "WP/24/76"
        title: "Changing Global Linkages: A New Cold War?"
        url: "https://www.elibrary.imf.org/view/journals/001/2024/076/001.2024.issue-076-en.xml"
        date: 2024-04-05
        finding:
          en: "Since the war in Ukraine, trade and FDI between geopolitically distant blocs fell relative to flows within blocs, “roughly 12% and 20%, respectively”; “nonaligned ‘connector’ countries are rapidly gaining importance”."
          ko: "저자들은 우크라이나 전쟁 이후 지정학적으로 먼 블록 간 무역과 직접투자가 감소했다고 썼습니다. 같은 블록 안의 흐름에 비해 각각 약 12%와 20% 줄었다고 분석했습니다. 저자들은 “비동맹 ‘연결국’들이 빠르게 중요해지고 있다”고 썼습니다."
        quote:
          - "roughly 12% and 20%, respectively"
          - "nonaligned ‘connector’ countries are rapidly gaining importance"
        verified: true
      - ref: "jejualps:77010"
        authors: "Freund, Mattoo, Mulabdic & Ruta"
        year: 2023
        series: "World Bank Policy Research Working Paper"
        number: "WPS10593"
        title: "Is US Trade Policy Reshaping Global Supply Chains ?"
        url: "http://documents.worldbank.org/curated/en/099812010312311610/IDU0938e50fe0608704ef70b7d005cda58b5af0d"
        date: 2023-10-31
        finding:
          en: "In US tariff-line import data, “China’s share of US imports fell from 22 to 16 percent” between 2017 and 2022, and the paper shows that the decline is due to US tariffs."
          ko: "저자들은 미국의 세번 단위 수입 자료로 2017년부터 2022년까지를 분석했습니다. 저자들은 “미국 수입에서 중국의 비중이 22%에서 16%로 떨어졌다”고 썼습니다. 저자들은 이 하락이 미국 관세 때문이라고 분석했습니다."
        quote: "China’s share of US imports fell from 22 to 16 percent"
        verified: true
      - ref: "jejualps:67009"
        authors: "Schulze & Xin"
        year: 2025
        series: "IMF Working Paper"
        number: "WP/25/129"
        title: "Demystifying Trade Patterns In A Fragmenting World"
        url: "https://www.elibrary.imf.org/view/journals/001/2025/129/001.2025.issue-129-en.xml"
        date: 2025-06-27
        finding:
          en: "Of six Asian connectors, only Vietnam shows clear evidence: “Vietnam appears to have benefited from trade reallocation, with increased domestic content in its exports to the US”, instead of significant transshipment of Chinese exports."
          ko: "아시아 연결국 여섯 나라 가운데 증거가 뚜렷한 나라는 베트남뿐입니다. 저자들은 “베트남은 무역 재배치의 혜택을 받은 것으로 보이며, 대미 수출에서 국내 부가가치 비중이 늘었다”고 썼습니다. 중국산의 대규모 우회수출은 아니었다는 것입니다."
        quote: "Vietnam appears to have benefited from trade reallocation, with increased domestic content in its exports to the US"
        verified: true
      - ref: "jejualps:205"
        authors: "Qiu, Shin & Zhang"
        year: 2023
        series: "BIS Bulletin"
        number: "78"
        title: "Mapping the realignment of global value chains"
        url: "https://www.bis.org/publ/bisbull78.htm"
        date: 2023-10-03
        finding:
          en: "Firm-level supplier data show chains from China to the US lengthening, “where firms from other jurisdictions, notably in Asia, have interposed themselves in the supply chain”."
          ko: "기업 단위 공급망 자료로 보면 중국에서 미국으로 가는 공급망이 길어졌습니다. 저자들은 “다른 지역, 특히 아시아의 기업들이 그 공급망 사이에 끼어들었다”고 썼습니다."
        quote: "firms from other jurisdictions, notably in Asia, have interposed themselves in the supply chain"
        verified: true
      - ref: "jejualps:44598"
        authors: "Qiu, Xia & Yetman"
        year: 2024
        series: "BIS Quarterly Review"
        number: "September 2024"
        title: "Deconstructing global trade: the role of geopolitical alignment"
        url: "https://www.bis.org/publ/qtrpdf/r_qt2409c.htm"
        date: 2024-09-16
        finding:
          en: "Between 2017 and 2023 the quarter-on-quarter change in trade volumes “was 2.5% lower on average between geopolitically distant countries relative to those that were closer”."
          ko: "저자들은 2017~2023년 무역량의 전분기 대비 변화율을 비교했습니다. 저자들은 이 변화율이 “지정학적으로 먼 나라들 사이에서 가까운 나라들에 비해 평균 2.5% 낮았다”고 썼습니다."
        quote: "was 2.5% lower on average between geopolitically distant countries relative to those that were closer"
        verified: true
    network:
      freq: A
      products: [TOTAL, "C:solar:pv_modules", "C:solar:pv_cells", "C:semiconductors:ics"]
      from: 2013
      to: 2024
      base: 2017
      note: "Group colouring uses the narrow blocs WEST and EAST of network.yaml; every other economy is a third economy (connector candidate). Solar cells have their own code only from HS2022 (codes_pre2022: []), so the cells scatter uses 2022 onwards."
      measures:
        - kind: between_groups
          product: TOTAL
          a: WEST
          b: EAST
          freq: A
          from: 1990
          to: 2024
          en: "Trade between the narrow West and East blocs as a share of world trade, 1990–2024"
          ko: "좁은 의미의 서방 블록과 동방 블록 사이 무역이 세계 무역에서 차지하는 비중, 1990~2024년"
        - kind: between_groups
          product: TOTAL
          a: WEST
          b: EAST
          freq: M
          lens: L
          from: 201801
          to: 202412
          en: "The same by month, 12-month sums, to December 2024 (the last complete month)"
          ko: "같은 비중의 월별 추이(12개월 합계), 2024년 12월(자료가 모두 들어온 마지막 달)까지"
        - kind: partner_shares
          product: TOTAL
          importer: USA
          partners: [CHN, MEX, VNM, CAN, S19, KOR]
          from: 2013
          to: 2024
          en: "Shares of US imports by partner, all goods"
          ko: "미국 수입의 상대국별 비중, 전체 상품"
        - kind: share_change
          product: TOTAL
          supplier: CHN
          importer: USA
          periods: [2017, 2022]
          en: "China's share of US imports, 2017 against 2022 (Freund et al.: 22 to 16 percent)"
          ko: "미국 수입의 중국 비중, 2017년과 2022년 비교(프로인트 등 22% → 16%)"
        - kind: connector_scatter
          a: USA
          b: CHN
          windows: [[2013, 2017], [2018, 2023]]
          each: {product: [TOTAL, "C:solar:pv_modules", "C:semiconductors:ics"]}
          en: "Connectors: change in third economies' share of US imports against change in their share of China's exports, 2013–17 to 2018–23 (Gopinath et al., Fig. 4A)"
          ko: "연결국 산점도. 제3국의 미국 수입 비중과 중국 수출 비중의 변화, 2013~17년 → 2018~23년(고피나스 등, 그림 4A)"
        - kind: connector_scatter
          a: USA
          b: CHN
          windows: [[2022, 2022], [2024, 2024]]
          product: "C:solar:pv_cells"
          en: "The same for solar cells, 2022 against 2024, the years the code exists"
          ko: "태양전지의 같은 산점도, 코드가 있는 2022년과 2024년 비교"
        - kind: partner_shares
          product: TOTAL
          each: {importer: [VNM, MEX]}
          partners: [CHN]
          from: 2013
          to: 2024
          en: "The back door: China's share of Vietnam's and Mexico's imports"
          ko: "뒷문: 베트남과 멕시코 수입의 중국 비중"
        - kind: share_change
          product: TOTAL
          supplier: KOR
          importer: USA
          periods: [2017, 2022]
          focus: KOR          # measured for one economy: shown with ?focus=KOR only
          en: "Korea's share of US imports, 2017 against 2022"
          ko: "미국 수입의 한국 비중, 2017년과 2022년 비교"
      plan_numbers:
        en: "No measured numbers in the plan; the papers' figure to re-measure: China's share of US imports 22% (2017) → 16% (2022)"
        ko: "계획서에는 산출한 수치가 없습니다. 재산출할 논문 수치는 미국 수입의 중국 비중 22%(2017년) → 16%(2022년)입니다."
    scenario:
      kind: tariff
      product: "C:solar:pv_modules"
      supplier: CHN
      importer: USA
      cut: 0.5
      period: 2017
      down_stage: null
      note: "The China → connector → US paths read the connectors' imports from China of the same stage and the stage above (cells from 2022, wafers before)."
      en: "Put a tariff on China in one stage (solar modules by default; cells or chips), entered as the share of China's flow it removes, and see which connectors fill the US gap and how much of that stage and the one above they buy from China"
      ko: "한 단계(기본값은 태양광 모듈, 태양전지나 집적회로로 바꿀 수 있습니다)에서 중국산에 관세를 부과합니다. 관세는 그 관세로 사라지는 중국 물량의 비중으로 입력합니다. 어느 연결국이 미국의 부족분을 대체하는지 확인합니다. 그 나라들이 같은 단계와 바로 위 단계를 중국에서 얼마나 수입하는지도 확인합니다."
    korea:
      en: "Under the narrow blocs Korea belongs to neither, so it sits among the third economies of the connector scatter. The page measures Korea's share of US imports in 2017 and 2022, China's share of Korea's imports, and where Korea falls in the scatter for all goods and for chips."
      ko: "좁은 블록 정의에서 한국은 어느 쪽에도 속하지 않습니다. 따라서 연결국 산점도에서 제3국으로 분류됩니다. 이 페이지는 2017년과 2022년 미국 수입의 한국 비중과 한국 수입의 중국 비중을 산출합니다. 전체 상품과 집적회로 산점도에서 한국의 위치도 나타냅니다."
    limits:
      en: "Gross trade cannot tell reallocation from rerouting: a Vietnamese export to the US can carry Chinese inputs, which Schulze and Xin separate with value-added data and a synthetic control, and the BIS bulletin with firm-level supplier links. Gopinath et al. estimate a gravity model with fixed effects and Qiu, Xia and Yetman use volumes; our shares are descriptive, in current dollars, and use the narrow blocs only (the papers' blocs from UN votes are not in the data)."
      ko: "총교역 자료로는 무역 재배치와 우회수출을 구분할 수 없습니다. 베트남의 대미 수출에는 중국산 투입재가 들어 있을 수 있습니다. 슐체와 신은 부가가치 자료와 합성통제법으로 이를 구분합니다. BIS 불레틴은 기업 단위 거래 관계를 씁니다. 고피나스 등은 고정효과 중력모형을, 추·샤·예트먼은 물량을 씁니다. 이 페이지의 비중은 경상 달러 기준의 기술통계이며 좁은 블록만 씁니다. 논문들이 쓴 유엔 표결 기반 블록은 이 자료에 없습니다."

