          ko: "저자들은 IMF 무역방향통계(DOTS)의 2000년과 2010년 자료를 썼습니다. 이를 바탕으로 “무역 규모와 무역 연결성 지표에 기초해 국가·지역의 순위를 매기는 틀”을 만들었습니다. 이 틀로 무역 네트워크에서 시스템적으로 중요한 경제를 가려냈습니다."
