          importer: EU27
          partners: [RUS, NOR, USA, QAT, DZA, AZE]
          from: 2019
          to: 2025
          en: "EU gas imports from outside the EU by supplier, pipeline and LNG apart"
          ko: "유럽연합의 공급국별 역외 가스 수입(배관 가스·LNG 구분)"
        - kind: share_change
          product: "C:fertiliser:gas"
          codes: ["271121"]
          supplier: RUS
          importer: EU27
          periods: [2021, 2024]
          en: "Russia's share of EU pipeline-gas imports, 2021 against 2024"
          ko: "유럽연합 배관 가스 수입의 러시아 비중, 2021년과 2024년 비교"
        - kind: share_change
          product: "C:fertiliser:gas"
          codes: ["271111"]
          supplier: USA
          importer: EU27
          periods: [2021, 2024]
          en: "The US share of EU LNG imports, 2021 against 2024"
          ko: "유럽연합 LNG 수입의 미국 비중, 2021년과 2024년 비교"
        - kind: top_exporters
          product: "C:fertiliser:gas"
          codes: ["271111"]
          periods: [2021, 2024]
          en: "Shares of world LNG exports"
          ko: "세계 LNG 수출에서 각국이 차지한 비중"
        - kind: partner_shares
          product: "C:fertiliser:gas"
          codes: ["271111"]
          each: {importer: [JPN]}
          partners: [AUS, QAT, USA, MYS, RUS, OMN]
          from: 2019
          to: 2025
          en: "Japan's LNG suppliers"
          ko: "일본의 LNG 공급국"
        - kind: korea_exposure
          product: "C:fertiliser:gas"
          codes: ["271111"]
          each: {supplier: [RUS, QAT, USA]}
          periods: [2021, 2024]
          en: "Russia's, Qatar's and the US share of Korea's LNG imports, 2021 and 2024"
          ko: "한국 LNG 수입의 러시아·카타르·미국 비중, 2021년과 2024년"
      plan_numbers: null
    scenario:
      kind: cut_supplier
      product: "C:fertiliser:gas"
      codes: ["271121"]
      supplier: RUS
      importers: EU27
      cut: 1.0
      period: 2021
      down_stage: "C:fertiliser:ammonia"
      en: "Cut Russian pipeline gas by 0–100% and see each EU importer's gap, and the LNG it would have to draw from the suppliers Asia buys from"
      ko: "러시아 배관 가스 공급을 0~100% 줄입니다. 유럽연합 각 수입국의 부족분을 산출합니다. 그 부족을 메우려면 아시아의 수입선에서 끌어와야 할 LNG 규모도 산출합니다"
    korea:
      en: "Albrizio et al. name South Korea among the LNG importers hurt by higher prices. The page measures Korea's LNG suppliers from 2019 to 2025, Russia's share among them, and the share of Korea's LNG bought from the suppliers Europe turned to (the US, Qatar)."
      ko: "알브리치오 등은 가격 상승으로 피해를 보는 LNG 수입국으로 한국을 꼽았습니다. 이 페이지는 2019~2025년 한국의 LNG 공급국과 그 가운데 러시아의 비중을 산출합니다. 유럽이 새로 의존한 공급국(미국, 카타르)에서 한국이 수입하는 LNG의 비중도 산출합니다."
    limits:
      en: "Trade shows flows, not balances: storage, demand cuts and fuel switching, which decided whether Europe ran short, are outside customs data, and so are the prices through which, in Albrizio et al.'s general-equilibrium model, other importers paid. Pipeline gas can be recorded against the transit country or the first EU buyer rather than Russia. Di Bella et al. go further with country gas balances and infrastructure bottlenecks."
      ko: "무역 자료는 흐름만 담고 수급 균형은 담지 않습니다. 유럽의 부족 여부를 가른 저장, 수요 감축, 연료 전환은 통관자료에 없습니다. 가격도 마찬가지입니다. 알브리치오 등의 일반균형 모형에서 다른 수입국은 가격을 통해 대가를 치렀습니다. 배관 가스는 러시아가 아니라 경유국이나 첫 유럽연합 수입국 앞으로 기록될 수 있습니다. 디 벨라 등은 국가별 가스 수급과 기반시설 병목까지 분석했습니다."

