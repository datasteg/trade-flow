    network:
      freq: A
      products: ["C:*"]
      from: 2015
      to: 2024
      base: 2019
      measures:
        - kind: fragility_rank
          from: 2015
          to: 2024
          en: "All chain stages ranked each year by exporter concentration and supplier HHI"
          ko: "모든 사슬 단계를 해마다 수출국 집중도와 공급국 HHI로 순위를 매깁니다"
        - kind: fragility_rank
          importer: KOR
          from: 2015
          to: 2024
          en: "Korea's import basket scored the same way: each stage's fragility weighted by its share of Korea's imports"
          ko: "한국의 수입 바스켓을 같은 방식으로 채점합니다. 각 단계의 취약성을 한국 수입에서 그 단계가 차지하는 비중으로 가중합니다."
      plan_numbers:
        en: "All 78 chain stages ranked by fragility each year; Korea's import basket scored the same way"
        ko: "78개 사슬 단계 전부를 해마다 취약성 기준으로 순위를 매깁니다. 한국의 수입 바스켓도 같은 방식으로 채점합니다"
    scenario:
      kind: none
      product: null
      supplier: null
      cut: null
      period: null
      down_stage: null
      en: "None: this case is the map the other scenarios start from"
      ko: "시나리오는 없습니다. 이 사례는 다른 시나리오들이 출발하는 지도입니다."
    korea:
      en: "The plan gives no Korean number for this case. Korea's import basket is scored the same way each year, so the stages where Korea buys most from the most concentrated sellers come first."
      ko: "계획서에는 이 사례의 한국 수치가 없습니다. 한국의 수입 바스켓도 해마다 같은 방식으로 채점합니다. 한국이 가장 집중된 공급국에서 가장 많이 수입하는 단계가 맨 앞에 옵니다."
    limits:
      en: "Concentration is not the same as irreplaceability: the BIS bulletin weighs centrality against trade elasticities, and some concentrated goods are easy to source elsewhere. Codes mix products (see each stage's caveat), production that never trades is invisible, and indirect exposure through inputs is larger than direct trade shows (Baldwin, Freeman and Theodorakopoulos, further reading). Korniyenko, Pinat and Dew build their ranking on a product-level network of their own, and Massara and Errico rank economies, not goods."
      ko: "집중도가 높다고 대체가 불가능한 것은 아닙니다. BIS 불레틴은 중심성을 무역탄력성과 함께 고려합니다. 집중된 상품 가운데 일부는 다른 공급처에서 쉽게 조달할 수 있습니다. 코드에는 여러 제품이 섞여 있습니다(각 단계의 주의 사항 참조). 교역되지 않는 생산은 자료에 나타나지 않습니다. 투입재를 거친 간접 노출은 직접 교역에 나타나는 것보다 큽니다(볼드윈·프리먼·테오도라코풀로스, 더 읽을거리). 코르니옌코·피나트·듀는 자체 품목 단위 네트워크로 순위를 매겼습니다. 마사라와 에리코는 상품이 아니라 경제의 순위를 매깁니다."

